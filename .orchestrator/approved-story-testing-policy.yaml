version: 6
name: APPROVED_STORY_TESTING_FANOUT
status: ACTIVE
source_backlog: BL-002
post_approval_code_conformance_policy: .orchestrator/post-approval-code-conformance-policy.yaml
approval_gate:
  required_state: APPROVED_OR_REAPPROVED_FOR_CURRENT_REVISED_CONTRACT
  source_of_approval: EXPLICIT_USER_APPROVAL_ONLY
  auto_approval: forbidden
  global_business_rework_policy: BL-002/story-business-behavior-rework-policy.yaml
  historical_approval_does_not_approve_materially_reworked_contract: true
  development_change_backlog: BL-010/development-change-task-queue.csv
  development_implementation_does_not_imply_story_approval: true
post_approval_reverse_engineering_conformance_gate:
  required: true
  queue: BL-002/post-approval-code-conformance-task-queue.csv
  applies_to: ALL_REVERSE_ENGINEERED_STORIES_AFTER_EXPLICIT_USER_APPROVAL_OR_REAPPROVAL
  purpose: VERIFY_APPROVED_STORY_STILL_CORRESPONDS_TO_GOVERNED_APPLICATION_CODE_BEFORE_TEST_FANOUT
  required_checks:
    - controller_and_endpoint_identity
    - request_and_response_contract
    - service_and_service_implementation_binding
    - dao_repository_binding
    - entity_and_database_read_write_identity
    - rendered_template_and_visible_fields_when_applicable
    - validation_and_current_state_gaps
    - persistence_side_effects_and_transactions
    - visible_success_and_error_outcomes
    - same_page_related_operations
    - reference_selector_behavior_when_applicable
  pass_state: CODE_CONFORMANCE_VERIFIED_PASS
  drift_state: STORY_CODE_DRIFT_DETECTED
  drift_behavior:
    - block_BL004_BL005_BL009_fanout
    - record_exact_story_vs_code_mismatch
    - automatically_create_or_reuse_BL010_development_task_when_drift_is_automatable_code_gap
    - automatically_execute_minimal_safe_code_rework_through_chatgpt_when_claim_and_source_binding_are_valid
    - automatically_rerun_story_code_conformance_after_implementation
    - return_story_for_explicit_reapproval_if_contract_changes_materially
  fanout_requires_pass: true
automated_code_rework:
  enabled: true
  policy: .orchestrator/post-approval-code-conformance-policy.yaml
  backlog: BL-010
  queue: BL-010/development-change-task-queue.csv
  execution_host: CHATGPT_ONLY
  github_role: DURABLE_STORAGE_AND_AUDIT_ONLY
  github_actions: forbidden
  github_runner: forbidden
  idempotent_task_key: STORY_ID_PLUS_SOURCE_FINGERPRINT_PLUS_DEFECT_FINGERPRINT
  duplicate_task_for_same_key: forbidden
  source_change_rule: MINIMAL_SAFE_CHANGE_ONLY
  required_flow:
    - classify_conformance_drift
    - create_or_reuse_BL010_task
    - determine_read_write_sets_and_dependencies
    - acquire_resource_claim
    - resolve_exact_governed_source_binding
    - implement_code_change
    - validate_changed_source_and_contract
    - execute_available_tests
    - persist_changed_file_and_validation_evidence
    - release_claim
    - rerun_post_approval_code_conformance
  runtime_not_available_state: SOURCE_VALIDATED_RUNTIME_NOT_EXECUTED
  runtime_not_available_is_pass: false
  material_story_contract_change_state: REAPPROVAL_REQUIRED
  auto_reapproval: forbidden
fanout:
  gate: ONLY_AFTER_EXPLICIT_APPROVAL_OR_REAPPROVAL_AND_POST_APPROVAL_CODE_CONFORMANCE_PASS
  BL-004:
    purpose: JUNIT_UNIT_TEST_GENERATION_EXECUTION_AND_COVERAGE
    framework: JUNIT_5
    required_outputs: [BL-004/stories/<story-id>.md, BL-004/generated-tests/<story-id>/*Test.java, BL-004/unit-test-task-queue.csv]
  BL-005:
    purpose: JUNIT_TESTCONTAINERS_INTEGRATION_TEST_CREATION_EXECUTION_AND_COVERAGE
    framework: JUNIT_5
    integration_runtime: POSTGRESQL_TESTCONTAINERS
    required_outputs: [BL-005/stories/<story-id>.md, BL-005/generated-tests/<story-id>/*IntegrationTest.java, BL-005/integration-test-task-queue.csv]
  BL-009:
    purpose: HUMAN_READABLE_TEST_CASES_TEST_DATA_EXECUTABLE_TEST_CODE_AND_LIVE_VALIDATION
    framework: JUNIT_5
    required_outputs: [BL-009/stories/<story-id>.md, BL-009/test-data/<story-id>.csv, BL-009/test-data/<story-id>.md, BL-009/generated-tests/<story-id>/*Test.java, BL-009/test-case-task-queue.csv]
    executable_test_contract:
      every_test_case_requires_code_mapping: true
      every_test_data_row_requires_code_consumption: true
      generated_code_is_not_behavior_pass: true
      exact_frozen_source_binding_required_for_application_behavior_pass: true
      execution_evidence_required_for_pass: true
      coverage_link_required: true
    test_data_format_contract:
      csv_is_machine_readable_source: true
      human_readable_companion_required: true
      human_readable_path: BL-009/test-data/<story-id>.md
      human_readable_sections_required: [purpose_and_scope, test_data_explanation, test_data_table]
      table_must_contain_actual_test_data_values: true
      reference_only_table_forbidden: true
      row_parity_with_csv_required: true
      data_id_parity_with_csv_required: true
      semantic_value_parity_with_csv_required: true
      secrets_rule: runtime_secret_placeholders_may_be_shown_but_real_secrets_must_not_be_persisted
coverage:
  tool: JACOCO
  actual_execution_only: true
  required_metrics: [line, branch]
  track_separately: [UNIT, INTEGRATION, COMBINED]
  never_infer_coverage_from_generated_code: true
orchestrator_rule:
  startup:
    - read_this_policy
    - read_post_approval_code_conformance_policy
    - reconcile_current_revised_story_approval_states
    - reconcile_post_approval_code_conformance_queue
    - enqueue_missing_conformance_tasks_idempotently
    - suspend_revised_behavior_fanout_until_code_conformance_pass
    - route_automatable_drift_to_BL010
    - automatically_execute_eligible_BL010_code_rework
    - rerun_conformance_after_code_rework
    - suspend_fanout_when_reapproval_required
    - materialize_downstream_artifacts_only_after_both_gates
  selection_priority:
    - approval_projection_reconciliation
    - post_approval_reverse_engineering_code_conformance_verification
    - BL-010_automated_code_rework_for_conformance_drift_or_user_required_story_corrections
    - post_rework_code_conformance_rerun
    - current_contract_reapproval_gate_if_material_change
    - missing_fanout_eligible_story_artifacts
    - incomplete_BL-009_human_readable_test_data
    - missing_BL-009_executable_test_code
    - executable_BL-004_unit_tests
    - executable_BL-005_testcontainers_tests
    - executable_BL-009_data_driven_or_runtime_tests
    - coverage_gap_test_refinement
    - BL-009_live_test_data_validation
    - other_eligible_story_enrichment
  execution:
    github_actions: forbidden
    github_runner: forbidden
    chatgpt_side_only: true
    generated_test_is_not_execution_pass: true
    exact_frozen_source_binding_required_before_application_behavior_pass: true
    persist_unit_local_test_evidence_immediately: true
watchdog_reporting:
  required: true
  fields:
    - historical_approved_story_count
    - current_revised_contract_approved_or_reapproved_count
    - post_approval_code_conformance_pending_ids
    - post_approval_code_conformance_pass_ids
    - post_approval_code_drift_ids
    - automated_code_rework_queued_in_progress_complete_ids
    - reapproval_required_ids
    - fanout_eligible_ids
    - BL-004_queued_generated_executed_pass_failed_and_coverage
    - BL-005_queued_generated_executed_pass_failed_and_coverage
    - BL-009_test_catalogues_data_code_mapping_execution_and_coverage
current_seed:
  historical_approved_story_ids: [STORY-0001]
  current_revised_contract_approved_or_reapproved_story_ids: [STORY-0001, STORY-0013]
  post_approval_code_conformance_pending_ids: [STORY-0001, STORY-0013]
  post_approval_code_conformance_pass_ids: []
  revised_fanout_eligible_ids: []
