version: 5
name: RESOURCE_SCOPED_LEASES_AND_CLAIMS
supersedes:
  - version: 4
    name: RESOURCE_SCOPED_LEASES_AND_CLAIMS
  - version: 3
    name: RESOURCE_SCOPED_LEASES_AND_CLAIMS
  - version: 2
    name: SELF_EXPIRING_SINGLETON_LEASE
principles:
  - No global backlog lock.
  - Concurrency is decided by dependency and write-set collision, not backlog number.
  - Independent work units in the same backlog may execute concurrently.
  - Different backlogs may execute concurrently.
  - Same writable resource is single-writer.
  - BL-008 database-write parallelism is exactly 1.
  - GitHub is durable control/audit persistence only; GitHub Actions/runners remain forbidden.
  - Execution is performed by ChatGPT; external worker runtimes remain forbidden unless governance is explicitly changed.
  - Unit-local durable evidence is persisted before aggregate projections.
  - BL-002 registered Story parity with physical Story files is a governed completion gate.
run_scope:
  required: true
  modes:
    TARGETED:
      rule: Work only on explicitly requested backlog/work units; do not fall through to unrelated backlogs when blocked.
    CONTINUOUS:
      rule: Replan across all eligible backlogs and independent work units.
    RECOVERY:
      rule: Work only on blocker, stale-state, reconciliation, architecture recovery, or parity-repair units explicitly in scope.
resource_claims:
  claim_granularity: writable_resource_or_irreducible_work_unit
  claim_identity_examples:
    - BL-002|STORY-0054|BL-002/stories/STORY-0054.md
    - BL-002|MATERIALIZE-STORY-0001|BL-002/stories/STORY-0001.md
    - BL-008|DB-WRITE-SLOT|SUPABASE:xipkywwvzvrwcqnkifuv:postgres
  compatibility_rule: Two claims may coexist only when their write sets do not intersect and neither depends on incomplete output owned by the other.
  read_only_parallelism: allowed
  same_file_parallel_writers: forbidden
  dependency_rule: A dependent unit is not dispatchable until its prerequisite durable evidence is satisfied.
claim_storage:
  preferred_layout: .orchestrator/claims/<backlog>/<claim-id>.yaml
  one_claim_per_file: true
  shared_claim_registry_for_runtime_locking: forbidden
  rationale: Avoid turning the claim registry itself into a global mutex.
claim_liveness:
  stale_after_minutes: 15
  authoritative_fields:
    - heartbeat_at
    - lease_expires_at
  rule: ACTIVE claim is authoritative only before lease_expires_at.
  expired_rule: Expired claims have no execution authority and cannot indefinitely block another claimant.
  stale_recovery:
    - Reconcile durable evidence only.
    - Persist RECOVERED_STALE_INVOCATION or RECOVERED_STALE_CLAIM evidence on the affected resource.
    - Never invent original completion time.
    - If optimistic-concurrency SHA changed, refetch and re-evaluate before retry.
legacy_singleton_transition:
  file: .orchestrator/invocation-lease.yaml
  status: DEPRECATED_AS_GLOBAL_MUTEX
  rule: A fresh legacy invocation lease protects only the resources explicitly listed in its claims; its broad scope field does not block unrelated resources.
  migration_rule: Existing active legacy lease must not be rewritten by an unrelated architecture/BL-008 run unless one of its explicit claimed resources conflicts.
  retirement: Stop creating new global singleton leases after all orchestrator prompts adopt resource claims.
shared_aggregate_state:
  files:
    - .orchestrator/last-run.yaml
    - BL-002/enrichment-progress.yaml
  role: aggregate_or_checkpoint_only
  direct_worker_write_rule: Workers should persist unit-local evidence first; aggregate files are updated by a dedicated aggregator/checkpointer using optimistic concurrency.
  authority_rule: Unit-local durable evidence is authoritative for completed work; aggregate cursor lag must not erase completed unit evidence.
  checkpoint_rule:
    after_every_completed_or_blocked_unit: true
    after_each_dispatch_wave_when_available: true
    defer_all_updates_until_terminalization: forbidden
BL-002:
  parallelism:
    independent_R1_units: allowed
    R2_before_R1_gate: forbidden
    auto_approval: forbidden
  unit_outputs:
    story_file_pattern: BL-002/stories/STORY-*.md
    status_file_pattern: BL-002/work-status/STORY-*.yaml
  aggregate_file: BL-002/enrichment-progress.yaml
  aggregate_single_writer: true
  canonical_story_register: BL-002/story-register.csv
  materialization_queue: BL-002/materialization-task-queue.csv
  materialization_parity:
    required_story_count: 134
    rule: Every story_id in story-register.csv must have exactly one physical BL-002/stories/<story-id>.md file.
    priority:
      R1: 1
      R2: 2
    queue_reconciliation: Recompute the set difference between registered Story IDs and physical Story files at invocation start/replan and reconcile materialization-task-queue.csv before selecting new work.
    review_artifact_gate: A Story is not a complete review artifact until its physical file exists and is synchronized with governed evidence.
    clarification_artifact_rule: NEEDS_CLARIFICATION does not waive physical materialization; create a file that documents the exact evidence gap without guessing.
    completion: 134 validated physical Story files and zero pending materialization tasks.
    separate_metrics:
      - physical_materialization
      - strict_field_ui_completion
      - review_state
      - approval_status
      - use_case_grouping
      - testing_readiness
  completion_rule: SOURCE_DETAIL_REVIEW_REQUIRED or a recorded source-detail gap is not strict field/UI completion.
  next_work_resolution:
    hardcoded_story_pointer: forbidden
    rule: Reconcile unit-local evidence, story-file parity, materialization queue, and aggregate progress first; then resolve the currently eligible unfinished unit dynamically on every invocation.
BL-008:
  independent_read_only_units_parallel: allowed
  database_write_semaphore:
    identity: BL-008|DB-WRITE-SLOT|SUPABASE:xipkywwvzvrwcqnkifuv:postgres
    capacity: 1
  migration_execution:
    mode: FLYWAY_10_JAVA_API_ONLY
    manual_sql: forbidden
    supabase_native_replay: forbidden
    clean: forbidden
  blocker_isolation_rule: A BL-008 blocker must not block BL-002 unless the run scope is TARGETED to BL-008, in which case unrelated BL-002 work must not be substituted.
  target_scope_rule: A TARGETED BL-008 recovery run may proceed concurrently with BL-002 when its write set does not intersect the active BL-002 claim set.
  unchanged_runtime_blocker_policy:
    repeat_identical_network_probe: forbidden
    repeat_identical_testcontainers_backend_probe: forbidden
    retry_condition: Retry only after material execution-environment capability evidence changes.
    unchanged_action: Persist zero BL-008 writes and immediately return capacity to other eligible in-scope work.
planning:
  algorithm:
    - RECONCILE durable unit evidence.
    - RECONCILE BL-002 registered Story IDs against physical Story files and materialization queue.
    - BUILD dependency graph and write sets.
    - SELECT all eligible safe-independent units up to available worker capacity.
    - CLAIM resources independently.
    - DISPATCH concurrently.
    - Persist worker-local evidence as soon as a unit reaches a durable checkpoint.
    - Aggregate shared progress with optimistic concurrency.
    - REPLAN immediately after every completion or blocker.
  max_safe_independent_workers: 10
productive_run_window:
  target_minutes: 30
  hard_minimum_for_correctness: false
  rule: Use as much productive execution time as the platform actually supplies, up to the target; never idle merely to satisfy the clock.
  platform_limited_runtime:
    accepted_terminal_classification: RUNTIME_WINDOW_FORCED_STOP
    valid_when:
      - eligible work may remain
      - voluntary_early_stop is false
      - all completed unit-local evidence available before cutoff is durable
      - claims that can be released before cutoff are released
    compliance: A platform-forced sub-30-minute invocation is not a policy failure by itself.
  voluntary_stop_rule: While eligible in-scope work remains and execution is still available, voluntary terminalization is forbidden; REPLAN -> CLAIM -> DISPATCH must continue.
  checkpoint_policy:
    after_every_completed_or_blocked_unit: true
    aggregate_checkpoint_after_each_dispatch_wave_when_available: true
    do_not_defer_all_durable_state_until_end_of_run: true
  targeted_blocked_exception: A TARGETED run may terminate early when its scoped work has a hard unrecoverable blocker and no other in-scope recovery/read-only unit remains.
github_role:
  purpose: durable_control_and_audit_persistence
  github_actions: forbidden
  github_runner: forbidden
  external_worker_runtime: forbidden
