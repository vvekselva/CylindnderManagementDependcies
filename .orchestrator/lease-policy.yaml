version: 8
name: RESOURCE_SCOPED_LEASES_AND_CLAIMS
supersedes:
  - version: 7
    name: RESOURCE_SCOPED_LEASES_AND_CLAIMS
principles:
  - No global backlog lock.
  - Concurrency is decided by dependency and write-set collision, not backlog number.
  - Independent work units may execute concurrently when safe.
  - Same writable resource is single-writer.
  - GitHub is durable control/audit persistence only; GitHub Actions/runners remain forbidden.
  - ChatGPT performs orchestration/source-analysis/authoring work.
  - BL-008 is an explicit exception allowing the user to run the normal Flyway apply on the existing database and return the result.
  - Unit-local durable evidence is persisted before aggregate projections.
  - BL-002 registered Story parity with physical Story files is a governed completion gate.
  - A run-local blocker must not automatically disable the recurring Production Fire scheduler.

run_scope:
  required: true
  modes:
    TARGETED:
      rule: Work only on explicitly requested backlog/work units.
    CONTINUOUS:
      rule: Replan across all eligible independent backlogs/units.
    RECOVERY:
      rule: Work only on blocker, stale-state, reconciliation, architecture recovery or parity-repair units in scope.

resource_claims:
  claim_granularity: writable_resource_or_irreducible_work_unit
  compatibility_rule: Two claims may coexist only when write sets do not intersect and neither depends on incomplete output owned by the other.
  read_only_parallelism: allowed
  same_file_parallel_writers: forbidden
  dependency_rule: A dependent unit is not dispatchable until prerequisite durable evidence is satisfied.

claim_storage:
  preferred_layout: .orchestrator/claims/<backlog>/<claim-id>.yaml
  one_claim_per_file: true
  shared_claim_registry_for_runtime_locking: forbidden

claim_liveness:
  stale_after_minutes: 15
  authoritative_fields: [heartbeat_at, lease_expires_at]
  expired_rule: Expired claims have no execution authority.
  stale_recovery:
    - Reconcile durable evidence only.
    - Persist RECOVERED_STALE_INVOCATION or RECOVERED_STALE_CLAIM evidence.
    - Never invent original completion time.
    - Refetch/re-evaluate after optimistic-concurrency conflicts.

legacy_singleton_transition:
  file: .orchestrator/invocation-lease.yaml
  status: DEPRECATED_AS_GLOBAL_MUTEX
  rule: Broad legacy scope cannot block unrelated resources.

shared_aggregate_state:
  files: [.orchestrator/last-run.yaml, BL-002/enrichment-progress.yaml]
  role: aggregate_or_checkpoint_only
  direct_worker_write_rule: Workers persist unit-local evidence first; aggregator/checkpointer updates shared projections.
  checkpoint_rule:
    after_every_completed_or_blocked_unit: true
    after_each_dispatch_wave_when_available: true
    defer_all_updates_until_terminalization: forbidden

scheduler_policy:
  production_fire:
    recurring: true
    expected_cadence: hourly_around_15
    run_local_blocker_scope: current_invocation_only
    automatic_disable_for_blocker: forbidden
    allowed_disable_conditions:
      - explicit_user_instruction
      - deliberate_schedule_replacement_or_supersession
      - proven_scheduler_level_defect
      - duplicate_fire_safety_condition
    disable_reason_must_be_recorded: true
  watchdog:
    recurring: true
    expected_cadence: hourly_around_50
    read_only: true
    lifecycle_independent_from_production_fire: true

BL-002:
  parallelism:
    independent_R1_units: allowed
    R2_before_R1_gate: forbidden
    auto_approval: forbidden
  canonical_story_register: BL-002/story-register.csv
  materialization_queue: BL-002/materialization-task-queue.csv
  materialization_parity:
    required_story_count: 134
    rule: Every story_id in story-register.csv must have exactly one physical BL-002/stories/<story-id>.md file.
    priority: {R1: 1, R2: 2}
    completion: 134 validated physical Story files and zero pending materialization tasks.
  completion_rule: SOURCE_DETAIL_REVIEW_REQUIRED or a recorded source-detail gap is not strict field/UI completion.
  next_work_resolution:
    hardcoded_story_pointer: forbidden
    rule: Reconcile unit-local evidence, story-file parity, materialization queue and aggregate progress before resolving next work.

BL-008:
  mode: LOCAL_FLYWAY_EXISTING_DATABASE_HANDOFF
  ChatGPT_role:
    - analyze_source_and_migrations
    - author_additive_migrations
    - package_updated_source
    - analyze_user_returned_flyway_result
    - author_follow_up_migration_when_additive_repair_is_possible
  user_role:
    - run_normal_flyway_migration_on_existing_database
    - return_flyway_result_or_error
  database_policy:
    target: EXISTING_DATABASE
    preserve_data: true
    preserve_schema_history: true
    flyway_clean: forbidden
    database_recreation: forbidden
    schema_drop_recreate: forbidden
    history_table_clear: forbidden
    rebaseline_for_handoff: forbidden
    already_applied_migrations: do_not_rerun
    pending_selection: Flyway_existing_history
  migration_policy:
    additive_by_default: true
    current_authored_migration: V171__Customer_Order_Request_View_Compatibility.sql
    historical_rewrite_requires_explicit_user_approval: true
    raw_manual_sql_substitution: forbidden
  current_state: WAITING_FOR_USER_EXISTING_DATABASE_FLYWAY_RESULT
  blocker_isolation_rule: Waiting for the user's BL-008 Flyway result must not block BL-002.

planning:
  algorithm:
    - RECONCILE durable unit evidence.
    - RECONCILE BL-002 Story parity/materialization queue.
    - BUILD dependency graph and write sets.
    - SELECT safe-independent units.
    - CLAIM resources independently.
    - DISPATCH and persist unit evidence.
    - REPLAN immediately after completion or blocker.
  max_safe_independent_workers: 10

productive_run_window:
  target_minutes: 30
  hard_minimum_for_correctness: false
  rule: Use productive execution time actually available; never idle merely to satisfy the clock.
  voluntary_stop_rule: While eligible ChatGPT-executable work remains and execution is available, continue REPLAN -> CLAIM -> DISPATCH.
  platform_limited_runtime:
    accepted_terminal_classification: RUNTIME_WINDOW_FORCED_STOP

github_role:
  purpose: durable_control_and_audit_persistence
  github_actions: forbidden
  github_runner: forbidden
  external_worker_runtime: forbidden
  user_manual_execution_general: forbidden
  BL008_existing_database_flyway_handoff: allowed
