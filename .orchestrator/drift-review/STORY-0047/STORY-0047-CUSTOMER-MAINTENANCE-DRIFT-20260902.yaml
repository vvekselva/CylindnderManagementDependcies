tests_required:
  - CustomerUpdateService unit test: changing customerName/GST persists both scalar fields when uniqueness validation passes.
  - CustomerUpdateService unit test: duplicate GST belonging to another customer is rejected and no save occurs.
  - CustomerUpdateController MVC test: validation failure renders DisplayCustomer and preserves customerId plus validation errors.
  - CustomerUpdateController MVC test: successful update redirects to /fetchCustomerByPage?pageNumber=1&itemsPerPage=10.
  - CustomerUpdateController MVC test: governed application error follows the approved redirect/error behavior.
  - Template/MVC assertion: DisplayCustomer identifies the page as Update Customer and posts to /updateCustomer.
