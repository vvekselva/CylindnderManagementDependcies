current_behavior:
  - DisplayCustomer.html is the actual customer-maintenance form and POSTs to /updateCustomer with hidden customerDto.customerId.
  - The same update page is visibly titled 'Register Customer' and breadcrumbed 'New Registration', which misrepresents the operation.
  - CustomerUpdateController handles POST /updateCustomer but its validation-error branch tests/casts the exception DTO as CustomerIngestionRequestDto even though CustomerUpdateService/validator throw CustomerUpdateRequestDto evidence.
  - CustomerUpdateController returns UC01RegisterCustomer on validation failure rather than the DisplayCustomer update form.
  - The general CylinderManagementApplicationException branch constructs ModelAndView(BACK_LINK) without the redirect: prefix.
  - CustomerUpdateService validates customerName/GST and checks changed GST ownership, but the executable scalar mapper is commented out; customerName and gstNumber are not assigned to the managed CustomerDo before save.
approved_story_behavior:
  - Customer maintenance must preserve the customer identity, validate submitted customer data, persist intended customer changes, keep the user on the maintenance context when validation fails, and visibly identify the page as customer maintenance rather than new registration.
business_impact:
  - A user can believe customer name/GST were updated although the service currently persists phone/address collection changes without source-proved scalar customerName/GST assignment.
  - Validation errors can return the wrong page/form context and can fail to propagate update-specific validation state because of the ingestion-DTO type check.
  - The page title/breadcrumb can cause operational confusion by presenting an edit as a new registration.
  - General application exceptions may resolve an invalid view name instead of redirecting safely to the customer list.
