current_behavior:
  - SupplierIngestionRequestValidator validates Supplier name, GST, phone and address/geography and performs exact database-backed duplicate checks for GST and phone.
  - When GST is nonblank but malformed, regex validation can flag it but code still executes Integer.parseInt(gstNumber.substring(0,2)); short/nonnumeric input can escape controlled validation as a runtime exception.
  - supplierDto.getPhoneNumber() is dereferenced before a PhoneNumberDto-null guard, and blank/null phone text is recorded as invalid but processing then continues to phoneNumber.replaceAll(...); malformed binding can therefore cause a null dereference instead of only controlled validation.
  - supplierDto.getAddress() is dereferenced before an AddressDto-null guard; malformed requests can escape the intended field-level validation path.
  - SupplierIngestionService resolves City/State/Country with findById(...).get(); structurally valid but nonexistent IDs can surface as NoSuchElementException instead of controlled reference validation.
  - Supplier Name candidate input has no database-backed similar-supplier display while typing, although /search/supplier/{searchText} exists; GST and phone are the current authoritative duplicate keys.
business_impact:
  - malformed GST/phone/address payloads can return an uncontrolled server error rather than stable validation feedback.
  - stale/nonexistent geography identities can fail outside the intended input-validation branch.
  - operators cannot proactively see similar Supplier names before Save, while current exact GST/phone checks still prevent duplicate legal/contact identities.
