current_behavior:
  - POST /vehicleLoad delegates to VehicleLoadIngestionService after request validation.
  - VehicleLoadIngestionValidator requires a VehicleTripDto object, but the checks for vehicleTripId null/nonpositive and database existence are commented out at approximately lines 79-97.
  - VehicleLoadIngestionService immediately resolves vehicleTripJpaDao.findById(request.vehicleTripId) at lines ~151-154; a null/nonexistent trip therefore reaches service reference resolution rather than a controlled validator error.
  - The validator quantity-null condition at lines ~223-230 checks quantityFullForDelivery twice and never checks quantityEmptyForSupplier, so a null empty-for-supplier quantity can pass this guard and later participate in numeric comparisons in VehicleLoadIngestionService.
  - Cylinder lines are otherwise strongly validated for existence and Yard-only location exclusivity; after a successful load, those cylinders leave active Yard inventory, which naturally blocks replay of the same cylinder selection.
  - The service is transactional and changes trip status to Loaded, persists the load/lines and transfers Yard inventory to vehicle logistics in one transaction.
approved_behavior:
  state: PENDING_USER_APPROVAL
  note: No Story approval or new trip/load business rule is inferred. This packet isolates controlled-validation gaps visible in the current source.
business_impact:
  - Missing/invalid trip identity can escape field-level validation and fail deeper in the transaction.
  - A null quantityEmptyForSupplier can escape the intended header count validation and cause a runtime numeric-comparison failure instead of stable validation feedback.
  - Replay after success is largely blocked by cylinder location transfer, but this does not replace validating the trip identity/header before mutation.
