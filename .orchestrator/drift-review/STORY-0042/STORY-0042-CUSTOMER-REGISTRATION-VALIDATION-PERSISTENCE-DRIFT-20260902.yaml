current_behavior:
  - CustomerIngestionRequstValidator validates customer name, GST, phone collection, addresses and selected geography/address-type identities and performs exact database-backed duplicate checks for GST and phone.
  - When GST is nonblank but fails the GST regex, the validator still executes Integer.parseInt(gstNumber.substring(0,2)); malformed short or nonnumeric input can therefore escape the intended controlled validation flow as a runtime exception.
  - When an individual submitted phone value is blank/null, the validator records PHONE_NUMBER_INVALID but then continues to phoneNumber.replaceAll(...); a null value can therefore throw instead of returning only controlled validation evidence.
  - CustomerIngestionService resolves City/State/Country with findById(...).get(); the validator checks submitted IDs structurally but does not source-prove existence of those IDs, so a nonexistent ID can surface as NoSuchElementException instead of controlled reference validation.
  - Controller resolves AddressTypeDto before validation, and CustomerAddressDo has fk_address_type, but CustomerIngestionService constructs CustomerAddressDo without assigning the resolved AddressType; submitted Address Type is therefore not source-proved to persistence on this path.
  - Customer Name candidate entry has no database-backed similar-customer suggestion while typing, although /search/customer/{searchText} exists; GST and phone remain the authoritative duplicate keys in current validation.
business_impact:
  - malformed GST/phone input can produce an uncontrolled server failure rather than stable field-level feedback.
  - a stale/nonexistent geography ID can produce an uncontrolled lookup failure.
  - an operator-selected Address Type can be validated but omitted from the persisted customer-address association.
  - operators cannot proactively see similar Customer names before Save, although authoritative duplicate identity remains GST/phone based.
