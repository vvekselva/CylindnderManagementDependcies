    reason: surface similar master records before insertion without redefining the authoritative business key.
tests_required:
  - one-character/non-numeric GST returns controlled validation and no runtime exception
  - null/blank phone returns controlled validation and no runtime exception
  - nonexistent City/State/Country IDs return controlled validation and no persistence
  - selected Address Type is persisted into customer-address association
  - duplicate GST/phone prechecks remain effective
  - optional Customer Name suggestion behavior if explicitly approved
