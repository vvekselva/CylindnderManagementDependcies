    class: CustomerIngestionRequstValidator
    method: validate
    approximate_anchor: GST lines ~98-165; phone lines ~167-262
    proposed_change: short-circuit state-code parsing unless GST format/length is valid; short-circuit phone normalization when phone is blank/null while retaining collected validation evidence.
    reason: preserve controlled validation for malformed input.
  - repository: vvekselva/CylinderManagement
