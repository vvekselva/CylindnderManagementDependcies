    class: CustomerIngestionService
    method: processRequest
    approximate_anchor: address mapping/resolution lines ~80-104
    proposed_change: resolve City/State/Country with controlled absence handling; assign the already-resolved AddressType from each AddressDto to CustomerAddressDo before persistence.
    reason: persist the selected address classification and avoid uncontrolled missing-reference failures.
  - repository: vvekselva/CylinderManagement
    ref: 3ae6e61442132d94a307275b08dd65fcef228d89
