version: 4
name: CYLINDER_RESOURCE_SCOPED_EXECUTION_ARCHITECTURE
status: ACTIVE
policy_ref: .orchestrator/lease-policy.yaml
human_readable_architecture: .orchestrator/architecture-current.md

execution_model:
  execution_host: CHATGPT
  coordinator_role: plan_reconcile_dispatch_aggregate
  github_role: durable_control_and_audit_persistence_only
  global_mutex: false
  concurrency_basis:
    - dependency_graph
    - write_set_collision
    - database_write_semaphore
  maximum_safe_independent_workers: 10

run_scope_contract:
  required_fields:
    - run_id
    - mode
    - requested_backlogs
    - requested_units
  modes:
    TARGETED:
      fallthrough_to_unrequested_backlog: false
    CONTINUOUS:
      fallthrough_to_other_eligible_backlogs: true
    RECOVERY:
      fallthrough_to_normal_backlog_work: false

worker_contract:
  before_dispatch:
    - determine_read_set
    - determine_write_set
    - verify_dependencies
    - acquire_resource_claim
  while_running:
    - refresh_only_own_claim_heartbeat
    - do_not_mutate_unclaimed_shared_aggregate
  after_unit:
    - persist_unit_local_evidence
    - release_resource_claim
    - notify_or_trigger_aggregate_reconciliation_in_same_invocation_when_available
    - replan

resource_claim_file:
  path_pattern: .orchestrator/claims/<backlog>/<claim-id>.yaml
  required_fields:
    - claim_id
    - backlog
    - unit
    - run_id
    - status
    - read_set
    - write_set
    - acquired_at
    - heartbeat_at
    - lease_expires_at
  statuses:
    - ACTIVE
    - RELEASED
    - RECOVERED_STALE_CLAIM
  collision_rule: Two ACTIVE claims conflict only when write sets intersect, or when one write set intersects the other's required immutable read target in a way that invalidates its evidence.

aggregation:
  strategy: unit_local_first
  global_summary_authoritative_for_locking: false
  checkpointing:
    after_every_completed_or_blocked_unit: true
    after_each_dispatch_wave_when_available: true
    defer_all_state_until_end_forbidden: true
  files:
    .orchestrator/last-run.yaml:
      purpose: compatibility aggregate summary
      direct_worker_writes: false
    BL-002/enrichment-progress.yaml:
      purpose: BL-002 aggregate projection
      direct_story_worker_writes: false
  lost_update_prevention:
    - refetch_current_blob_before_aggregate_write
    - optimistic_concurrency_sha
    - recompute_from_durable_unit_evidence_after_conflict

scheduler_resilience:
  production_fire_recurring_task:
    expected_cadence: hourly_around_15
    performs_real_work: true
    automatic_disable_for_run_local_blocker: forbidden
    run_local_blockers_include:
      - github_durable_write_failure
      - source_detail_gap
      - BL008_runtime_capability_blocker
      - platform_runtime_cutoff
    next_fire_rule: Re-read live durable state and re-evaluate current capabilities independently on every scheduled invocation.
  allowed_disable_conditions:
    - explicit_user_instruction
    - deliberate_schedule_replacement_or_supersession
    - proven_scheduler_level_defect
    - duplicate_fire_safety_condition
  disable_evidence_required: true
  durable_write_failure_rule: Do not claim unwritten progress. Keep the blocker invocation-local and leave the recurring scheduler enabled for the next fire.
  watchdog:
    expected_cadence: hourly_around_50
    read_only: true
    lifecycle_independent_from_production_fire: true
  cross_disable_rule: Production Fire blockers must not disable the watchdog; watchdog failures must not disable the Production Fire.

BL-001:
  canonical_endpoint_count: 134
  state: COMPLETE_READ_ONLY
  source_integrity_regression_required_to_reopen: true

BL-002:
  canonical_story_count: 134
  release_counts:
    R1: 88
    R2: 46
  release_gate: R1_FIRST
  candidate_pool: all unfinished safe-independent R1 strict-field-UI units plus all unresolved R1 physical-story materialization gaps
  parallel_story_execution: true
  per_story_output: BL-002/stories/<story-id>.md
  per_story_status: BL-002/work-status/<story-id>.yaml
  shared_progress_update: aggregator_only
  story_register: BL-002/story-register.csv
  story_definition: BL-002/STORY-DEFINITION.md
  materialization:
    queue: BL-002/materialization-task-queue.csv
    queue_is_durable_work_ssot: true
    parity_gate: registered_story_ids_must_equal_physical_story_file_ids
    required_physical_story_files: 134
    priority_rule:
      R1: 1
      R2: 2
    statuses:
      - PENDING
      - CLAIMED
      - MATERIALIZED
      - VALIDATED
      - BLOCKED
    reconciliation_rule: Before selecting new BL-002 work, diff story-register.csv against BL-002/stories/STORY-*.md, reconcile the queue, and repair any aggregate count drift.
    review_rule: A Story cannot be offered as a complete review artifact unless its physical .md file exists and is synchronized with current governed evidence. NEEDS_CLARIFICATION stories must still have a physical clarification-aware Story file that records the evidence gap without inventing behavior.
    completion_rule: BL-002 physical materialization is complete only at 134/134 validated Story files and zero pending materialization tasks.
    independence_rule: Materialization status is separate from strict field/UI enrichment, review state, approval status, use-case grouping, and testing readiness.
  approvals:
    automatic: false
    user_required: true
  strict_completion:
    requires_full_applicable_source_contract: true
    source_detail_review_required_is_complete: false
    recorded_source_detail_gap_is_complete: false
  scheduling_rule: Story numbering alone is not a dependency; only proven dependency edges or write-set conflicts serialize stories.
  next_work_resolution:
    hardcoded_story_pointer: forbidden
    rule: Reconcile unit-local evidence, physical-file parity, materialization queue, and aggregate progress before dynamically resolving the next eligible unit.

BL-008:
  execution_mode: FLYWAY_10_JAVA_API_ONLY
  execution_owner: CHATGPT
  provider: SUPABASE
  project: xipkywwvzvrwcqnkifuv
  database: postgres
  postgresql_version: '17.6'
  persistent_test_target: true
  direct_external_production: false
  governed_source_repository: vvekselva/CylinderManagement
  governed_source_commit: 3ae6e61442132d94a307275b08dd65fcef228d89
  migration_path: cylinder.datascripts/src/main/resources/db/migration
  flyway_version: 10.0.0
  runner: BL-008/java/FlywayJavaRunner.java
  schema: public
  clean_disabled: true
  baseline_on_migrate: false
  out_of_order: false
  one_target_migration_at_a_time: true
  database_write_parallelism: 1
  credentials_runtime_only: true
  raw_manual_sql: forbidden
  supabase_native_replay: forbidden
  current_runtime_blockers:
    outbound_postgres:
      fingerprint: BL008_CHATGPT_EXECUTION_RUNTIME_OUTBOUND_POSTGRES_EGRESS_UNAVAILABLE
      parent: BL008_SUPABASE_JDBC_ROUTE_UNAVAILABLE_FROM_CHATGPT_JAVA_RUNTIME
      subreason: SANDBOX_DNS_AND_RAW_OUTBOUND_TCP_BLOCKED_NO_PROXY
    testcontainers:
      fingerprint: BL008_CHATGPT_EXECUTION_RUNTIME_TESTCONTAINERS_BACKEND_UNAVAILABLE
  unchanged_runtime_blocker_policy:
    repeat_identical_network_probe: forbidden
    repeat_identical_testcontainers_probe: forbidden
    retry_condition: Retry only after material execution-environment capability evidence changes.
    migration_write_delta: 0
    capacity_behavior: Return immediately to other eligible in-scope work.
  retry_sequence_when_capability_changes:
    - prove_target_identity_and_history
    - flyway_info
    - prove_first_pending
    - validateWithResult
    - migrate_exactly_one_target
    - flyway_info
    - verify_success_history_schema_integrity
    - persist_evidence
    - stop_before_next_migration_requirement

legacy_transition:
  invocation_lease_file: .orchestrator/invocation-lease.yaml
  treatment: compatibility_only
  explicit_claims_only: true
  broad_scope_is_not_lock: true
  new_runs_should_use_resource_claims: true

productive_runtime:
  target_minutes: 30
  hard_minimum_for_correctness: false
  never_idle_to_reach_target: true
  voluntary_stop_with_eligible_work: forbidden
  platform_forced_short_run_classification: RUNTIME_WINDOW_FORCED_STOP

safety:
  github_actions: forbidden
  github_runner: forbidden
  external_worker_runtime: forbidden
  user_manual_execution: forbidden
  credentials_in_git: forbidden
  raw_manual_sql: forbidden
  zero_transient_logs_at_terminal: true
