version: 6
name: CYLINDER_RESOURCE_SCOPED_EXECUTION_ARCHITECTURE
status: ACTIVE
policy_ref: .orchestrator/lease-policy.yaml
human_readable_architecture: .orchestrator/architecture-current.md

execution_model:
  execution_host: CHATGPT_WITH_BL008_USER_APPLY_HANDOFF
  coordinator_role: plan_reconcile_dispatch_aggregate
  github_role: durable_control_and_audit_persistence_only
  global_mutex: false
  concurrency_basis:
    - dependency_graph
    - write_set_collision
    - database_write_semaphore
  maximum_safe_independent_workers: 10

run_scope_contract:
  required_fields: [run_id, mode, requested_backlogs, requested_units]
  modes:
    TARGETED: {fallthrough_to_unrequested_backlog: false}
    CONTINUOUS: {fallthrough_to_other_eligible_backlogs: true}
    RECOVERY: {fallthrough_to_normal_backlog_work: false}

worker_contract:
  before_dispatch:
    - determine_read_set
    - determine_write_set
    - verify_dependencies
    - acquire_resource_claim
  while_running:
    - refresh_only_own_claim_heartbeat
    - do_not_mutate_unclaimed_shared_aggregate
  after_unit:
    - persist_unit_local_evidence
    - release_resource_claim
    - notify_or_trigger_aggregate_reconciliation_in_same_invocation_when_available
    - replan

resource_claim_file:
  path_pattern: .orchestrator/claims/<backlog>/<claim-id>.yaml
  statuses: [ACTIVE, RELEASED, RECOVERED_STALE_CLAIM]
  collision_rule: Two ACTIVE claims conflict only when write sets intersect or a write invalidates another unit's required immutable read target.

aggregation:
  strategy: unit_local_first
  global_summary_authoritative_for_locking: false
  checkpointing:
    after_every_completed_or_blocked_unit: true
    after_each_dispatch_wave_when_available: true
    defer_all_state_until_end_forbidden: true
  files:
    .orchestrator/last-run.yaml: {purpose: compatibility_aggregate_summary, direct_worker_writes: false}
    BL-002/enrichment-progress.yaml: {purpose: BL-002_aggregate_projection, direct_story_worker_writes: false}
  lost_update_prevention:
    - refetch_current_blob_before_aggregate_write
    - optimistic_concurrency_sha
    - recompute_from_durable_unit_evidence_after_conflict

scheduler_resilience:
  production_fire_recurring_task:
    expected_cadence: hourly_around_15
    performs_real_work: true
    automatic_disable_for_run_local_blocker: forbidden
    next_fire_rule: Re-read live durable state independently on every scheduled invocation.
  allowed_disable_conditions:
    - explicit_user_instruction
    - deliberate_schedule_replacement_or_supersession
    - proven_scheduler_level_defect
    - duplicate_fire_safety_condition
  watchdog:
    expected_cadence: hourly_around_50
    read_only: true
    lifecycle_independent_from_production_fire: true

BL-001:
  canonical_endpoint_count: 134
  state: COMPLETE_READ_ONLY
  source_integrity_regression_required_to_reopen: true

BL-002:
  canonical_story_count: 134
  release_counts: {R1: 88, R2: 46}
  release_gate: R1_FIRST
  candidate_pool: all unfinished safe-independent R1 strict-field-UI units plus unresolved R1 physical-story materialization gaps
  parallel_story_execution: true
  per_story_output: BL-002/stories/<story-id>.md
  per_story_status: BL-002/work-status/<story-id>.yaml
  shared_progress_update: aggregator_only
  story_register: BL-002/story-register.csv
  story_definition: BL-002/STORY-DEFINITION.md
  materialization:
    queue: BL-002/materialization-task-queue.csv
    parity_gate: registered_story_ids_must_equal_physical_story_file_ids
    required_physical_story_files: 134
    priority_rule: {R1: 1, R2: 2}
    statuses: [PENDING, CLAIMED, MATERIALIZED, VALIDATED, BLOCKED]
    reconciliation_rule: Diff story-register.csv against BL-002/stories/STORY-*.md before selecting/replanning and repair aggregate count drift.
    completion_rule: 134/134 validated Story files and zero pending materialization tasks.
  approvals: {automatic: false, user_required: true}
  strict_completion:
    requires_full_applicable_source_contract: true
    source_detail_review_required_is_complete: false
    recorded_source_detail_gap_is_complete: false
  next_work_resolution:
    hardcoded_story_pointer: forbidden
    rule: Reconcile unit-local evidence, physical-file parity, materialization queue and aggregate progress dynamically.

BL-008:
  execution_mode: LOCAL_FLYWAY_EXISTING_DATABASE_HANDOFF
  active_workstream: OWNERSHIP_MODEL_MIGRATION
  authoring_owner: CHATGPT
  apply_owner: USER_LOCAL_MACHINE
  database_target: EXISTING_DATABASE
  preserve_existing_database: true
  preserve_existing_data: true
  preserve_flyway_schema_history: true
  recreate_database: forbidden
  drop_recreate_schema: forbidden
  clear_flyway_history: forbidden
  rebaseline_for_handoff: forbidden
  clean: forbidden
  migration_mechanism: FLYWAY_NORMAL_MIGRATE
  additive_migrations_by_default: true
  historical_migration_rewrite_requires_explicit_user_approval: true
  current_application_backup: Harinandhan-Cylinder-Backup(20260830-100356).zip
  migration_path: cylinder.datascripts/src/main/resources/db/migration
  last_validated_migration: V173__Align_Yard_Inventory_Sequence_Names_With_JPA.sql
  next_migration_candidate: V174
  next_migration_status: NOT_AUTHORED_WAITING_FOR_OWNERSHIP_BASELINE_EVIDENCE
  current_state: OWNERSHIP_MODEL_MIGRATION_STARTED_WAITING_FOR_PHASE1_BASELINE_RESULT
  ownership_model:
    phase: PHASE_1_BASELINE_AUDIT
    control_document: BL-008/ownership-model/PHASE-1-BASELINE.md
    user_handoff_script: BL008_Ownership_Model_Phase1_Baseline_Audit.sql
    governed_types: [COMPANY_OWNED, SUPPLIER_OWNED, CUSTOMER_OWNED]
    rule_company_owned: company_fleet_true_and_no_party_owner
    rule_supplier_owned: company_fleet_false_and_supplier_owner_only
    rule_customer_owned: company_fleet_false_and_customer_owner_only
    both_party_owners_populated: forbidden
    migration_decision_rule: Baseline existing rows before adding stronger ownership enforcement or corrective data migration.
  current_flow:
    - ChatGPT analyzes current ownership source and historical migrations.
    - User runs the single read-only Phase-1 ownership baseline against the existing database.
    - User returns the one consolidated result table.
    - ChatGPT classifies invalid existing rows, if any.
    - ChatGPT authors the smallest additive ownership-model migration only from proven baseline evidence.
    - User applies that migration through normal Flyway and returns consolidated validation.
  failure_rule: Do not enable stronger enforcement before classifying existing rows that would violate it; preserve existing data and history.
  chatgpt_database_writes: forbidden
  raw_manual_sql_substitution: forbidden
  github_actions: forbidden
  isolation: Waiting for user-local BL-008 result must not block eligible BL-002 work.

legacy_transition:
  invocation_lease_file: .orchestrator/invocation-lease.yaml
  treatment: compatibility_only
  broad_scope_is_not_lock: true

productive_runtime:
  target_minutes: 30
  hard_minimum_for_correctness: false
  never_idle_to_reach_target: true
  voluntary_stop_with_eligible_work: forbidden
  platform_forced_short_run_classification: RUNTIME_WINDOW_FORCED_STOP

safety:
  github_actions: forbidden
  github_runner: forbidden
  external_worker_runtime: forbidden
  user_manual_execution_general_orchestration: forbidden
  BL008_user_local_flyway_apply: explicitly_allowed
  credentials_in_git: forbidden
  raw_manual_sql: forbidden
  zero_transient_logs_at_terminal: true
