    component: AddressTypeJpaDao
    approximate_anchor: repository query methods
    proposed_change: Add exact case-insensitive lookup/existence method required by update-aware validation; retain contains methods for search use.
    reason: Separate search semantics from business-key uniqueness semantics.
  - repository: vvekselva/CylinderManagement
    ref: 3ae6e61442132d94a307275b08dd65fcef228d89
