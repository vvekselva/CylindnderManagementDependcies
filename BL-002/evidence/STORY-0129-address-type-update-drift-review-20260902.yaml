current_behavior:
  - POST /lookupManagement/addressType/save normalizes addressType to trimmed uppercase and description to trimmed text.
  - addressTypeId null/zero is treated as create; nonzero as update.
  - AddressTypeIngestionService rejects any nonempty findByAddressTypeContainingIgnoreCase result.
  - Duplicate validation uses contains rather than exact normalized business-key equality and does not exclude the current addressTypeId on update.
  - Successful repository saveAndFlush writes AddressTypeDo to public.tbl_address_type and controller refreshes the Address Type cache.
approved_story_behavior:
  - Create must reject another row with the same normalized address type.
  - Update must allow the existing row to retain its own normalized address type and reject only another row using that business key.
  - Controlled validation evidence must remain visible through the existing Lookup Management form.
business_impact:
  - A legitimate update can be rejected as a duplicate of itself.
  - A category whose name merely contains/is contained by another category can be falsely treated as a duplicate.
proposed_manifest:
  - repository: vvekselva/CylinderManagement
    ref: 3ae6e61442132d94a307275b08dd65fcef228d89
    path: cylindermanagement.custommapper.service/src/main/java/com/sreyas/datamatics/cylinder/management/services/AddressTypeIngestionService.java
    component: AddressTypeIngestionService
    method: processRequest
    approximate_anchor: duplicate validation branch before AddressTypeMapper mapping
    proposed_change: Replace contains-based unconditional duplicate rejection with exact case-insensitive normalized business-key validation that excludes the submitted addressTypeId during update.
    reason: Preserve correct create uniqueness while allowing same-row updates.
  - repository: vvekselva/CylinderManagement
    ref: 3ae6e61442132d94a307275b08dd65fcef228d89
