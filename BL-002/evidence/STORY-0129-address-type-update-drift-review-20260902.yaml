current_behavior:
  - POST /lookupManagement/addressType/save normalizes addressType to trimmed uppercase and description to trimmed text.
  - addressTypeId null/zero is treated as create; nonzero as update.
  - The recovered LookupManagement template already provides database-backed Address Type search while typing through STORY-0087 GET /search/addresstype/{searchText}, with a 320 ms debounce and visible existing-match suggestions.
  - Therefore no new Address Type type-ahead UI implementation is required by this manifest.
  - AddressTypeIngestionService rejects any nonempty findByAddressTypeContainingIgnoreCase result.
  - Duplicate validation uses contains rather than exact normalized business-key equality and does not exclude the current addressTypeId on update.
  - Successful repository saveAndFlush writes AddressTypeDo to public.tbl_address_type and controller refreshes the Address Type cache.
approved_or_target_behavior:
  - Existing database-backed search-while-typing behavior must be preserved and continue using STORY-0087.
  - Create must reject another row with the same normalized address type.
  - Update must allow the existing row to retain its own normalized address type and reject only another row using that business key.
  - Substring search suggestions must not themselves become duplicate rejection unless the normalized business keys are equivalent.
  - Controlled validation evidence must remain visible through the existing Lookup Management form.
business_impact:
  - The pre-submit UI already helps the operator see existing Address Types.
  - A legitimate update can still be rejected as a duplicate of itself by the service.
  - A category whose name merely contains/is contained by another category can still be falsely treated as a duplicate.
