current_behavior:
  - DomainLookupController.saveProductUom accepts optional productUomId and presents explicit add/update success behavior.
  - ProductUomIngestionService rejects whenever findByProductUomContainingIgnoreCase(value) returns any row, without excluding the same productUomId during update.
  - The duplicate predicate is contains/ignore-case rather than exact normalized equality, allowing substring false-positive duplicate rejection.
  - Successful service save is followed by targeted Product UOM cache refresh and PRG redirect.
  - DomainLookup.html has a database-backed 320 ms Product UOM search in the table toolbar via /search/product-uom/{text}, but the add/edit UOM candidate input only uppercases locally and does not display database matches while typing.
