  state: PENDING_USER_APPROVAL
  note: Story approval is not inferred. This is a source-proved review packet only.
business_impact:
  - A legitimate update, including retaining the same UOM name, can be rejected as a duplicate of itself.
  - Distinct UOM values can be rejected merely because one contains the other.
  - Candidate entry can miss an existing value until submit even though the governed search endpoint already exists.
proposed_manifest:
