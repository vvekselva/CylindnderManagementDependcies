current_behavior:
  - DomainLookupController.saveProduct supports create/update based on optional productId and refreshes Product cache after successful service processing.
  - ProductIngestionService rejects whenever `ProductJpaDao.findByProductNameContainingIgnoreCase(name)` returns any row, without excluding the submitted productId on update and using contains rather than exact business-key equality.
  - Category and UOM IDs are looked up with findById; when a referenced row is absent the service simply leaves the mapped relationship as-is rather than producing a specific controlled reference-validation error.
business_impact:
  - Legitimate product updates can be rejected as self-duplicates; substring-distinct product names can be falsely rejected.
  - Invalid category/UOM references are not explicitly rejected at the lookup branch, which can lead to incomplete/mapper-dependent persistence behavior rather than a clear user-input error.
proposed_manifest:
  - path: cylindermanagement.custommapper.service/src/main/java/com/sreyas/datamatics/cylinder/management/services/ProductIngestionService.java
    component: ProductIngestionService
    method: processRequest
    source_anchor: validation and category/UOM resolution blocks around lines 45-115 in recovered ZIP
    proposed_change: use exact normalized case-insensitive duplicate semantics excluding submitted productId on update; require non-null category/UOM DTO IDs and explicitly fail controlled validation when either referenced row does not exist; resolve each FK once and assign it to ProductDo.
    reason: align persistence with controller add/update and selected-reference contracts.
  - path: cylinder.management.dao/src/main/java/com/sreyas/datamatics/application/jpa/dao/ProductJpaDao.java
    component: ProductJpaDao
    method: exact duplicate lookup as required
    source_anchor: existing repository declarations
    proposed_change: add/use exact ignore-case product-name lookup suitable for create/update uniqueness validation.
  - path: relevant Product ingestion/controller tests under src/test/java
    component: tests
    proposed_change: cover create duplicate, unchanged-name update, collision with another product, substring-distinct name, missing category, missing UOM and successful cache-refresh path.
