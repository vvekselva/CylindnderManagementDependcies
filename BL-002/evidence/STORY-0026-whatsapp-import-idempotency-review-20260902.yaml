current_behavior:
  - CustomerAddressLocationOfflineMapService.importWhatsappText splits submitted text into lines, skips lines whose coordinates cannot be parsed, and creates a new CustomerLocationImportInboxDo for every parseable line.
  - Every accepted row receives sourceType WHATSAPP_EXPORT_IMPORT, rawText equal to the line, parsed coordinates, importedBy, a fresh importedAt timestamp and mappingStatus UNMAPPED, then is saved immediately.
  - CustomerLocationImportInboxJpaDao exposes only findByMappingStatusOrderByImportedAtDesc; no raw-text, sender, timestamp, content-hash or import-batch duplicate predicate exists.
  - tbl_customer_location_import_inbox has a generated primary key and no source-proved unique natural-key constraint for imported messages.
  - Re-importing the same export therefore creates additional UNMAPPED inbox rows for every parseable repeated line.
approved_behavior:
  state: PENDING_USER_APPROVAL
  idempotency_key: NOT_SOURCE_PROVED
business_impact:
  - An accidental re-import can multiply the same location candidates in the unmapped inbox and create duplicate manual mapping work.
  - Suppressing by raw text alone could incorrectly discard legitimate repeated messages with identical coordinates/text, so an idempotency rule cannot be invented safely from the current source.
