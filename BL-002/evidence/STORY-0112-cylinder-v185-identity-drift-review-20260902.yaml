approved_behavior_source: BL-008 V185 frozen ownership/identifier model
current_behavior:
  - DomainLookupController.saveCylinder supplies logical cylinder code, actual cylinder identifier and ownership type, defaulting actual identifier to cylinderSerial when no separate actual identifier is supplied.
  - CylinderIngestionService.processRequest is transactional and always calls createPrimaryIdentifier(saved, actualIdentifierType, actualIdentifier, ownershipTypeCode) immediately after CylinderJpaDao.save(...), then always calls createInitialYardInventoryLine(saved, ownershipTypeCode).
  - CylinderIngestionService validates active-primary identifier uniqueness with CylinderIdentifierJpaDao.findByIdentifierValueIgnoreCaseAndActiveAndPrimary(actualIdentifier,true,true) without excluding the submitted cylinderId when the request is an update.
  - CylinderIdentifierJpaDao already contains countActivePrimaryIdentifierUsedByOtherCylinder(identifierValue,cylinderId), an exact normalized query that excludes the current cylinder identity, but this helper is not used by the ingestion validation path.
  - The V185 frozen model requires COMPANY_OWNED to use tbl_cylinder.cylinder_serial as the company cylinder identity with zero separate active-primary physical-identifier rows.
  - CylinderIngestionService maps the saved logical cylinder back to a response DTO, sets actual/display identifier fields, then overwrites responseDto.cylinderSerial with actualIdentifier for every ownership type.
  - The V185 frozen display/transaction model requires the logical cylinder serial/code to remain the logical identity; external physical identifier belongs in separate actual/display identifier fields.
approved_story_behavior:
  state: PENDING_USER_APPROVAL_FOR_STORY_0112
