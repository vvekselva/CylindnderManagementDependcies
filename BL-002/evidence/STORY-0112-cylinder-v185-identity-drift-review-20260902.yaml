approved_behavior_source: BL-008 V185 frozen ownership/identifier model
current_behavior:
  - DomainLookupController.saveCylinder supplies logical cylinder code, actual cylinder identifier and ownership type, defaulting actual identifier to cylinderSerial.
  - CylinderIngestionService creates an active primary CylinderIdentifierDo for every ownership type, including COMPANY_OWNED.
  - The V185 frozen model requires COMPANY_OWNED to use tbl_cylinder.cylinder_serial as the company cylinder identity with zero separate active-primary physical-identifier rows.
  - CylinderIngestionService maps the saved logical cylinder back to a response DTO and then overwrites responseDto.cylinderSerial with actualIdentifier for every ownership type.
  - The V185 frozen display/transaction model requires the logical cylinder serial/code to remain the logical identity; external physical identifier belongs in the separate actual/display identifier fields.
business_impact:
  - Company-owned registration can create a physical-identifier row that the frozen V185 model says must not exist.
  - The response can replace the stable logical cylinder code with the physical identifier, causing downstream UI/API consumers to lose the logical identity distinction required by the frozen model.
