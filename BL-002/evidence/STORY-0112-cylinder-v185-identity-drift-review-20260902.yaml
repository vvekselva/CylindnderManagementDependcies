  note: This packet does not auto-approve STORY-0112 and does not authorize implementation.
business_impact:
  - Company-owned registration can create a physical-identifier row that the frozen V185 model says must not exist.
  - The response can replace the stable logical cylinder code with the physical identifier, causing downstream UI/API consumers to lose the logical identity distinction required by the frozen model.
  - A legitimate edit of an external cylinder can be rejected as a duplicate of its own current active-primary identifier because current-row identity is not excluded.
  - The same service path executes creation-oriented primary-identifier and initial-yard-inventory actions after both create and update saves; update idempotency therefore requires explicit separation and regression proof before implementation.
proposed_manifest:
  - path: cylindermanagement.custommapper.service/src/main/java/com/sreyas/datamatics/cylinder/management/services/CylinderIngestionService.java
    component: CylinderIngestionService
    methods: processRequest, validateRequest, createPrimaryIdentifier, createInitialYardInventoryLine
    source_anchor: processRequest lines ~85-149; identifier validation lines ~180-193 in recovered ZIP
    proposed_change: separate create vs update by cylinderId; on external-asset update use an exact normalized duplicate check that excludes the current cylinder identity; do not rerun creation-only identifier/initial-yard side effects during ordinary updates unless an explicitly approved identifier-replacement workflow requires it; skip separate CylinderIdentifierDo creation for COMPANY_OWNED; preserve responseDto.cylinderSerial as the saved logical cylinder serial and expose physical identity only through actualCylinderIdentifier/displayCylinderIdentifier/actualIdentifierType.
    reason: conform registration/update behavior to the frozen V185 logical/physical identity model and make update behavior idempotent.
  - path: cylinder.management.dao/src/main/java/com/sreyas/datamatics/application/jpa/dao/CylinderIdentifierJpaDao.java
    component: CylinderIdentifierJpaDao
    method: countActivePrimaryIdentifierUsedByOtherCylinder
    source_anchor: lines ~20-30
    proposed_change: reuse the existing exact normalized current-row-excluding query for update duplicate validation rather than adding a broader contains predicate; retain the existing create lookup for create semantics where appropriate.
    reason: the required current-row exclusion capability already exists in the frozen source and should be reused.
  - path: relevant CylinderIngestionService tests under src/test/java including BL008 V185 tests
    component: tests
    proposed_change: prove company registration creates no identifier row and keeps logical serial in cylinderSerial; prove supplier/customer registration creates the correct active-primary identifier and keeps logical/physical response fields distinct; prove same-row external update is accepted, other-row duplicate is rejected, ordinary update does not duplicate active-primary identifiers or initial yard inventory, and ownership-specific owner IDs remain correct.
database_impact: NONE_SCHEMA; V185 database remains frozen and existing tables/queries are reused.
