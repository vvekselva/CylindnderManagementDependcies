current_behavior:
  - POST /wizard/vehicle-trip-load/save sends one transactional request containing trip fields, load header, load-line cylinders and four challan-book selections.
  - TripChallanBookAssignmentSelectionValidator already rejects using the same physical challan book for more than one required book type; that guard is separately source-proved.
  - VehicleLoadIngestionValidator iterates loadLines and validates each cylinder individually for existence and Yard-only availability, but does not maintain a submitted-cylinder-id Set and does not reject the same cylinder ID appearing more than once in the same request.
  - VehicleLoadAndTripIngestionService then iterates every line, resolves the same cylinder/active YardInventoryLine for each occurrence, creates a VehicleLoadLineDo for every occurrence, and adds the same active Yard inventory row to the deactivation list for each occurrence before persisting trip/load atomically.
  - The request-level duplicate cylinder therefore reaches persistence/transfer logic rather than being rejected as inconsistent input.
approved_behavior:
  state: PENDING_USER_APPROVAL
  note: This packet does not auto-approve a duplicate-cylinder rule. It isolates a source-proved request-consistency gap for review.
business_impact:
  - One physical cylinder can be counted twice toward load quantities in a single wizard request.
  - The same Yard inventory identity can be scheduled for deactivation/transfer more than once in the same transaction, risking database-constraint failure or inconsistent quantity/purpose allocation rather than a clear field validation error.
  - Operationally a physical cylinder cannot occupy two load lines in the same load at the same time, making duplicate request identity a strong consistency concern.
