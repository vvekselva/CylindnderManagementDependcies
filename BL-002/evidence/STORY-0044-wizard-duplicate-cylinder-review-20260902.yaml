    approximate_anchor: load-line loop lines ~124-220
    proposed_change: maintain a Set<Long> of validated submitted cylinder IDs; when a non-null cylinderId repeats within the same request, add a dedicated controlled validation error to the repeated line/header and do not continue normal Yard-location processing for that duplicate occurrence.
