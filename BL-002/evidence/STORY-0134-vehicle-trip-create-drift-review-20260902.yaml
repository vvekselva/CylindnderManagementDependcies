current_behavior:
  - POST /addVechileTrip binds VehicleTripIngestionRequestDto and delegates to VehicleTripIngestionServiceImpl.
  - Validator checks Vehicle, Driver, starting time, Customer, Customer Address and customer-address ownership.
  - Null request validation incorrectly emits VehicleIngestionRequestDto rather than VehicleTripIngestionRequestDto.
  - Driver validation can dereference/null-unbox driverId when Driver DTO exists with null ID.
  - Customer-ID invalidity condition incorrectly checks customerAddress.customerAddressId <= 0 instead of customerId <= 0 and can dereference customerAddress after an earlier address validation failure.
  - Service resolves vehicle, driver, customer, address and Started status using Optional.get() after validation and saves VehicleTripDo to public.tbl_vehicle_trip.
approved_story_behavior:
  - Every invalid required identity/request state must produce controlled VehicleTripIngestionRequestDto validation evidence without null dereference.
  - Customer ID validation must validate customerId itself; customer-address ownership must only run when both valid entities are present.
  - Missing configured Started status must be a controlled application error rather than Optional.get failure.
  - Successful persistence semantics remain unchanged.
business_impact:
  - Certain malformed requests can fail with uncontrolled NullPointerException instead of visible validation feedback.
  - Customer validation can test the wrong identity and produce misleading/unsafe behavior.
  - Missing reference/status rows can surface as uncontrolled Optional.get exceptions.
proposed_manifest:
