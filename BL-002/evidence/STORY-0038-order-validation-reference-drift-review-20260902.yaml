current_behavior:
  - OrderIngestionRequestValidator records invalid/null Challan Type, Customer, Delivery Address, Driver and Vehicle DTO/ID errors, but then performs DAO lookups by dereferencing those DTO IDs without consistently guarding the invalid branch first.
  - Examples include challanType lookup immediately after invalid challanType handling at lines ~144-145; customer lookup at ~172; address lookup at ~202; driver lookup at ~228; vehicle lookup at ~254.
  - Order line validation sets cylinderIdNull=true when line cylinder/id is absent, then uses `if (cylinderIdNull && cylinderJpaDao.findById(lineDto.getCylinder().getCylinderId()).isEmpty())` at lines ~292-301. This condition is inverted: it dereferences the missing cylinder when cylinderIdNull is true and skips existence validation when a non-null cylinder ID is supplied.
  - No request-level Set rejects the same cylinder ID appearing twice in orderLines.
  - OrderIngestionService subsequently resolves all references with Optional.get and persists the order and all line cylinders in one transaction.
business_impact:
  - Malformed reference payloads can throw NullPointerException rather than return controlled field validation.
  - A nonexistent but non-null cylinder ID is not rejected by the intended validator condition and can fail later at service Optional.get.
  - The same physical cylinder can be represented multiple times in one delivery order request unless a downstream database rule happens to reject it, which is not a stable input contract.
