policy: BL-002/lookup-insertion-precheck-policy.yaml
current_behavior:
  common_ui:
    - LookupManagement has database-backed 320 ms debounced table-toolbar searches for Country, State and City using STORY-0090, STORY-0101 and STORY-0089 respectively.
    - The add/edit text fields c-name, s-name and ci-name do not invoke those searches while the operator types a candidate value.
    - Therefore existing matches are not displayed adjacent to the candidate add/edit field before Save.
  STORY-0130:
    endpoint: POST /lookupManagement/country/save
    service: CountryIngestionService.processRequest
    duplicate_query: CountryJpaDao.findByCountryNameContainingIgnoreCase
    update_self_exclusion: ABSENT
  STORY-0131:
    endpoint: POST /lookupManagement/state/save
    service: StateIngestionService.processRequest
    duplicate_query: StateJpaDao.findByStateNameContainingIgnoreCase
    update_self_exclusion: ABSENT
  STORY-0132:
    endpoint: POST /lookupManagement/city/save
    service: CityIngestionService.processRequest
    duplicate_query: CityJpaDao.findByCityNameContainingIgnoreCase
    update_self_exclusion: ABSENT
business_impact:
  - Operators can type a Country/State/City candidate without seeing database-backed matching values directly in the add/edit form before Save.
  - Legitimate updates can be rejected as duplicates of the same row.
  - Contains-based duplicate predicates can reject non-equivalent substring names.
target_behavior:
  - Reuse existing governed search Stories while typing in the corresponding add/edit field with controlled debounce and visible suggestions.
  - Clear stale suggestion/selection state when candidate text changes or clears.
  - Keep table toolbar searches unchanged.
  - Submit-time service validation must use normalized exact business-key equivalence and exclude the current row identity on update.
  - Database unique constraints remain final concurrency guards.
