current_behavior:
  - final-version-1/YardStockCheckIngestion.html posts yardStockCheckDto.checkLines[i].cylinder.cylinderId, yardStockCheckDto.checkLines[i].cylinderState.cylinderStateId and auditorNotes.
  - YardStockCheckLineDto has no cylinderState property; the matching DTO property is observedCylinderState. The template therefore does not source-prove binding of the selected observed state into the DTO expected by validation/service code.
  - The same final template does not post observedCylinder, but YardStockCheckIngestionRequestValidator rejects an empty observedCylinder.
  - The validator dereferences getObservedCylinderState().getCylinderStateId() in logging/DAO lookup before checking whether observedCylinderState is null, allowing a null-binding path to fail before controlled validation evidence is attached.
  - YardStockCheckIngestionService persists the stock-check header and line observed-state/scannedAt/observedCylinder, but does not set the selected cylinder relation, auditorNotes, systemCylinderState or stateMatchesSystem on YardStockCheckLineDo before save.
  - The existing line entity/table already contains fk_cylinder, auditor_notes, fk_observed_cylinder_state, fk_system_cylinder_state, state_matches_system and observed_cylinder fields; this is application binding/mapping drift, not a schema absence.
target_behavior_for_user_review:
  approval_state: NOT_APPROVED
  - Browser-selected cylinder identity and physical observed state should bind to the DTO fields consumed by validation/service code.
  - Validation should fail closed with controlled validation errors rather than dereferencing a null observed state.
  - If approved, persisted audit lines should retain selected cylinder, observed physical state, auditor notes and system-state comparison using existing schema fields.
business_impact:
  - A valid user-selected physical state may not bind to observedCylinderState, causing rejection or an uncontrolled null dereference.
  - Submitted cylinder ID and auditor notes are not source-proved to persistence on the current service path, weakening traceability and the fk_stock_check/fk_cylinder audit invariant.
  - System-vs-observed reconciliation fields can remain unset even though the UI shows current system state and the database line model supports the comparison.
