current_behavior:
  - WalkinSaleServiceImpl.linkDeliveryChallanLeafIfPresent resolves a delivery challan page by sheet number from the ledger.
  - If ChallanTransactionLinkJpaDao.findByChallanPage(activePageDo) returns an existing link, the walk-in path deletes and flushes that existing link, then creates a new link for the walk-in business job and marks the page USED_CONFIRMED.
  - The normal VehicleTripStopIngestionService consumption path first resolves only an unused page; if any existing transaction link is present it explicitly throws and logs that reuse is blocked.
  - The two source paths therefore implement opposite reuse semantics for the same challan-page journal concept.
approved_behavior:
  state: PENDING_USER_APPROVAL
  source_proved_comparison_rule: NORMAL_VEHICLE_STOP_PATH_BLOCKS_REUSE
  note: This packet does not infer which behavior the user approves for walk-in sale; it isolates the inconsistency.
business_impact:
  - A walk-in sale can detach a challan page from its prior business transaction and relink it, weakening historical audit traceability.
  - The same page can be treated as non-reusable in vehicle-stop processing but replaceable in walk-in processing, making challan governance dependent on endpoint rather than page state.
