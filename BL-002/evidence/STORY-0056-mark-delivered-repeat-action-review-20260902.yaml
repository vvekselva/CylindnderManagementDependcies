current_behavior:
  - CustomerDemandDashboard renders Mark Delivered only when requestStatus != DELIVERED, providing a browser-side state gate for the normal screen workflow.
  - POST /customer-demands/{requestId}/mark-delivered calls CustomerDemandService.markDelivered without passing an expected current status.
  - CustomerDemandService.markDelivered loads by id, always replaces deliveredAt with LocalDateTime.now(), sets DELIVERED, recomputes deliveryDurationMinutes and saveAndFlushes.
  - A repeated direct POST therefore rewrites the original completion timestamp and duration despite the normal UI hiding the button after delivery.
approved_behavior:
  state: PENDING_USER_APPROVAL
  source_proved_ui_intent: MARK_DELIVERED_IS_PRESENTED_ONLY_BEFORE_DELIVERED_STATE
business_impact:
  - retries, double submits or direct endpoint calls after the first success can alter historical completion time and average-delivery metrics.
  - preserving the first deliveredAt is important for stable reporting, but whether a repeat should be a no-op or a controlled error remains an explicit behavior choice.
proposed_change_manifest_if_repeat_should_preserve_first_completion:
