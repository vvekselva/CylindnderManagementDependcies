    proposed_change: trim/normalize searchTerm and call a repository search branch for nonblank input instead of findAll; keep blank search on findAll.
    reason: make the visible search control effective.
  - path: cylinder.management.dao/src/main/java/com/sreyas/datamatics/application/jpa/dao/VehicleTripJpaDao.java
