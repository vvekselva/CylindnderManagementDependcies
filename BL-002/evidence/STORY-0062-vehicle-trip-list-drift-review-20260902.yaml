current_behavior:
  - GET /vehicle-trips/list accepts and preserves searchTerm in the model and UI.
  - VehicleTripFetchByPageService logs a filtered-search branch for nonblank searchTerm but both branches execute VehicleTripJpaDao.findAll(pageable); searchTerm has no data effect.
  - Pagination/filter form omit size, so a non-default page size is not preserved across browser navigation.
approved_or_target_behavior_for_review:
  - A visible Search field should either perform a defined supported search or be removed/relabeled; proposed remediation is a defined vehicle/driver search consistent with the service comments and visible intent.
  - Page-size state should remain stable when supplied.
business_impact:
  - Users can enter search text and receive an unfiltered list while the UI appears to support filtering.
  - Paging can silently reset a non-default size to 10.
proposed_manifest:
