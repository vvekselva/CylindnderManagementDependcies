current_behavior:
  - Domain Lookup posts driverId, driverName, phoneNumber and licenceNumber to POST /domainLookup/driver/save.
  - Controller trims driverName and phoneNumber, uppercases licenceNumber, wraps phoneNumber in PhoneNumberDto and delegates DriverIngestionRequestDto.
  - DriverIngestionService validates only request/driver/name null-or-empty and duplicate driver-name contains/ignore-case.
  - On null/invalid request the service throws validation evidence using VehicleIngestionRequestDto instead of DriverIngestionRequestDto.
  - Duplicate-name validation does not exclude the current driverId during update and uses contains instead of exact normalized identity.
  - DriverMapper maps driverId, driverName and licenceNumber but does not map phoneNumber.
  - DriverDo has fk_phone_number to public.tbl_phone_number, but current Driver ingestion therefore does not persist the submitted phone relation.
  - The template declares required Phone Number and Licence Number fields and renders DRIVER_PHONE_* and DRIVER_LICENCE_* validation codes that the current service does not produce.
  - The Driver table toolbar has database-backed 320 ms search through /search/driver/{text}, but the add/edit Driver Name candidate input itself does not show database-backed matches while typing.
approved_story_behavior:
  state: PENDING_USER_APPROVAL
  note: No Story approval is inferred by this packet. The business-behavior Story remains pending explicit user approval; this packet only records source-proved current behavior and an exact potential remediation scope for later review.
business_impact:
  - A user can submit a phone number that is displayed as required but is silently omitted from Driver persistence.
  - Invalid phone/licence input is not enforced by the current service despite visible UI validation placeholders.
  - Editing an existing driver can be rejected by the duplicate-name contains check even when the row is updating itself.
  - Null/invalid request evidence may be returned as the wrong DTO type, preventing the controller's intended inline Driver validation branch.
  - Candidate entry does not proactively show existing database matches even though a governed Driver search endpoint already exists.
