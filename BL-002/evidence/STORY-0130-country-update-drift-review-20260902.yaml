current_behavior:
  - POST /lookupManagement/country/save carries optional countryId plus required countryName and description.
  - Controller trims countryName and uppercases/trims description, then classifies null/zero ID as create and nonzero as update.
  - CountryIngestionService validates nonblank countryName and rejects whenever findByCountryNameContainingIgnoreCase returns any row.
  - Duplicate validation is contains-based and does not exclude the submitted countryId on update.
  - Successful saveAndFlush persists CountryDo to public.tbl_country and controller refreshes the Country cache.
approved_story_behavior:
  - Enforce exact normalized country-name uniqueness across different rows.
  - Permit same-row updates that retain the existing normalized country name.
  - Preserve existing controlled validation and cache refresh behavior.
business_impact:
  - Legitimate country edits can be rejected as duplicates of themselves.
  - Substring country names can be falsely rejected as duplicates.
