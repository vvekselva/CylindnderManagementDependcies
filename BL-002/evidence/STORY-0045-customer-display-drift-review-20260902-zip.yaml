current_behavior:
  - Customer List row click navigates to GET /displayCustomer?customerId=<persistent id>.
  - CustomerFetchController reads the customer through CustomerFetchByIdService and returns view name DisplayCustomer with model key customer.
  - CustomerFetchByIdService reads CustomerJpaDao.findById and maps public.tbl_customer plus linked customer-address and customer-phone entities into CustomerFetchByIdResponseDto.
  - The resolved root DisplayCustomer.html is not a read-only details page: it is an editable form posting to POST /updateCustomer with hidden customerId and customer/address/phone fields.
  - The same template is labelled Register Customer / New Registration despite being reached for an existing customer and posting to updateCustomer.
  - The template references backLink and addressTypes, but CustomerFetchController currently adds only model customer on the success path.
  - Invalid/not-found governed errors redirect to /fetchCustomerByPage?pageNumber=1&itemsPerPage=10.
approved_story_behavior:
  - Opening a Customer List row must clearly present the selected existing customer as Customer Details/Edit Customer, not New Registration.
  - The update form must retain the existing customer identity and POST to /updateCustomer.
  - Required view model data such as backLink and addressTypes must be populated for the resolved DisplayCustomer template.
  - The underlying read service/table behavior remains unchanged.
business_impact:
  - Existing-customer maintenance is visually mislabelled as registration, which can mislead operators about whether they are creating or editing a customer.
  - Missing backLink/addressTypes model data can produce incomplete navigation/address-type choices on the edit screen.
