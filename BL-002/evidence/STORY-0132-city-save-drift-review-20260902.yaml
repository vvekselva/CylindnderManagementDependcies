current_behavior:
  - POST /lookupManagement/city/save submits optional cityId plus cityName and description; controller treats null/zero ID as create and nonzero as update.
  - CityIngestionService null/blank validation incorrectly emits CountryIngestionRequestDto instead of CityIngestionRequestDto, followed by a second generic validation throw.
  - Duplicate validation uses findByCityNameContainingIgnoreCase and does not exclude the submitted cityId during update.
  - Successful saveAndFlush persists CityDo to public.tbl_city; controller refreshes City cache.
approved_story_behavior:
  - Invalid City input must return CityIngestionRequestDto validation evidence to the existing inline City branch.
  - City-name uniqueness must use exact normalized semantics across different rows and permit same-row updates.
  - Preserve current persistence/cache/PRG behavior.
business_impact:
  - Invalid input can bypass inline City validation because the wrong request DTO type is emitted.
  - Legitimate City edits and substring names can be falsely rejected as duplicates.
