current_behavior:
  - POST /lookupManagement/state/save submits optional stateId plus stateName and description; controller treats null/zero ID as create and nonzero as update.
  - StateIngestionService null/blank validation incorrectly calls throwInputValidationFailure with CountryIngestionRequestDto rather than StateIngestionRequestDto, followed by a second generic validation throw.
  - Duplicate validation uses findByStateNameContainingIgnoreCase and does not exclude the submitted stateId on update.
  - Successful saveAndFlush persists StateDo to public.tbl_state and controller refreshes the State cache.
approved_story_behavior:
  - Invalid State input must return StateIngestionRequestDto validation evidence so the existing controller inline-validation branch can render it.
  - Create/update uniqueness must use exact normalized state-name semantics and allow a row to retain its own business key during update.
  - Persist the same State fields and preserve current cache/PRG behavior.
business_impact:
  - Invalid input can bypass the intended inline State validation branch because the service emits the wrong DTO type.
  - Legitimate state edits can be rejected as self-duplicates and substring names can be falsely rejected.
