source_proof:
  - submitSpotCheck requires an active CUSTOMER_SPOT_CYLINDER_CHECK book assignment for the load.
  - resolveUnusedPage requires the submitted sheet to belong to that book's assigned range and to be PageStatus.UNUSED before the header is saved.
  - after save the same transaction marks the page USED_CONFIRMED and creates the customer-spot-check transaction link.
  - a replay using the same challan page is therefore rejected by the page-status gate before a second spot-check header is persisted.
  - repeated observed serials inside one audit submission are detected case-insensitively through a Set and retained as DUPLICATE_IN_CHECK variance evidence rather than silently treated as distinct cylinders.
  - unknown/not-held serials are retained as audit variance observations; the service explicitly does not mutate custody records from the spot check.
idempotency_rationale: The challan page is the source-proved one-time transaction token for this submission path. Separate later spot checks with different unused pages can be legitimate audit events, so no generic customer/time duplicate rule is inferred.
