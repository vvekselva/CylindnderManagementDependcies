    approximate_anchor: add lines 17-20; update lines 28-30
    proposed_change: on create, reject an existing active exact-ignore-case stopName before save; on update, reject only an active same-name row whose identity differs from submitted stopId.
    reason: make the single-save path consistent with the source-proved batch-save active-name invariant without self-rejecting updates.
