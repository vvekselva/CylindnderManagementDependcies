current_behavior:
  - POST /delivery-planning/stops/manage/save distinguishes create vs update using optional stopId and validates name/latitude/longitude/radius before service invocation.
  - DeliveryPlanningStopService.add validates and directly saves a new active stop; it performs no database-backed stop-name duplicate check.
  - DeliveryPlanningStopService.update validates, loads by id, applies the submitted values and saves; it performs no duplicate check excluding the current row.
  - The same domain's batch-save validator already rejects an active exact-ignore-case stop name through DeliveryPlanningStopJpaDao.existsByActiveTrueAndStopNameIgnoreCase(name).
  - DeliveryPlanningStopJpaDao therefore already exposes an exact active-name existence rule used by the batch path, but the single create/update path does not apply it.
approved_behavior:
  state: PENDING_USER_APPROVAL
  source_proved_domain_invariant: BATCH_SAVE_REJECTS_EXISTING_ACTIVE_EXACT_IGNORE_CASE_STOP_NAME
  note: This packet does not infer that the user has approved applying that invariant to STORY-0121. It isolates the source inconsistency for review.
business_impact:
  - The single-save form can create a second active planning stop with the same name even though batch save rejects that name.
  - A naive reuse of existsByActiveTrueAndStopNameIgnoreCase during update would reject an unchanged same-row name, so update requires current-row exclusion rather than the create predicate verbatim.
  - Duplicate active names can make map/list selection ambiguous because stopName is the human-visible identity in the management screen.
