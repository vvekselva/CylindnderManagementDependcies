business_contract:
  - Save validates the submitted trip/load/cylinder allocation contract and executes VehicleLoadIngestionService.processRequest transactionally.
  - The transaction creates YARD_START/ARRIVED stop state, marks the trip Loaded, persists vehicle load and cascaded load lines, creates OPEN logistics execution and lines, and deactivates source active Yard Inventory lines.
  - EMPTY cylinders map to EMPTY_FOR_SUPPLIER / EMPTY_PICKED_FOR_REFILL; FULL cylinders map to FULL_FOR_DELIVERY or FULL_FOR_BUFFER / FULL_PICKED_UP_FOR_DELIVERY according to submitted quantities.
  - Exact persistence identities include public.tbl_vehicle_load, public.tbl_vehicle_load_line, public.tbl_vehicle_trip, public.tbl_vehicle_trip_stop, public.tbl_cylinder_logistics_execution, public.tbl_cylinder_logistics_execution_line and public.tbl_yard_inventory_line.
