validation:
  - VehicleTripIngestionRequestValidator validates non-null trip, existing Vehicle and Driver, starting time, existing Customer and Customer Address, and verifies the address belongs to the selected Customer.
  - VehicleLoadIngestionValidator validates loadedBy and selected-cylinder existence/location/Yard FULL-or-EMPTY loadability where lines are present.
  - TripChallanBookAssignmentSelectionValidator requires four distinct book IDs and four starting unused sheet numbers for DELIVERY_CHALLAN, EMPTY_PICKUP_CHALLAN, FILLING_NOTE and CUSTOMER_SPOT_CYLINDER_CHECK.
  - Each challan book must be active for its expected type, physically IN_OFFICE, have unused pages, have a starting sheet within the physical book range and not before nextAvailableSheetNumber, and that exact sheet must currently be UNUSED.
  - A challan book already assigned to another non-returned trip is rejected.
persistence:
  - Creates VehicleTrip in public.tbl_vehicle_trip initially with Started status, resolving Vehicle, Driver, Customer and Customer Address.
  - Creates VehicleLoad in public.tbl_vehicle_load and cascade-all VehicleLoadLine records in public.tbl_vehicle_load_line.
  - Creates YARD_START trip stop with ARRIVED status, then changes trip status to Loaded and saves trip/load.
  - Creates four public.tbl_trip_challan_book_assignment rows linking saved trip/load to selected physical books and assigned starting sheet numbers.
  - Creates OPEN public.tbl_cylinder_logistics_execution and active public.tbl_cylinder_logistics_execution_line rows for selected cylinders.
  - EMPTY cylinders target EMPTY_PICKED_FOR_REFILL; FULL delivery/buffer cylinders target FULL_PICKED_UP_FOR_DELIVERY.
  - Deactivates the previous active public.tbl_yard_inventory_line rows in the same transaction.
