proven_contract:
  - The delivery form submits exact challan/customer/address/driver/vehicle/order-line identities to POST /cylinderDelivery.
  - Uc02Phase02CylinderDeliveryController binds UC02Phase02CylinderDeliveryRequestDto and invokes Uc02Phase02CylinderDeliveryMediator.
  - The concrete mediator maps OrderDto into OrderIngestionRequestDto and invokes OrderIngestionService.
  - OrderIngestionRequestValidator proves executable request/FK/order-line validation branches and input-validation failure behavior.
  - OrderIngestionService.processRequest is transactional, resolves FK DAOs, builds OrderDo/OrderLineDo and calls OrderJpaDao.save(orderDo).
  - OrderJpaDao extends JpaRepository<OrderDo, Long>; OrderDo maps public.tbl_order and cascade-all persists OrderLineDo to public.tbl_order_line.
  - Success redirects to /orderList?pageNumber=1&itemsPerPage=10; InvalidInputParameterException redisplays the delivery form with errorMessage.
business_effect:
  - Persists the delivery challan header in public.tbl_order and selected cylinder lines in public.tbl_order_line as one JPA transaction.
  - Defaults order status to DELIVERED when submitted status is null/blank; derives product from each resolved Cylinder and uses submitted quantity or cylinder total quantity fallback.
current_source_gaps:
  - Validator requires challanDate.isBefore(LocalDate.now()), while browser initializes an empty challan date to today.
  - Cylinder-existence validation uses an unsafe cylinderIdNull guard and does not safely prove the intended cylinder existence check.
  - Future cylinder state transition in mediator is commented example code only; no explicit cylinder-state transition is executed.
  - CylinderManagementApplicationException from OrderIngestionService is logged/swallowed by the mediator, after which SUCCESS response code is still set.
