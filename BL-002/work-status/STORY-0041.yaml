resolved_source_detail:
  - AddressTypeFetchByPageService is present at the frozen commit and is now source-bound.
  - It reads Address Type reference data through AddressTypeJpaDao with pageable ascending addressType sorting and optional addressType/description search.
  - AddressTypeJpaDao extends JpaRepository<AddressTypeDo, Long>.
  - AddressTypeDo maps public.tbl_address_type with pk_address_type_id, sequence public.pk_address_type_id_serial, address_type and description.
  - The GET page therefore performs an Address Type reference-data read on cache refresh and no customer write.
