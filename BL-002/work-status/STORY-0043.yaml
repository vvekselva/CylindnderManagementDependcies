page_read_behavior:
  - GET creates a blank combined VehicleTripDto + VehicleLoadDto request and renders final-version-1/VehicleTripLoadWizard.
  - LookupDataCache supplies load-purpose and product reference data; the cache is populated at startup and lazily reloads empty caches through injected application services.
  - ProductFetchByPageService reads ProductJpaDao and maps ProductDo records from public.tbl_product.
  - VehicleLoadPurposeFetchAllService reads VehicleLoadPurposeJpaDao and maps VehicleLoadPurposeDo records from public.tbl_vehicle_load_purpose.
  - ActiveChallanBookForTripLoadViewJpaDao.findByBookType supplies active book choices for DELIVERY_CHALLAN, EMPTY_PICKUP_CHALLAN, FILLING_NOTE and CUSTOMER_SPOT_CYLINDER_CHECK.
  - ActiveChallanBookForTripLoadViewDo is immutable and maps public.vw_active_challan_books_for_trip_load, including book_id, book_code, book_type, sheet range, current_location, unused/used/spoiled/missing counts and next_available_sheet_number.
