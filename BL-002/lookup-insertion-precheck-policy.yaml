version: 2
policy_id: BL002_LOOKUP_AND_INSERTION_PRECHECK_20260902
status: ACTIVE
scope:
  backlog: BL-002
  story_count: 134
  applies_to_all_stories: true
  review_rule: Every Story must be explicitly classified for lookup/search and insertion/update duplicate-precheck applicability before approval is considered complete.
user_requirement:
  source: Direct user instruction in ChatGPT conversation on 2026-09-02
  intent:
    - When a user types a lookup/master-data value, search existing database-backed values and show matches so the user can see whether the value already exists before adding it.
    - Apply the same principle to all lookup/master-data maintenance screens.
    - For all insertion/update operations with a business identity or natural key, perform an application/service-level duplicate pre-check before persistence; the database uniqueness constraint remains the final safety net rather than the primary user-facing duplicate detector.
mandatory_ui_behavior:
  applicable_when: User is entering a free-text master/reference value that can be created or changed.
  requirements:
    - Search while typing using an existing governed search endpoint when one exists.
    - Results must come from the authoritative database-backed lookup/search path, not only a stale static list.
    - Display matching existing values before the user submits a new value.
    - Clear stale selection/identity when the typed text changes.
    - Do not silently create a duplicate when an existing value matches the normalized business identity.
mandatory_service_behavior:
  applicable_when: Operation inserts or updates a record having a business identity/natural key.
  requirements:
    - Normalize the candidate according to the domain rule before duplicate comparison.
    - Perform an explicit repository/database duplicate pre-check before save.
    - For update, exclude the current record identity so it is not treated as a duplicate of itself.
    - Use exact business-equivalence semantics for rejection; substring matches may be shown as suggestions but must not by themselves cause a false duplicate rejection unless the domain explicitly defines them as equivalent.
    - Return a controlled validation/business error that the screen can display.
    - Keep the database unique constraint as the final concurrency/safety guard.
