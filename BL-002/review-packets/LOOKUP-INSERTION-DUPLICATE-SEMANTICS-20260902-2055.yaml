business_requirement: Before creating or updating lookup/master data, show database-backed matching values while typing and reject only a normalized business-equivalent duplicate; an update must not reject the row as a duplicate of itself.
current_behavior:
  ui:
    - LookupManagement already calls database-backed Address Type, Country, State and City search endpoints while typing.
    - DomainLookup already calls database-backed Product Category, Product UOM, Product, Vehicle and Driver search endpoints while typing.
  service:
    - The affected ingestion services use findBy...ContainingIgnoreCase predicates for duplicate rejection.
    - A substring hit can therefore be treated as a duplicate even when it is not business-equivalent.
    - Where the same save flow is used for update, the current record identity is not source-proved to be excluded by these predicates.
business_impact:
  - Users can see existing lookup/master values before creating another value, which satisfies the discovery part of the requirement on the source-proved LookupManagement and DomainLookup screens.
  - Duplicate rejection can still be overly broad, blocking legitimate values whose names merely contain one another.
  - Update flows can reject legitimate edits if the current row is returned by the duplicate search.
