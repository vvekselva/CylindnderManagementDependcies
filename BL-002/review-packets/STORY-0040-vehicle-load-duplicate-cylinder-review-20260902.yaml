business_impact:
  - One physical cylinder can be represented multiple times in one Vehicle Load request if its id is duplicated in the submitted lines.
  - Header quantities, total loaded count, logistics-line creation and Yard deactivation can then diverge from the physical one-cylinder-one-load-line intent.
proposed_locations:
  - file: cylindermanagement.custommapper.service/src/main/java/com/sreyas/datamatics/cylinder/management/validator/VehicleLoadIngestionValidator.java
    component: VehicleLoadIngestionValidator.validate
    anchor: around lines 124-220
    proposal: Track cylinder ids seen in the request and reject a repeated id with controlled validation evidence before persistence.
  - file: Vehicle Load UI/template request construction
    component: Vehicle Load selected-cylinder list
    proposal: Prevent duplicate selection client-side as an additional UX guard while retaining the service validator as authoritative.
tests:
  - repeated cylinder id in one request is rejected and nothing is persisted
  - distinct FULL/EMPTY cylinder ids continue through existing Yard/state validation
  - case does not rely on database failure for the user-facing duplicate result
  - regression verifies totalCylindersLoaded equals distinct persisted physical cylinders
