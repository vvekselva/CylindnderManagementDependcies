    anchor: load-line construction around lines 161-230
    detail: Every request line becomes a VehicleLoadLineDo. Yard inventory is not deactivated until after all request lines are mapped, so the same cylinder repeated in the submitted list can pass the same pre-mutation Yard availability check more than once.
  persistence:
    entity: VehicleLoadLineDo
