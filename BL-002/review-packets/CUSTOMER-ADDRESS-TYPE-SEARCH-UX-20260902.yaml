proposed_locations:
  - file: cylindermanagement.web/src/main/resources/templates/final-version-1/UC01RegisterCustomer.html
    component: Address Type control for existing and dynamically added address rows
    proposal: Replace the static select interaction with a type-ahead control backed by STORY-0087; preserve a hidden addressTypeId; clear stale id when typed text changes; require selection of a returned database identity before submit.
  - file: cylindermanagement.web/src/main/resources/templates/final-version-1/DisplayCustomer.html
    component: Customer address Address Type controls
    proposal: Apply the same database-backed type-ahead/hidden-id/stale-id-clearing behavior for maintenance rows.
  - components: Customer Registration and Customer Update server validation
    proposal: Retain authoritative validation that submitted Address Type identity exists; do not trust display text as identity.
