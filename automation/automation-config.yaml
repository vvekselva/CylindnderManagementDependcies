version: 14

control_repository: vvekselva/CylindnderManagementDependcies
target_repository: vvekselva/CylinderManagement

control_files:
  catalogue: repository-catalogue.md
  global_status: TaskStatus.md
  backlog_contract: automation/backlog-contract.md
  backlog_register: backlog/backlog.yaml
  backlog_run_config: backlog/orchestrator-run-config.yaml
  ssot_governance: governance/ssot-levels.yaml
  runtime_contract: backlog/runtime-contract.yaml
  item_definition_template: backlog/item-definition-template.yaml
  statement_of_work_template: backlog/statement-of-work-template.yaml
  quality_gate_governance: governance/quality-gates.yaml
  lifecycle_logging_contract: governance/execution-lifecycle-logging.yaml
  backlog_quality_gate_root: backlog/gates/
  backlog_item_template: backlog/backlog-item-template.yaml
  automation_policy: governance/automation-policy.md
  worker_operating_guide: governance/worker-operating-guide.md
  automation_log_policy: governance/automation-log-policy.md
  source_artifact_sync_policy: governance/source-artifact-sync-policy.md
  execution_model: automation/execution-model.md
  workflow_contract: automation/workflow-contract.md
  task_contract: automation/task-contract.md
  orchestration_worker_service_contract: automation/worker-service-contract.md
  independent_worker_contract: automation/worker-component-contract.md
  independent_worker_input_template: worker/worker-input-template.yaml
  shared_log: logs/automation-log.md
  invocation_aggregate_logs: logs/runs/INVOCATION-*.md
  transient_lane_run_logs: logs/runs/*-LANE-*.md
  human_story: logs/automation-story.md
  sync_register: sync/source-artifact-sync-register.yaml
  bl002_story_register: stories/story-register.yaml
  bl002_usecase_register: usecases/usecase-register.yaml
  bl002_test_scenarios: usecases/usecase-test-scenarios.yaml
  bl002_cross_traceability: traceability/controller-story-usecase-map.yaml

backlog_orchestration:
  enabled: true
  run_config: backlog/orchestrator-run-config.yaml
  backlog_register: backlog/backlog.yaml
  item_definition_root: backlog/items/
  statement_of_work_root: backlog/sow/
  completion_path_root: backlog/paths/
  quality_gate_root: backlog/gates/
  runtime_root: backlog/runtime/
  runtime_contract: backlog/runtime-contract.yaml
  selection_policy: HIGHEST_PRIORITY_ELIGIBLE_ITEM
  enabled_items_only: true
  max_parallel_backlog_items: 1
  max_parallel_work_units_per_item: 10
  planning_gate: QG-SSOT-001
  statement_of_work_gate: QG-SOW-001
  common_dependency_gate: QG-DEP-001
  lifecycle_logging_gate: QG-LOG-001
  require_level_1_complete_before_plan: true
  require_level_2_complete_before_plan: true
  require_level_3_complete_before_plan: true
  plan_fail_closed_when_ssot_incomplete: true
  item_specific_quality_gate_required: true
  item_specific_quality_gate_user_approval_required: true
  missing_quality_gate_action: DO_NOT_PLAN_OR_EXECUTE
  missing_statement_of_work_action: DO_NOT_PLAN_OR_EXECUTE
  missing_runtime_file_action: DO_NOT_PLAN_OR_EXECUTE
  missing_pre_phase_log_action: DO_NOT_START_PHASE
  missing_post_phase_log_action: RESULT_NOT_ACCEPTED_UNTIL_RECOVERED
  leftover_lane_log_action: RECOVERY_AGGREGATE_VERIFY_DELETE_BEFORE_NEW_EXECUTION
  user_acceptance_required_before_close: true
  primary_hierarchy:
    - PRE_INVOCATION_LANE_LOG_HYGIENE_CHECK
    - ORCHESTRATOR_INVOCATION_START_LOG
    - SELECT_HIGHEST_PRIORITY_ELIGIBLE_RUN_ENABLED_BACKLOG_ITEM
    - SSOT_LEVEL_1_BACKLOG_MASTER
    - SSOT_LEVEL_2_BACKLOG_DEFINITION_AND_SOW
    - SSOT_LEVEL_3_RUNTIME
    - QG_SSOT_001
    - ORCHESTRATOR_ANALYSIS
    - EXECUTION_PLAN
    - WORK_UNIT
    - LANE_ASSIGNMENT_OR_WORKER_INPUT
    - LANE_LIFECYCLE_LOGGED_EXECUTION
    - ORCHESTRATOR_VALIDATION
    - ORCHESTRATOR_LANE_LOG_AGGREGATION
    - ORCHESTRATOR_LANE_LOG_CLEANUP_ZERO_CHECK
    - ORCHESTRATOR_INVOCATION_END_LOG
    - USER_ACCEPTANCE_WHEN_CONFIGURED
    - BACKLOG_CLOSURE

  backlog_states:
    - YET_TO_DO
    - WAITING_FOR_DEPENDENCY
    - READY
    - ANALYZING
    - PLANNED
    - EXECUTING
    - PARTIAL
    - BLOCKED
    - WAITING_FOR_DECISION
    - FAILED
    - VALIDATING
    - WAITING_FOR_USER_VERIFICATION
    - VERIFIED
    - CLOSED

  runtime_files:
    analysis: analysis.yaml
    execution_plan: execution-plan.yaml
    work_unit_status: work-unit-status.yaml
    worker_input_register: worker-input-register.yaml
    lane_status: lane-status.yaml
    lane_dispatch: lane-dispatch.yaml
    local_execution: local-execution.yaml
    execution_statistics: execution-statistics.yaml
    gate_status: gate-status.yaml
    blockers: blockers.yaml
    decisions: decisions.yaml
    result: result.yaml

coordinator:
  enabled: true
  primary_coordinator_count: 1
  consumes_worker_slot: false
  owns_analysis_and_execution: true
  responsibilities:
    - scan_for_leftover_individual_lane_logs_before_new_execution
    - enter_recovery_only_mode_when_leftover_lane_logs_exist
    - aggregate_verify_and_delete_leftover_lane_logs_before_starting_new_execution
    - prove_zero_individual_lane_logs_before_invocation_start_execution
    - persist_orchestrator_invocation_start_before_any_analysis_or_execution
    - load_control_files
    - read_backlog_run_config_first
    - select_highest_priority_eligible_run_enabled_backlog_item
    - ignore_run_disabled_backlog_items
    - load_level_1_backlog_master
    - validate_or_repair_level_1
    - load_level_2_backlog_definition
    - validate_qg_sow_001
    - validate_or_repair_level_2
    - initialize_or_repair_level_3_runtime
    - validate_qg_ssot_001_before_plan_or_replan
    - refuse_plan_or_replan_when_any_ssot_level_is_incomplete
    - perform_required_analysis_inside_level_3_runtime
    - create_or_change_execution_plan_only_after_qg_ssot_001_pass
    - enforce_common_backlog_dependency_gate
    - require_approved_item_specific_quality_gate
    - load_backlog_completion_path
    - create_work_units
    - generate_worker_input_files_from_approved_work_units
    - validate_worker_input_files
    - assign_orchestration_work_to_lanes
    - maintain_lane_status_ssot
    - enforce_lane_lifecycle_log_boundaries
    - refuse_phase_start_when_required_pre_phase_log_is_missing
    - validate_qg_log_001_before_accepting_execution_results
    - release_lane_only_after_persisted_close_or_recovery_close
    - submit_worker_input_to_independent_worker
    - consume_only_closed_worker_results
    - validate_worker_result_contracts
    - analyse_worker_results_for_follow_up_work
    - maintain_blockers_ledger
    - evaluate_item_specific_quality_gates
    - refuse_to_invent_missing_scope_or_quality_gates
    - enforce_bl002_story_and_usecase_approval_when_selected
    - stop_for_user_story_or_usecase_decision_when_required
    - wait_for_user_acceptance_gate_when_required
    - produce_backlog_artifacts
    - update_backlog_status
    - close_backlog_item_only_after_all_required_gates_pass
    - serialize_shared_file_updates
    - maintain_human_readable_logs_and_story
    - persist_orchestrator_log_aggregation_start_after_all_lanes_closed
    - accumulate_each_lane_log_into_invocation_aggregate
    - consolidate_meaningful_lane_audit_into_shared_log
    - verify_each_lane_log_is_represented_before_deletion
    - delete_individual_lane_logs_after_verified_accumulation
    - rescan_and_prove_zero_individual_lane_logs_before_invocation_end
    - persist_orchestrator_log_aggregation_end_only_on_pass
    - persist_orchestrator_invocation_end_after_log_cleanup_and_runtime_sync
    - run_source_artifact_sync_decisions

independent_worker:
  enabled: true
  component_name: WORKER
  independent_of_orchestration_pool: true
  consumes_orchestration_lane: false
  contract: automation/worker-component-contract.md
  input_template: worker/worker-input-template.yaml
  task_definition_source: INPUT_FILE_ONLY
  lifecycle: [INIT, SERVICE, CLOSE]
  hard_coded_project_task_logic: false
  rules:
    - do_not_start_without_valid_input_file
    - execute_only_actions_from_input_file
    - do_not_select_backlog_item
    - do_not_choose_completion_path
    - do_not_create_own_follow_up_task
    - do_not_broaden_scope_without_new_input
    - do_not_escalate_permissions_from_input
    - governance_overrides_input_permissions
    - structured_result_must_follow_declared_contract
    - explain_blockers_in_plain_english
    - do_not_guess
  runtime_paths:
    inputs: worker/inputs/WI-*.yaml
    human_runs: worker/runs/WI-*.md
    markdown_results: worker/results/WI-*.md
    yaml_results: worker/results/WI-*.yaml

orchestration_worker_pool:
  worker_count: 10
  lane_count: 10
  max_parallel_jobs: 10
  independent_worker_is_not_counted: true
  one_active_job_per_lane: true
  lane_status_ssot: backlog/runtime/<BL-ID>/lane-status.yaml
  lane_states: [IDLE, ASSIGNED, INITIALIZING, WORKING, BLOCKED, WAITING, CLOSING, STALE]
  lane_run_log_pattern: logs/runs/INVOCATION-<timestamp>-LANE-<nn>.md
  lane_run_logs_transient: true
  required_lifecycle_events: [LANE_INIT_START, LANE_INIT_END, LANE_SERVICE_START, LANE_SERVICE_END, LANE_CLOSE_END]
  assignment_rule: >-
    A lane becomes non-IDLE only after the coordinator records an eligible Work Unit/task assignment in lane-status.yaml.
  logging_rule: >-
    Persist INIT/SERVICE/CLOSE lifecycle boundaries. SERVICE is omitted only for BLOCKED_BEFORE_SERVICE.
  release_rule: >-
    A lane may return to IDLE or receive new work only after LANE_CLOSE_END or recovery-close evidence is persisted.
  retention_rule: >-
    Individual lane logs are aggregated, verified and deleted before invocation close; closed invocation postcondition is zero individual lane logs.
  heartbeat_rule: >-
    WORKING lanes must record last_heartbeat; stale lanes return their Work Unit to coordinator recovery.
  lanes: [LANE-01, LANE-02, LANE-03, LANE-04, LANE-05, LANE-06, LANE-07, LANE-08, LANE-09, LANE-10]

orchestration_worker_service_lifecycle:
  contract: automation/worker-service-contract.md
  logging_contract: governance/execution-lifecycle-logging.yaml
  mandatory: true
  phases: [INIT, SERVICE, CLOSE]
  required_event_order: [LANE_INIT_START, LANE_INIT_END, LANE_SERVICE_START, LANE_SERVICE_END, LANE_CLOSE_END]
  close_mandatory_after_init: true
  qg_log_001_required_for_result_acceptance: true
  stale_worker_recovery:
    coordinator_closes_unfinished_log: true
    result_state: RESULT_NOT_CONFIRMED

lane_log_hygiene:
  individual_lane_log_match: logs/runs/*-LANE-*.md
  pre_invocation_required_count: 0
  pre_invocation_nonzero_action: RECOVERY_ONLY_NO_NEW_EXECUTION
  aggregate_into_invocation_log: true
  aggregate_into_shared_audit_summary: true
  verify_before_delete: true
  delete_after_verified_aggregation: true
  invocation_end_required_count: 0
  new_invocation_forbidden_while_nonzero: true

scheduler:
  invocation: EXTERNAL_CHATGPT_AUTOMATION
  cadence: HOURLY
  primary_coordinator_required: true
  duplicate_cylinder_coordinators_allowed: false
  run_config_source: backlog/orchestrator-run-config.yaml
  invocation_log_pattern: logs/runs/INVOCATION-<timestamp>.md
  pre_invocation_lane_log_scan_required: true
  invocation_start_log_required_before_analysis: true
  invocation_end_log_required_after_runtime_sync_and_lane_log_cleanup: true
  backlog_selection_required_each_invocation: true
  note: >-
    The ChatGPT scheduled trigger starts one backlog-driven Orchestrator invocation. It must read backlog/backlog.yaml and
    backlog/orchestrator-run-config.yaml, select the highest-priority eligible run-enabled item, and must not be hard-coded
    to BL-001. BL-002 becomes eligible only after BL-001 is VERIFIED/CLOSED and its final matrix is validated.

registered_backlog_items:
  source: backlog/backlog.yaml
  count: 21
  note: >-
    The Level 1 Backlog Master is authoritative. Entries with incomplete Level 2/3 planning references remain registered but non-plannable.

current_backlog_item:
  id: BL-001
  run_enabled: true
  state: PARTIAL
  ssot_level_1: COMPLETE
  ssot_level_2: COMPLETE
  ssot_level_3: COMPLETE
  planning_gate: QG-SSOT-001
  planning_gate_state: PASS
  statement_of_work_gate: QG-SOW-001
  statement_of_work_gate_state: PASS
  lifecycle_logging_gate: QG-LOG-001
  lifecycle_logging_gate_state: ENFORCED_FOR_CURRENT_AND_FUTURE_INVOCATION_BOUNDARIES
  item_definition: backlog/items/BL-001-controller-traceability.yaml
  quality_gate: backlog/gates/BL-001-traceability.yaml
  quality_gate_approved: true
  runtime: backlog/runtime/BL-001/
  lane_status: backlog/runtime/BL-001/lane-status.yaml
  current_work_unit: WU-BL001-001
  next_worker_input: worker/inputs/WI-0004.yaml
  handoff_when_complete: BL-002

bl002:
  id: BL-002
  run_enabled: true
  state: WAITING_FOR_DEPENDENCY
  dependency: BL-001
  item_definition: backlog/items/BL-002-controller-story-usecase.yaml
  statement_of_work: backlog/sow/BL-002-controller-story-usecase.yaml
  quality_gate: backlog/gates/BL-002-controller-story-usecase.yaml
  runtime: backlog/runtime/BL-002/
  workflow: workflows/WF-003-controller-story-usecase.yaml
  story_register: stories/story-register.yaml
  usecase_register: usecases/usecase-register.yaml
  test_scenarios: usecases/usecase-test-scenarios.yaml
  cross_traceability: traceability/controller-story-usecase-map.yaml
  rules:
    - import_only_final_validated_bl001_matrix
    - do_not_invent_business_meaning
    - story_technical_validation_does_not_equal_user_approval
    - only_user_approved_stories_feed_usecases_or_downstream_testing
    - only_user_approved_usecases_feed_usecase_testing
    - source_change_stales_affected_approvals

scheduling:
  dependency_policy: strict
  only_ready_work_units_are_assignable: true
  priorities: [P0_RECOVERY, P1_BLOCKER_CLEARING, P2_CRITICAL_PATH, P3_NORMAL]
  retry:
    max_automatic_attempts: 2
    after_retry_limit: WAITING_FOR_DECISION

blocker_handling:
  plain_english_required: true
  guessing_allowed: false
  blockers_file_required: true
  missing_ssot_is_planning_blocker: true
  missing_statement_of_work_is_planning_blocker: true
  missing_quality_gate_is_planning_and_execution_blocker: true
  missing_required_pre_phase_log_is_execution_blocker: true
  missing_required_post_phase_log_blocks_result_acceptance: true
  leftover_individual_lane_logs_block_new_execution: true
  failed_lane_log_aggregation_blocks_invocation_close: true
  alternatives_may_be_suggested: true
  completion_path_change_requires_approval: true
  workflow_or_architecture_change_requires_approval: true

shared_file_ownership:
  owner: coordinator
  files:
    - backlog/backlog.yaml
    - backlog/orchestrator-run-config.yaml
    - backlog/runtime/<BL-ID>/lane-status.yaml
    - TaskStatus.md
    - logs/automation-log.md
    - logs/automation-story.md
    - sync/source-artifact-sync-register.yaml
    - repository-catalogue.md
    - governance/ssot-levels.yaml
    - governance/quality-gates.yaml
    - stories/story-register.yaml
    - usecases/usecase-register.yaml
    - usecases/usecase-test-scenarios.yaml
    - traceability/controller-story-usecase-map.yaml
  transient_parallel_lane_owned_paths:
    - logs/runs/INVOCATION-<timestamp>-LANE-<nn>.md
  coordinator_invocation_owned_paths:
    - logs/runs/INVOCATION-<timestamp>.md

source_artifact_sync:
  enabled: true
  policy: governance/source-artifact-sync-policy.md
  register: sync/source-artifact-sync-register.yaml
  classifications:
    INTERNAL_ONLY: {notify_user: false, refresh_artifact: false}
    TRACE_CHANGED: {notify_user: false, refresh_artifact: true}
    EXPOSED_API_CHANGED: {notify_user: true, refresh_artifact: true}
    COMPONENT_ADDED_OR_REMOVED: {notify_user: true, refresh_artifact: true}
    IMPACT_NOT_CONFIRMED: {notify_user: true, refresh_artifact: false, review_required: true}

resource_locks:
  - {name: PRODUCTION_DATABASE_WRITE, capacity: 1}
  - {name: MAIN_BRANCH_WRITE, capacity: 1}
  - {name: RELEASE_OPERATION, capacity: 1}
  - {name: SAME_FILE_SET, capacity: 1}
  - {name: SHARED_CONTROL_FILES, capacity: 1}

execution:
  source_branch_pattern: automation/{backlog_id}/{run_id}/{work_unit_id}
  direct_write_to_main: false
  require_evidence_before_verified: true
  backlog_item_requires_run_enabled: true
  backlog_item_requires_complete_level_1_before_plan: true
  backlog_item_requires_complete_level_2_before_plan: true
  backlog_item_requires_complete_level_3_before_plan: true
  backlog_item_requires_qg_ssot_001_pass_before_plan_or_replan: true
  backlog_item_requires_valid_statement_of_work: true
  backlog_item_requires_completion_path: true
  backlog_item_requires_dependency_gate_pass: true
  backlog_item_requires_approved_quality_gate: true
  backlog_analysis_required_before_material_plan_changes: true
  execution_plan_required_before_worker_input_generation: true
  pre_invocation_lane_log_count_must_be_zero_before_new_execution: true
  orchestrator_invocation_start_log_required_before_analysis: true
  lane_assignment_must_be_recorded_before_execution: true
  lane_init_start_log_required_before_init: true
  lane_init_end_log_required_after_init: true
  lane_service_start_log_required_before_service: true
  lane_service_end_log_required_after_service: true
  lane_close_end_log_required_after_close: true
  lane_release_must_be_recorded_after_close_log: true
  qg_log_001_required_before_execution_result_acceptance: true
  lane_log_aggregation_required_before_invocation_end: true
  individual_lane_logs_must_be_deleted_after_verified_aggregation: true
  post_invocation_lane_log_count_must_be_zero: true
  orchestrator_invocation_end_log_required_after_runtime_sync: true
  worker_input_generated_by_orchestrator_only: true
  independent_worker_run_must_close_before_result_is_accepted: true
  machine_result_contract_must_validate_before_orchestrator_consumes: true
  backlog_item_closes_only_after_item_quality_gates_and_user_acceptance_pass: true
  orchestration_log_must_close_before_lane_release: true

staleness:
  worker_heartbeat_minutes: 5
  stale_after_minutes: 20
  stale_action: RETURN_WORK_UNIT_TO_COORDINATOR_AND_RECOVERY_CLOSE_LOG

registered_workflows:
  - workflows/WF-001-controller-traceability/workflow.yaml
  - workflows/WF-002-incremental-traceability-matrix.yaml
  - workflows/WF-002-source-artifact-sync/workflow.yaml
  - workflows/WF-003-controller-story-usecase.yaml
