version: 7

control_repository: vvekselva/CylindnderManagementDependcies
target_repository: vvekselva/CylinderManagement

control_files:
  catalogue: repository-catalogue.md
  global_status: TaskStatus.md
  automation_policy: governance/automation-policy.md
  worker_operating_guide: governance/worker-operating-guide.md
  automation_log_policy: governance/automation-log-policy.md
  source_artifact_sync_policy: governance/source-artifact-sync-policy.md
  execution_model: automation/execution-model.md
  workflow_contract: automation/workflow-contract.md
  task_contract: automation/task-contract.md
  orchestration_worker_service_contract: automation/worker-service-contract.md
  independent_worker_contract: automation/worker-component-contract.md
  independent_worker_workspace: worker/README.md
  independent_worker_input_template: worker/worker-input-template.yaml
  shared_log: logs/automation-log.md
  human_story: logs/automation-story.md
  sync_register: sync/source-artifact-sync-register.yaml

coordinator:
  enabled: true
  consumes_worker_slot: false
  responsibilities:
    - load_control_files
    - load_registered_workflows
    - build_runnable_job_queue
    - enforce_job_dependencies
    - assign_jobs_to_orchestration_lanes
    - create_or_select_worker_input_files
    - submit_worker_input_to_independent_worker
    - validate_worker_result_contracts
    - register_worker_output_as_orchestrator_input
    - consume_closed_worker_results
    - enforce_resource_locks
    - serialize_shared_file_updates
    - open_human_readable_orchestration_log_events
    - close_human_readable_orchestration_log_events
    - recover_unclosed_orchestration_logs
    - evaluate_quality_gates
    - run_source_artifact_sync_decisions
    - update_status_and_evidence
    - generate_human_story

independent_worker:
  enabled: true
  component_name: WORKER
  independent_of_orchestration_pool: true
  consumes_orchestration_lane: false
  contract: automation/worker-component-contract.md
  workspace: worker/
  input_template: worker/worker-input-template.yaml
  task_definition_source: INPUT_FILE_ONLY
  lifecycle:
    - INIT
    - SERVICE
    - CLOSE
  hard_coded_project_task_logic: false
  input_requirements:
    - worker_input_id
    - requested_by
    - task_name
    - task_purpose
    - task_type
    - target
    - scope
    - permissions
    - actions
    - evidence_requirements
    - expected_output
    - completion_check
    - blocker_policy
  rules:
    - do_not_start_without_valid_input_file
    - execute_only_actions_from_input_file
    - do_not_broaden_scope_without_new_input
    - do_not_escalate_permissions_from_input
    - governance_overrides_input_permissions
    - input_becomes_immutable_after_successful_init
    - changed_task_requires_new_worker_input_id
    - structured_result_must_follow_declared_contract
    - explain_blockers_in_plain_english
    - do_not_guess
  forbidden_orchestration_actions:
    - schedule_workflows
    - assign_orchestration_jobs
    - choose_job_priority
    - update_global_task_status
    - update_shared_automation_log
    - update_sync_register
    - decide_user_notification
  runtime_paths:
    inputs: worker/inputs/WI-*.yaml
    human_runs: worker/runs/WI-*.md
    markdown_results: worker/results/WI-*.md
    yaml_results: worker/results/WI-*.yaml

orchestration_worker_pool:
  worker_count: 10
  lane_count: 10
  max_parallel_jobs: 10
  independent_worker_is_not_counted: true
  one_active_job_per_lane: true
  lanes:
    - LANE-01
    - LANE-02
    - LANE-03
    - LANE-04
    - LANE-05
    - LANE-06
    - LANE-07
    - LANE-08
    - LANE-09
    - LANE-10

orchestration_worker_service_lifecycle:
  contract: automation/worker-service-contract.md
  mandatory: true
  phases:
    - INIT
    - SERVICE
    - CLOSE
  close_mandatory_after_init: true
  stale_worker_recovery:
    coordinator_closes_unfinished_log: true
    result_state: RESULT_NOT_CONFIRMED

initial_traceability_baseline:
  workflow: workflows/WF-001-controller-traceability/workflow.yaml
  mode: SOURCE_CHECK_OUTPUT_TO_ORCHESTRATOR_MATRIX
  enabled: true

  source_check:
    job: JOB-002
    worker_input: worker/inputs/WI-0004.yaml
    canonical_output: worker/results/WI-0004.yaml
    human_run: worker/runs/WI-0004.md
    output_contract: workflows/WF-001-controller-traceability/source-check-output-contract.yaml

  orchestrator_handoff:
    runtime_file: workflows/WF-001-controller-traceability/runtime/orchestrator-input.yaml
    consumer_job: JOB-003
    input_name: SOURCE_CHECK_OUTPUT
    canonical_input: worker/results/WI-0004.yaml
    evidence_register: workflows/WF-001-controller-traceability/evidence/evidence-register.yaml

  traceability_job:
    job: JOB-003
    source_repo_read_allowed: false
    additional_source_worker_inputs_allowed: false
    human_source_check_output: traceability/source-repository-check.md
    controller_inventory: traceability/controller-inventory.md
    endpoint_inventory: traceability/endpoint-inventory.md
    matrix_output: traceability/controller-traceability.md
    unresolved_output: traceability/unresolved-traceability.md

  partial_worker_results_unlock_matrix: false
  matrix_start_requirements:
    - JOB-002_VERIFIED
    - WI-0004_RESULT_COMPLETED
    - WI-0004_RUN_CLOSED
    - WI-0004_YAML_CONTRACT_VALID
    - WI-0004_SOURCE_BASELINE_MATCHES_WORKFLOW
    - WI-0004_COVERAGE_100_PERCENT
    - ORCHESTRATOR_INPUT_ACCEPTED

  explanation: >-
    For the first trusted traceability baseline, the Worker performs one complete Source
    Repository Check and produces a canonical YAML result. The Orchestrator accepts that
    output as JOB-003 input and constructs the matrix from it. JOB-003 does not re-read
    source or create another source-inspection Worker Input during the initial baseline.

scheduling:
  dependency_policy: strict
  only_ready_jobs_are_assignable: true
  priorities:
    - P0_RECOVERY
    - P1_BLOCKER_CLEARING
    - P2_CRITICAL_PATH
    - P3_NORMAL
  fairness:
    max_workers_per_workflow: 10
    allow_unused_capacity_to_exceed_workflow_limit: true
  retry:
    max_automatic_attempts: 2
    after_retry_limit: WAITING_FOR_DECISION

status_lifecycle:
  - YET_TO_DO
  - READY
  - IN_PROGRESS
  - PARTIAL
  - BLOCKED
  - WAITING_FOR_DECISION
  - FAILED
  - COMPLETED
  - VERIFIED
  - CLOSED

blocker_handling:
  plain_english_required: true
  technical_symptom_only_is_not_sufficient: true
  guessing_allowed: false
  alternatives_may_be_suggested: true
  workflow_or_architecture_change_requires_approval: true

shared_file_ownership:
  owner: coordinator
  files:
    - TaskStatus.md
    - logs/automation-log.md
    - logs/automation-story.md
    - sync/source-artifact-sync-register.yaml
    - repository-catalogue.md

source_artifact_sync:
  enabled: true
  policy: governance/source-artifact-sync-policy.md
  register: sync/source-artifact-sync-register.yaml
  classifications:
    INTERNAL_ONLY:
      notify_user: false
      refresh_artifact: false
    TRACE_CHANGED:
      notify_user: false
      refresh_artifact: true
    EXPOSED_API_CHANGED:
      notify_user: true
      refresh_artifact: true
    COMPONENT_ADDED_OR_REMOVED:
      notify_user: true
      refresh_artifact: true
    IMPACT_NOT_CONFIRMED:
      notify_user: true
      refresh_artifact: false
      review_required: true

resource_locks:
  - name: PRODUCTION_DATABASE_WRITE
    capacity: 1
  - name: MAIN_BRANCH_WRITE
    capacity: 1
  - name: RELEASE_OPERATION
    capacity: 1
  - name: SAME_FILE_SET
    capacity: 1
  - name: SHARED_CONTROL_FILES
    capacity: 1

execution:
  source_branch_pattern: automation/{run_id}/{job_id}
  direct_write_to_main: false
  require_evidence_before_verified: true
  dependent_jobs_wait_for_completed_or_verified: true
  one_source_baseline_per_workflow: true
  every_orchestration_job_attempt_uses_worker_service_lifecycle: true
  independent_worker_requires_input_file: true
  independent_worker_task_is_defined_by_input_file: true
  independent_worker_run_must_close_before_result_is_accepted: true
  machine_result_contract_must_validate_before_orchestrator_consumes: true
  orchestration_log_must_close_before_lane_release: true

staleness:
  worker_heartbeat_minutes: 5
  stale_after_minutes: 20
  stale_action: RETURN_JOB_TO_COORDINATOR_AND_RECOVERY_CLOSE_LOG

registered_workflows:
  - workflows/WF-001-controller-traceability/workflow.yaml
  - workflows/WF-002-source-artifact-sync/workflow.yaml
