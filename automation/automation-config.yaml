version: 4

control_repository: vvekselva/CylindnderManagementDependcies
target_repository: vvekselva/CylinderManagement

control_files:
  catalogue: repository-catalogue.md
  global_status: TaskStatus.md
  automation_policy: governance/automation-policy.md
  worker_operating_guide: governance/worker-operating-guide.md
  automation_log_policy: governance/automation-log-policy.md
  source_artifact_sync_policy: governance/source-artifact-sync-policy.md
  execution_model: automation/execution-model.md
  workflow_contract: automation/workflow-contract.md
  task_contract: automation/task-contract.md
  worker_service_contract: automation/worker-service-contract.md
  source_analysis_worker_contract: automation/source-analysis-worker-contract.md
  source_analysis_workspace: source-analysis/README.md
  shared_log: logs/automation-log.md
  human_story: logs/automation-story.md
  sync_register: sync/source-artifact-sync-register.yaml

coordinator:
  enabled: true
  consumes_worker_slot: false
  responsibilities:
    - load_control_files
    - load_registered_workflows
    - build_runnable_job_queue
    - enforce_job_dependencies
    - assign_jobs_to_workers
    - request_source_facts_from_source_analysis_worker
    - enforce_resource_locks
    - collect_worker_init_records
    - collect_worker_service_results
    - collect_worker_close_records
    - serialize_shared_file_updates
    - open_human_readable_log_event_on_init
    - close_human_readable_log_event_on_close
    - recover_unclosed_worker_logs
    - evaluate_quality_gates
    - run_source_artifact_sync_decisions
    - update_status_and_evidence
    - generate_human_story

source_analysis_worker:
  enabled: true
  independent_of_orchestration_pool: true
  consumes_orchestration_worker_slot: false
  read_only_source_access: true
  contract: automation/source-analysis-worker-contract.md
  request_result_template: source-analysis/source-analysis-request-result-template.md
  target_repository: vvekselva/CylinderManagement
  lifecycle:
    - INIT
    - SERVICE
    - CLOSE
  responsibilities:
    - enumerate_source_files
    - inspect_source_annotations
    - identify_exposed_spring_components
    - identify_endpoint_mappings
    - inspect_method_calls
    - inspect_dependency_references
    - inspect_repository_and_dao_calls
    - inspect_entity_table_mappings
    - inspect_query_and_database_object_evidence
    - identify_external_or_terminal_dependencies
    - return_proved_source_facts
    - return_unresolved_source_facts_without_guessing
  forbidden_actions:
    - schedule_workflows
    - assign_orchestration_jobs
    - choose_job_priority
    - update_global_task_status
    - update_shared_automation_log
    - update_sync_register
    - notify_user_directly
    - edit_target_source
    - create_target_source_branch
    - commit_target_source_changes
    - database_write
  fact_confidence:
    - PROVED
    - UNRESOLVED
    - NOT_APPLICABLE
  runtime_paths:
    runs: source-analysis/runs/SAR-*.md
    results: source-analysis/results/SAR-*.md
  mutable_shared_output_owner: NONE
  same_baseline_parallel_reads_allowed: true

worker_pool:
  worker_count: 10
  lane_count: 10
  max_parallel_jobs: 10
  source_analysis_worker_is_not_counted: true
  one_active_job_per_worker: true
  lanes:
    - LANE-01
    - LANE-02
    - LANE-03
    - LANE-04
    - LANE-05
    - LANE-06
    - LANE-07
    - LANE-08
    - LANE-09
    - LANE-10

worker_service_lifecycle:
  contract: automation/worker-service-contract.md
  mandatory: true
  applies_to: ORCHESTRATION_JOB_WORKERS
  phases:
    - INIT
    - SERVICE
    - CLOSE
  init:
    purpose: PREPARE_JOB_AND_OPEN_LOG
    must_record:
      - worker_lane
      - workflow_id
      - job_id
      - run_id
      - attempt
      - source_baseline
      - purpose
      - planned_actions
      - expected_output
    success_state: INITIALIZED
    blocker_state: BLOCKED_BEFORE_SERVICE
  service:
    purpose: EXECUTE_ASSIGNED_JOB_ACTIONS
    allowed_results:
      - COMPLETED
      - PARTIAL
      - BLOCKED
      - FAILED
  close:
    purpose: FINALIZE_RESULT_AND_CLOSE_LOG
    mandatory_after_init: true
    exactly_once: true
    must_record:
      - actions_completed
      - actions_not_completed
      - outputs
      - evidence
      - blocker_or_failure
      - alternatives
      - final_result
      - next_action
      - end_time
    final_log_state: CLOSED
  stale_worker_recovery:
    coordinator_closes_unfinished_log: true
    result_state: RESULT_NOT_CONFIRMED

scheduling:
  dependency_policy: strict
  only_ready_jobs_are_assignable: true
  priorities:
    - P0_RECOVERY
    - P1_BLOCKER_CLEARING
    - P2_CRITICAL_PATH
    - P3_NORMAL
  fairness:
    max_workers_per_workflow: 10
    allow_unused_capacity_to_exceed_workflow_limit: true
  retry:
    max_automatic_attempts: 2
    after_retry_limit: WAITING_FOR_DECISION

status_lifecycle:
  - YET_TO_DO
  - READY
  - IN_PROGRESS
  - PARTIAL
  - BLOCKED
  - WAITING_FOR_DECISION
  - FAILED
  - COMPLETED
  - VERIFIED
  - CLOSED

blocker_handling:
  plain_english_required: true
  technical_symptom_only_is_not_sufficient: true
  worker_may_guess: false
  worker_may_suggest_alternatives: true
  worker_may_change_workflow_without_approval: false
  approved_workflow_fallback_may_be_used: true

shared_file_ownership:
  owner: coordinator
  files:
    - TaskStatus.md
    - logs/automation-log.md
    - logs/automation-story.md
    - sync/source-artifact-sync-register.yaml
    - repository-catalogue.md

source_artifact_sync:
  enabled: true
  policy: governance/source-artifact-sync-policy.md
  register: sync/source-artifact-sync-register.yaml
  classifications:
    INTERNAL_ONLY:
      notify_user: false
      refresh_artifact: false
    TRACE_CHANGED:
      notify_user: false
      refresh_artifact: true
    EXPOSED_API_CHANGED:
      notify_user: true
      refresh_artifact: true
    COMPONENT_ADDED_OR_REMOVED:
      notify_user: true
      refresh_artifact: true
    IMPACT_NOT_CONFIRMED:
      notify_user: true
      refresh_artifact: false
      review_required: true

resource_locks:
  - name: PRODUCTION_DATABASE_WRITE
    capacity: 1
  - name: MAIN_BRANCH_WRITE
    capacity: 1
  - name: RELEASE_OPERATION
    capacity: 1
  - name: SAME_FILE_SET
    capacity: 1
  - name: SHARED_CONTROL_FILES
    capacity: 1

execution:
  source_branch_pattern: automation/{run_id}/{job_id}
  direct_write_to_main: false
  require_evidence_before_verified: true
  dependent_jobs_wait_for_completed_or_verified: true
  one_source_baseline_per_workflow: true
  every_job_attempt_uses_worker_service_lifecycle: true
  source_analysis_requests_use_independent_lifecycle: true
  orchestration_workers_consume_source_facts_instead_of_guessing_source_structure: true
  log_must_be_closed_before_worker_release: true

staleness:
  worker_heartbeat_minutes: 5
  stale_after_minutes: 20
  stale_action: RETURN_JOB_TO_COORDINATOR_AND_RECOVERY_CLOSE_LOG

registered_workflows:
  - workflows/WF-001-controller-traceability/workflow.yaml
  - workflows/WF-002-source-artifact-sync/workflow.yaml
