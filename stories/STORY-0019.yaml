story:
  story_id: STORY-0019
  title: Display challan-entry aging dashboard tracker and audit data
  state: READY_FOR_USER_REVIEW
  fingerprint: e5cc9367faaa515747f750c99184ebcaae0d11e7e4acaa7d7dca65bafce9a2ac
  source_baseline: 3ae6e61442132d94a307275b08dd65fcef228d89
  matrix_row_keys: ["GET /challan-entry-aging-dashboard"]
  controller: ChallanEntryAgingDashboardController.showChallanEntryAgingDashboard
  endpoint: "GET /challan-entry-aging-dashboard"
  business_purpose: Display tracker-aging metrics and audit rows using the source-proved tracker and tracker-audit persistence dependencies.
  trigger_and_context: A caller requests GET /challan-entry-aging-dashboard.
  inputs: []
  normalization_and_defaults: []
  validations: []
  invalid_value_paths:
    - No caller-supplied request-value validation is asserted because none is proved in the accepted endpoint trace.
  main_flow:
    - The request reaches ChallanEntryAgingDashboardController.showChallanEntryAgingDashboard.
    - The controller invokes ChallanEntryAgingDashboardService.fetchDashboard.
    - The tracker branch obtains status counts and dashboard rows from TripChallanEntryTrackerJpaDao.
    - TripChallanEntryTrackerDo maps the tracker persistence rows from public.tbl_trip_challan_entry_tracker.
    - ChallanEntryAgingDashboardMapper maps tracker rows to dashboard DTOs.
    - The audit branch obtains dashboard rows from TripChallanEntryTrackerAuditJpaDao.
    - TripChallanEntryTrackerAuditDo maps audit rows from public.tbl_trip_challan_entry_tracker_audit.
    - ChallanEntryAgingDashboardMapper maps audit rows to DTOs.
    - The controller returns final-version-1/ChallanEntryAgingDashboard.
  component_flow:
    - ChallanEntryAgingDashboardController.showChallanEntryAgingDashboard
    - ChallanEntryAgingDashboardService.fetchDashboard
    - TripChallanEntryTrackerJpaDao.countByTrackerStatus / findDashboardRows
    - TripChallanEntryTrackerDo
    - public.tbl_trip_challan_entry_tracker
    - ChallanEntryAgingDashboardMapper.mapTrackerDosToDtos
    - TripChallanEntryTrackerAuditJpaDao.findDashboardRows
    - TripChallanEntryTrackerAuditDo
    - public.tbl_trip_challan_entry_tracker_audit
    - ChallanEntryAgingDashboardMapper.mapAuditDosToDtos
    - final-version-1/ChallanEntryAgingDashboard
  business_rules:
    - Only the source-proved tracker-status counting and dashboard-row retrieval is asserted; no unproved aging policy is added.
  data_reads_and_writes:
    - Reads public.tbl_trip_challan_entry_tracker.
    - Reads public.tbl_trip_challan_entry_tracker_audit.
    - No persistence write is proved for this GET endpoint.
  side_effects_and_state_changes: []
  alternate_and_error_flows:
    - No additional alternate or error branch is asserted beyond framework/runtime handling not proved in the accepted trace.
  output_and_postconditions:
    - Returns final-version-1/ChallanEntryAgingDashboard populated from the accepted tracker and audit branches.
    - No database mutation is proved.
  evidence:
    - traceability/controller-traceability.md row "GET /challan-entry-aging-dashboard"
    - logs/runs/PRODUCTION-FIRE-20260824-005711.md
  downstream_test_assertions:
    - classification: BOTH
      assertion: The dashboard must obtain tracker metrics/rows and audit rows from the two accepted persistence tables and return the aging dashboard view without a proved write.
  approval:
    owner: USER
    state: PENDING_USER_DECISION
    fingerprint: e5cc9367faaa515747f750c99184ebcaae0d11e7e4acaa7d7dca65bafce9a2ac
