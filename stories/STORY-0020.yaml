  main_flow:
    - The request reaches ChallanHeatmapController.showHeatmap.
    - The controller constructs ChallanHeatmapFetchRequestDto without setting serachQueryData.
    - The controller invokes ChallanHeatmapFetchService.processRequest.
    - Because the assigned-book-window flags are not set for this controller path, the service follows the normal heatmap-metrics branch.
    - ChallanHeatmapMetricsViewJpaDao reads heatmap metrics plus distinct book types, book codes and series prefixes.
    - ChallanHeatmapMetricsViewDo maps rows from public.vw_challan_heatmap_metrics.
    - ChallanHeatmapMetricsViewMapper maps the view rows to ChallanHeatmapMetricDto.
    - The controller returns final-version-1/ChallanHeatmapDashboard.
  component_flow:
    - ChallanHeatmapController.showHeatmap
    - ChallanHeatmapFetchService.processRequest
    - ChallanHeatmapMetricsViewJpaDao.findHeatmapMetrics / findDistinctBookTypes / findDistinctBookCodes / findDistinctSeriesPrefixes
    - ChallanHeatmapMetricsViewDo
    - public.vw_challan_heatmap_metrics
    - ChallanHeatmapMetricsViewMapper.mapDoToDto
    - final-version-1/ChallanHeatmapDashboard
  business_rules:
    - For this endpoint the accepted trace proves that the assigned-book-window branch is not used because the controller does not set its required query-data flags.
    - No other heatmap business rule is inferred.
  data_reads_and_writes:
    - Reads public.vw_challan_heatmap_metrics for metrics and filter option values.
    - No persistence write is proved for this GET endpoint.
  side_effects_and_state_changes: []
