  main_flow:
    - VehicleTripLoadWizardController.showWizard handles GET /wizard/vehicle-trip-load.
    - The controller reads vehicle-load purposes, total products and product details through LookupDataCache.
    - The controller invokes populateActiveChallanBooks for the active challan-book branch.
    - populateActiveChallanBooks queries ActiveChallanBookForTripLoadViewJpaDao.findByBookType.
    - The DAO maps ActiveChallanBookForTripLoadViewDo to public.vw_active_challan_books_for_trip_load.
    - The controller combines the proved lookup-cache data and active challan-book data for the wizard model.
    - The terminal view is final-version-1/VehicleTripLoadWizard.
  component_flow:
    - VehicleTripLoadWizardController.showWizard
    - LookupDataCache.getVehicleLoadPurposes / getTotalProducts / getProduct
    - in-memory LookupDataCache
    - VehicleTripLoadWizardController.populateActiveChallanBooks
    - ActiveChallanBookForTripLoadViewJpaDao.findByBookType
    - ActiveChallanBookForTripLoadViewDo
    - public.vw_active_challan_books_for_trip_load
    - final-version-1/VehicleTripLoadWizard
  data_reads_and_writes:
    - READ public.vw_active_challan_books_for_trip_load through ActiveChallanBookForTripLoadViewJpaDao.findByBookType.
    - READ lookup values from the in-memory LookupDataCache.
    - No persistent write is proved for this GET handler.
  side_effects_and_state_changes:
    - No persistent application state change is proved.
    - No database write is performed by the accepted request path.
  alternate_and_error_flows:
