    - YardInventoryDo
    - public.tbl_yard_inventory
    - YardLocationJpaDao.findFirstByYardYardInventoryIdAndActiveTrueAndDefaultStartPointTrueOrderByYardLocationIdDesc
    - YardLocationJpaDao.save
    - YardLocationDo
    - public.tbl_yard_location
    - redirect:/yard-location/upload
  business_rules:
    - The source-proved persistence flow looks up the referenced yard before saving the yard-location record.
    - No additional ownership, geographic or uniqueness rule is inferred.
  data_reads_and_writes:
    - Reads public.tbl_yard_inventory.
    - Reads public.tbl_yard_location for an active/default-start-point location.
    - Writes public.tbl_yard_location through YardLocationJpaDao.save.
  side_effects_and_state_changes:
    - Persists the source-proved yard-location state.
    - Redirects back to the yard-location upload page on terminal success/error paths.
