    - YardInventoryDo maps that record to public.tbl_yard_inventory.
    - The service reads an existing active/default-start-point location through YardLocationJpaDao.findFirstByYardYardInventoryIdAndActiveTrueAndDefaultStartPointTrueOrderByYardLocationIdDesc.
