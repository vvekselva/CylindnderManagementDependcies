version: 10
purpose: >-
  Tell the Orchestrator which Backlog Items may run and enforce the self-reliant production execution loop. Scheduler
  invocations are backlog-driven, not permanently bound to BL-001. BL-001 remains the current eligible item; BL-002 is
  run-enabled now but fail-closed behind BL-001 verification/closure and then converts the final Controller Dependency
  Matrix into user-approved human-readable Stories, approved Use Cases and downstream test scenarios.

selection:
  mode: ENABLED_BACKLOG_ITEMS_ONLY
  max_active_backlog_items: 1
  choose_from_enabled_items_by: HIGHEST_PRIORITY_ELIGIBLE_ITEM
  require_three_level_ssot_gate: true
  require_statement_of_work_gate: true
  require_common_dependency_gate: true
  require_item_specific_quality_gate: true
  require_item_quality_gate_approved_by_user: true
  eligibility_order:
    - run_enabled
    - QG-SSOT-001
    - QG-SOW-001
    - QG-DEP-001
    - item_specific_quality_gate
    - work_unit_dependencies

execution_engine:
  owner: AUTOMATION_TOOL
  architecture: architecture/self-reliant-e2e-execution.md
  self_reliant_governance: governance/self-reliant-execution.yaml
  backend: LOCAL_PROCESS_POOL
  max_parallel_workers: 10
  github_role: VERSION_CONTROL_AND_DURABLE_PERSISTENCE_ONLY
  github_actions_required: false
  external_worker_service_required: false
  source_repository: vvekselva/CylinderManagement
  control_repository: vvekselva/CylindnderManagementDependcies
  source_provider_governance: governance/source-provider.yaml
  source_layout: repository/source-layout.yaml
  default_source_provider: ORCHESTRATOR_STAGED_SNAPSHOT
  fallback_source_provider: LOCAL_GIT_CHECKOUT
  staged_executor: automation/staged-lane-executor-v3.py
  staged_worker: automation/staged-lane-worker-v3.py

invocation_utilization_contract:
  mode: BACKLOG_DRAIN_WINDOW
  scheduler_trigger_starts: ONE_ORCHESTRATOR_INVOCATION
  scheduler_trigger_is_not: ONE_WORKER_BATCH
  singleton_invocation_required: true
  target_invocation_window_minutes: 45
  minimum_productive_window_minutes: 30
  hard_stop_window_minutes: 45
  early_exit_before_minimum_allowed_only_when: ELIGIBLE_RUNNABLE_BACKLOG_TASK_COUNT_ZERO
  normal_exit_conditions:
    - ELIGIBLE_RUNNABLE_BACKLOG_TASK_COUNT_ZERO
    - INVOCATION_HARD_STOP_WINDOW_REACHED
  batch_loop:
    enabled: true
    replan_after_every_validated_checkpoint: true
    refill_worker_pool_from_backlog: true
    max_workers_per_generation: 10
    continue_generations_while_time_remains_and_work_exists: true
    one_generation_success_does_not_close_invocation: true
  window_expiry:
    behavior: CHECKPOINT_SYNC_AND_EXIT_WINDOW_EXPIRED
    remaining_backlog_stays_open: true
    next_scheduler_invocation_resumes_idempotently: true

production_source_contract:
  gate: QG-SOURCE-001
  fail_closed: true
  staged_snapshot:
    owner: PRIMARY_ORCHESTRATOR
    repository: vvekselva/CylinderManagement
    baseline: MUST_MATCH_SELECTED_BACKLOG_BASELINE
    manifest_required: true
    every_materialized_file_requires_git_blob_sha: true
    every_worker_verifies_file_before_read: true
    workers_access_github_directly: false
    source_request_types: [missing_source_requests, missing_binding_requests]
    max_staging_iterations: 8
    repeated_identical_request_set: SOURCE_RESOLUTION_STALLED
    maximum_iterations_reached: SOURCE_RESOLUTION_LIMIT_REACHED
  binding_validation:
    naming_may_generate_candidate_only: true
    implementation_source_must_prove_declared_interface: true
    generic_signature_must_match_when_present: true
    qualifier_or_default_bean_identity_must_match_when_present: true
  local_git_fallback:
    frozen_commit_must_exist_locally: true
    active_checkout_is_not_switched: true
    executor_uses_detached_worktree: true
  common_preflight:
    - selected backlog item and Work Unit are eligible
    - approved dispatch exists and contains only READY safe-independent tasks
    - duplicate lane and task IDs are rejected
    - required source/SSOT inputs are available
    - zero leftover individual lane logs before fire

bl001_traceability_contract:
  workflow: workflows/WF-002-incremental-traceability-matrix.yaml
  matrix_artifact: traceability/controller-traceability.md
  unresolved_artifact: traceability/unresolved-traceability.md
  progress_artifact: traceability/matrix-progress.yaml
  structured_matrix: traceability/explorer/traceability-matrix.json
  row_key: HTTP_METHOD_PLUS_PATH
  worker_direct_matrix_write_allowed: false
  raw_worker_candidate_is_matrix_truth: false
  update_trigger: EACH_PRIMARY_ORCHESTRATOR_ACCEPTED_ENDPOINT_TRACE
  finalization_owner: WU-BL001-002
  downstream_validation_owner: WU-BL001-003
  baseline_registration_owner: WU-BL001-004
  final_state_required_for_bl002: FINAL_VALIDATED
  rule: >-
    BL-001 continues incremental source-proved tracing and reconciliation. BL-002 must not consume raw counters or worker
    candidates; it consumes only the final validated canonical matrix after BL-001 is VERIFIED or CLOSED.

bl002_story_usecase_contract:
  workflow: workflows/WF-003-controller-story-usecase.yaml
  dependency: BL-001
  dependency_rule: ALL_VERIFIED_OR_CLOSED
  structured_matrix: traceability/explorer/traceability-matrix.json
  story_schema: stories/story-schema.yaml
  story_register: stories/story-register.yaml
  story_template: stories/story-template.md
  usecase_schema: usecases/usecase-schema.yaml
  usecase_register: usecases/usecase-register.yaml
  test_scenario_schema: usecases/usecase-test-scenario-schema.yaml
  test_scenarios: usecases/usecase-test-scenarios.yaml
  cross_traceability: traceability/controller-story-usecase-map.yaml
  story_generation_parallelism: 10
  usecase_generation_parallelism: 10
  story_user_approval_required: true
  usecase_user_approval_required: true
  auto_approval_forbidden: true
  source_change_invalidates_affected_approval: true
  narrative_required_content:
    - inputs
    - validations
    - main flow
    - ordered component flow
    - data reads and writes
    - side effects/state changes
    - alternate/error flows
    - output/postconditions
    - evidence
    - downstream test assertions
  no_invention_rule: >-
    Human-readable wording may simplify source behaviour but must never invent a validation, business rule, persistence
    operation, side effect, actor or expected outcome. Unproved business meaning is NEEDS_CLARIFICATION.
  downstream:
    BL-003:
      consumes: APPROVED_STORY_ASSERTIONS_ONLY
    BL-004:
      consumes: APPROVED_FOR_TESTING_USECASES_AND_SCENARIOS_ONLY
      owns_usecase_test_execution: true

execution_recovery_contract:
  execution_journal_required: true
  dispatch_fingerprint_basis: SELECTED_BACKLOG_BASELINE_PLUS_ORDERED_APPROVED_TASKS
  same_fingerprint_pending_sync: RETRY_SYNC_ONLY_NO_WORKER_RESTART
  same_fingerprint_closed_waiting_validation: VALIDATE_EXISTING_EVIDENCE_NO_WORKER_RESTART
  interrupted_running_without_live_workers: RECOVER_REJECT_PARTIAL_AND_CLEAN_BOUNDARY
  changed_fingerprint: START_NEW_EXECUTION_GENERATION
  already_closed_synced: NOOP_THEN_REPLAN_INVOCATION
  github_sync_failure: PRESERVE_VALIDATED_RESULT_AS_PENDING_SYNC_AND_RETRY_SYNC_ONLY

