scheduled_run_rules:
  - read backlog/backlog.yaml and this run-config first on every scheduler invocation
  - acquire a singleton invocation lease; never overlap two Cylinder coordinator invocations
  - select the highest-priority eligible run-enabled Backlog Item; do not hard-code BL-001
  - enforce QG-SSOT-001 and QG-SOW-001 before PLAN or REPLAN
  - enforce QG-DEP-001 before execution; BL-002 must wait until BL-001 is VERIFIED or CLOSED
  - apply item-specific execution logic only after selection
  - for BL-001 continue source checking, canonical matrix projection, reconciliation and final validation
  - for BL-002 import only the FINAL_VALIDATED BL-001 matrix and generate evidence-backed Story candidates
  - BL-002 Stories may be technically validated by the Orchestrator but never auto-approved
  - stop BL-002 at READY_FOR_USER_REVIEW when Story approval is required; persist exact Story IDs/fingerprints for review
  - after approved Stories exist, build candidate Use Cases without guessing business grouping
  - stop at Use Case user approval; only APPROVED_FOR_TESTING Use Cases may produce authoritative test scenarios
  - persist Matrix -> Story -> Use Case -> Test Scenario traceability continuously
  - BL-003 unit testing may later consume only APPROVED Story assertions
  - BL-004 integration testing may later consume only APPROVED_FOR_TESTING Use Cases/scenarios and owns Use Case test execution
  - inspect execution journal before firing each worker generation
  - retry PENDING_SYNC synchronization only without worker restart
  - validate closed evidence without rerunning workers
  - after every validated/synchronized generation re-read backlog/runtime and reselect eligible work
  - refill up to 10 safe-independent lanes while invocation time remains and work exists
  - do not terminate merely because one worker generation completed
  - early termination before 30 minutes is allowed only when eligible runnable work is zero or the selected item is waiting for an explicit user decision
  - at the 45-minute hard stop checkpoint, synchronize durable state and exit WINDOW_EXPIRED
  - enforce zero transient lane logs at worker-generation and invocation boundaries
  - synchronize only validated durable runtime/log/evidence/Story/Use Case/matrix changes back to GitHub
  - never mark any Backlog Item CLOSED without required explicit user acceptance
