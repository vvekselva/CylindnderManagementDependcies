version: 16
purpose: >-
  Govern backlog-driven CylinderManagement production execution. BL-001, BL-002 and BL-008 may run as coordinated
  workstreams when independently eligible. Shared worker capacity is dynamic; shared SSOT writes remain serialized,
  database mutation under BL-008 is always serialized one requirement at a time, and separate production invocations
  may overlap safely when they claim different work.

selection:
  mode: ENABLED_ELIGIBLE_BACKLOG_ITEMS_WITH_SAFE_PARALLELISM
  max_active_backlog_items: 3
  choose_from_enabled_items_by: HIGHEST_PRIORITY_ELIGIBLE_ITEMS
  require_three_level_ssot_gate: true
  require_statement_of_work_gate: true
  require_common_dependency_gate: true
  require_item_specific_quality_gate: true
  require_item_quality_gate_approved_by_user: true
  eligibility_order: [run_enabled, QG-SSOT-001, QG-SOW-001, QG-DEP-001, item_specific_quality_gate, work_unit_dependencies]
  coordinated_streams: [BL-001, BL-002, BL-008]
  rules:
    BL-001_BL-002:
      allowed: true
      BL-002_incremental_input: ACCEPTED_MATERIALIZED_NON_STALE_CANONICAL_BL001_ROWS_ONLY
      forbidden_BL-002_input: [PENDING_ATOMIC_PROJECTION_ROWS, RAW_WORKER_EVIDENCE, UNACCEPTED_CANDIDATES, STALE_FINGERPRINTS]
    BL-008:
      allowed_in_parallel_with: [BL-001, BL-002]
      read_only_discovery_may_parallelize: true
      database_mutation_serialized: true
      database_requirement_parallelism: 1
      neon_environment_role: SEPARATE_TEST_ENVIRONMENT_NOT_DIRECT_PRODUCTION
      neon_branch: main
      neon_branch_creation_forbidden: true

execution_engine:
  owner: AUTOMATION_TOOL
  architecture: architecture/self-reliant-e2e-execution.md
  self_reliant_governance: governance/self-reliant-execution.yaml
  invocation_concurrency_governance: governance/invocation-concurrency.yaml
  backend: LOCAL_PROCESS_POOL
  max_parallel_workers_per_invocation: 10
  worker_pool_allocation: EVENT_DRIVEN_DYNAMIC_REFILL
  starvation_forbidden: true
  shared_ssot_single_writer: true
  github_role: START_SNAPSHOT_AND_BATCHED_DURABLE_PERSISTENCE_ONLY
  github_actions_required: false
  external_worker_service_required: false
  source_repository: vvekselva/CylinderManagement
  control_repository: vvekselva/CylindnderManagementDependcies
  source_provider_governance: governance/source-provider.yaml
  execution_source_mode: governance/execution-source-mode.yaml
  source_layout: repository/source-layout.yaml
  default_source_provider: INVOCATION_START_LOCAL_OR_STAGED_SNAPSHOT
  fallback_source_provider: LOCAL_GIT_CHECKOUT
  staged_executor: automation/staged-lane-executor-v3.py
  staged_worker: automation/staged-lane-worker-v3.py
  executor_completion_signal: EXECUTOR_COMPLETED_REPLAN_REQUIRED
  executor_completion_return_owner: PRIMARY_ORCHESTRATOR

repository_snapshot_contract:
  config: governance/execution-source-mode.yaml
  fetch_repository_tree_once_at_invocation_start: true
  repository_tree_reuse_scope: SINGLE_INVOCATION
  independent_snapshot_per_overlapping_invocation: true
  git_changes_expected_during_execution: false
  external_commits_expected_through: 2026-08-30T23:59:59+05:30
  runtime_reads_after_start: LOCAL_OR_STAGED_SNAPSHOT_ONLY
  workers_may_fetch_repository_tree: false
  executor_may_fetch_repository_tree: false
  orchestrator_may_refetch_tree_before_replan: false
  orchestrator_may_refetch_tree_after_executor_completion: false
  remote_polling_when_change_flag_false: false
  orchestrator_generated_commit_behavior: UPDATE_OWN_LOCAL_CONTROL_SNAPSHOT_WITHOUT_TREE_REFETCH
  change_flag_true_behavior: REFRESH_ONLY_ON_EXPLICIT_CHANGE_SIGNAL

invocation_concurrency_contract:
  config: governance/invocation-concurrency.yaml
  singleton_invocation_required: false
  overlapping_invocations_allowed: true
  max_concurrent_invocations: 2
  each_invocation_has_unique_id: true
  each_invocation_has_independent_workspace: true
  each_invocation_has_independent_source_snapshot: true
  work_claim_required_before_dispatch: true
  global_work_claim_scope: BACKLOG_ITEM_PLUS_WORK_UNIT_PLUS_TASK_ID
  duplicate_work_claim_action: SELECT_DIFFERENT_ELIGIBLE_WORK
  running_invocation_must_not_be_cancelled_by_new_trigger: true
  new_trigger_when_capacity_available: START_PARALLEL_INVOCATION
  new_trigger_when_concurrency_limit_reached: NOOP_CONCURRENCY_LIMIT_WITH_EVIDENCE
  shared_ssot_write_lock_capacity: 1
  bl008_database_write_lock_capacity: 1

invocation_utilization_contract:
  mode: THIRTY_MINUTE_PRODUCTIVE_WINDOW_WITH_LONG_TASK_DRAIN
  executor_liveness:
    live_only_while_assigned_executor_work_remains: true
    no_idle_keepalive: true
    on_assigned_work_complete: EMIT_EXECUTOR_COMPLETED_REPLAN_REQUIRED_AND_EXIT
    on_assigned_work_failed_or_blocked: EMIT_EXECUTOR_COMPLETED_REPLAN_REQUIRED_AND_EXIT
  orchestrator_liveness:
    continue_assigning_while_productive_window_open_and_eligible_work_exists: true
    on_executor_completion: VALIDATE_RESULT_RELEASE_SLOT_REPLAN_AND_ASSIGN_IMMEDIATELY
    no_dependency_on_executor_process_liveness: true
    no_wait_for_other_executors_before_refill: true
    target_productive_window_minutes: 30
    at_target_window:
      start_new_executor_work: false
      cancel_running_executor_work: false
      wait_for_active_long_running_tasks_to_complete: true
      begin_accumulation_only_after_active_tasks_complete: true
      invocation_may_exceed_30_minutes_for_running_long_tasks: true
    early_stop_when:
      - NO_ELIGIBLE_OR_RECOVERABLE_UNCLAIMED_WORK
      - FAIL_CLOSED_GATE_REQUIRES_EXTERNAL_STATE_CHANGE_AND_NO_OTHER_UNCLAIMED_WORK_EXISTS
    wall_clock_timeout_for_healthy_long_running_task: NONE
    stale_task_recovery_uses_heartbeat_not_elapsed_runtime: true
  assignment_loop:
    enabled: true
    model: EVENT_DRIVEN_PER_EXECUTOR_COMPLETION
    executor_completion_signal_required: EXECUTOR_COMPLETED_REPLAN_REQUIRED
    replan_after_every_executor_completion: true
    validate_completed_executor_only: true
    wait_for_all_workers_before_reassignment: false
    generation_barrier_for_refill: false
    release_and_refill_freed_slot_immediately: true
    preserve_other_running_executors: true
    shared_control_writes_remain_serialized: true
    github_persistence_is_not_required_before_reassignment: true
    refill_worker_pool_from_backlog: true
    max_concurrent_executors_per_invocation: 10
    continue_assigning_while_productive_window_open: true
  accumulation:
    begin_when: PRODUCTIVE_WINDOW_CLOSED_AND_ALL_TASKS_STARTED_BY_THIS_INVOCATION_REACHED_TERMINAL_EXECUTOR_STATE
    wait_for_other_overlapping_invocations: false
    aggregate_only_this_invocations_results: true
    validate_and_merge_shared_ssot_under_single_writer_lock: true
    clean_this_invocations_transient_lane_logs_to_zero: true
    batch_git_checkpoint_after_validated_merge: true

production_source_contract:
  gate: QG-SOURCE-001
  fail_closed: true
  staged_snapshot:
    owner: PRIMARY_ORCHESTRATOR
    repository: vvekselva/CylinderManagement
    baseline: MUST_MATCH_SELECTED_BACKLOG_BASELINE
    repository_tree_captured_once_at_invocation_start: true
    manifest_required: true
    every_materialized_file_requires_git_blob_sha: true
    every_worker_verifies_file_before_read: true
    workers_access_github_directly: false
    executor_accesses_github_directly: false
    orchestrator_runtime_source_access_after_start: LOCAL_OR_STAGED_ONLY
  local_git_fallback:
    frozen_commit_must_exist_locally: true
    active_checkout_is_not_switched: true
    executor_uses_detached_worktree: true
  common_preflight:
    - load governance/invocation-concurrency.yaml
    - register unique invocation before claiming work
    - capture one repository tree snapshot for this invocation
    - load governance/execution-source-mode.yaml
    - selected backlog items and Work Units are eligible
    - required source and SSOT inputs are available
    - duplicate lane and task IDs are rejected inside an invocation
    - globally claimed work is excluded from dispatch
    - this invocation starts with zero leftover individual lane logs in its workspace

bl001_traceability_contract:
  workflow: workflows/WF-002-incremental-traceability-matrix.yaml
  matrix_artifact: traceability/controller-traceability.md
  unresolved_artifact: traceability/unresolved-traceability.md
  progress_artifact: traceability/matrix-progress.yaml
  structured_matrix: traceability/explorer/traceability-matrix.json
  row_key: HTTP_METHOD_PLUS_PATH
  final_unique_row_requirement: 134
  worker_direct_matrix_write_allowed: false
  raw_worker_candidate_is_matrix_truth: false

bl002_story_usecase_contract:
  workflow: workflows/WF-003-controller-story-usecase.yaml
  dependency: BL-001
  dependency_rule: INCREMENTAL_ACCEPTED_CANONICAL_ROWS
  release_classification: traceability/release-classification.yaml
  release_1_items: 88
  release_2_items: 46
  execution_order: RELEASE_1_BEFORE_RELEASE_2
  accepted_row_requirement: PRIMARY_ORCHESTRATOR_ACCEPTED_MATERIALIZED_NON_STALE
  forbidden_inputs: [PENDING_ATOMIC_PROJECTION_ROWS, RAW_WORKER_EVIDENCE, UNACCEPTED_CANDIDATES, STALE_FINGERPRINTS]
  story_user_approval_required: true
  usecase_user_approval_required: true
  auto_approval_forbidden: true
  field_level_story_required: true
  display_mapping_chain: PAGE_FIELD_OR_COMPONENT_TO_MODEL_DTO_TO_CONTROLLER_TO_SERVICE_TO_DAO_REPOSITORY_TO_ENTITY_VIEW_FIELD_TO_DB_TABLE_VIEW_COLUMN
  static_ui_disposition: STATIC_UI_NO_DATABASE_MAPPING
  input_field_attributes: [datatype, required_or_optional, normalization_or_default, validation, accepted_values_or_rules, invalid_behavior, persistence_destination, state_or_side_effect]
  no_invention_rule: UNPROVED_MEANING_IS_NEEDS_CLARIFICATION

bl008_database_migration_contract:
  workflow: workflows/WF-004-database-ownership-migration.yaml
  dependency_ledger: database-dependency-neon.md
  source_repository: vvekselva/CylinderManagement
  flyway_path: cylinder.datascripts/src/main/resources/db/migration/
  ownership_source_roots: [NewOwnerShipModelv3/, cmas.database.operations/]
  target_project: neon-for-cylinder-db
  target_project_id: holy-glitter-02245694
  neon_branch: main
  database: VERIFY_FROM_NEON_BEFORE_WRITE
  environment_role: SEPARATE_TEST_ENVIRONMENT_NOT_DIRECT_PRODUCTION
  migration_mechanism: FLYWAY_ONLY
  manual_sql_substitution: FORBIDDEN
  neon_branch_creation: FORBIDDEN
  database_requirement_parallelism: 1
  global_database_write_lock_across_overlapping_invocations: true
  selected_requirement_rule: EXACTLY_ONE_ACTIVE_REQUIREMENT_IN_AUTHORITATIVE_ORDER
  database_mutation_owner: PRIMARY_ORCHESTRATOR_SERIAL_STAGE
  ownership_types: [COMPANY_OWNED, SUPPLIER_OWNED, CUSTOMER_OWNED]
  require_pre_post_integrity_checks: true
  require_ledger_sync_before_next_requirement: true
  failure_rule: FAIL_CLOSED_ON_CURRENT_REQUIREMENT_DO_NOT_ADVANCE

execution_recovery_contract:
  execution_journal_required: true
  executor_completion_always_returns_control_to_orchestrator: true
  executor_completion_signal: EXECUTOR_COMPLETED_REPLAN_REQUIRED
  immediate_refill_after_each_executor_completion: true
  do_not_wait_for_peer_executors: true
  work_claim_prevents_duplicate_execution_across_invocations: true
  stale_claim_recovery_requires_missing_or_stale_owner_heartbeat: true
  same_fingerprint_pending_sync: RETRY_SYNC_ONLY_NO_WORKER_RESTART
  same_fingerprint_closed_waiting_validation: VALIDATE_EXISTING_EVIDENCE_NO_WORKER_RESTART
  interrupted_running_without_live_workers: RECOVER_REJECT_PARTIAL_AND_CLEAN_BOUNDARY
  changed_fingerprint: START_NEW_EXECUTION_GENERATION
  already_closed_synced: NOOP_THEN_REPLAN_INVOCATION
  github_sync_failure: PRESERVE_VALIDATED_RESULT_AS_PENDING_SYNC_AND_RETRY_SYNC_ONLY
  database_mutation_failure: FAIL_CLOSED_ON_CURRENT_REQUIREMENT_NO_MANUAL_PATCH_NO_ADVANCE

backlog_items:
  BL-001: {name: Controller Traceability, run_enabled: true, item_definition: backlog/items/BL-001-controller-traceability.yaml, statement_of_work: backlog/sow/BL-001-controller-traceability.yaml, statement_of_work_configured: true, runtime: backlog/runtime/BL-001/, completion_path: backlog/paths/BL-001-traceability.yaml, quality_gate: backlog/gates/BL-001-traceability.yaml, quality_gate_configured: true, quality_gate_approved: true}
