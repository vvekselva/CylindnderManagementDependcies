scheduled_run_rules:
  - read this file first
  - ignore Backlog Items with run_enabled false
  - initialize/repair only the selected item's SSOT files when Level 1, Level 2 or Level 3 is incomplete
  - apply QG-SOW-001 as the mandatory Statement of Work component of Level 2
  - apply QG-SSOT-001 before PLAN or REPLAN
  - refuse PLAN or REPLAN unless SSOT-L1, SSOT-L2 and SSOT-L3 are all COMPLETE
  - refuse planning when item_definition, statement_of_work, runtime, completion_path or quality_gate references required by Level 1/2 are null or unresolved
  - require all Level 3 runtime files listed in backlog/runtime-contract.yaml before planning
  - apply QG-DEP-001 after the three-level SSOT gate passes
  - refuse execution when item-specific quality-gate config is missing or unapproved
  - load the selected item's Level 2 definition and Statement of Work before its Completion Path
  - perform Orchestrator analysis only inside the initialized Level 3 runtime area
  - create/change the Execution Plan only after QG-SSOT-001 PASS and required analysis is complete
  - generate Worker Inputs only from approved Work Units and within SOW scope
  - consume only CLOSED Worker results that satisfy their result contract
  - evaluate all automatic item-specific quality gates before VERIFIED
  - wait for explicit user approval when a USER-owned acceptance gate is reached
  - never mark CLOSED without the required user acceptance
