scheduled_run_rules:
  - read this file first
  - ignore Backlog Items with run_enabled false
  - enforce QG-SOW-001 and QG-SSOT-001 before PLAN or REPLAN
  - apply QG-DEP-001 after the SSOT gate passes
  - inspect execution journal before deciding whether to fire new workers
  - if the same dispatch is PENDING_SYNC retry synchronization only
  - if closed evidence awaits validation validate it without rerunning workers
  - create Worker Inputs only from approved in-scope Work Units
  - before worker fire enforce QG-SOURCE-001 using the highest-priority available source provider
  - prefer ORCHESTRATOR_STAGED_SNAPSHOT and do not require a local source checkout when it is available
  - resolve source requests using repository/source-layout.yaml at the exact frozen commit
  - never give local workers GitHub credentials
  - validate interface bindings from source before following implementations
  - repeat bounded source staging while request sets change and verified source closure advances
  - fail closed on source-resolution stall or iteration limit
  - never auto-accept endpoint COMPLETE from worker evidence
  - enforce zero transient lane logs at invocation boundaries
  - evaluate QG-LANE-001 using measured natural SERVICE overlap; never add artificial delay merely to pass the gate
  - synchronize only validated durable runtime/log/evidence changes back to GitHub
  - on GitHub sync failure preserve PENDING_SYNC and do not rerun the same worker batch
  - never mark CLOSED without required explicit user acceptance
