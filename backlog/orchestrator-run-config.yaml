version: 6
purpose: >-
  Tell the Orchestrator which Backlog Items may run and define the production execution-input contract.
  GitHub is VCS/persistence; the Automation Tool owns source staging and execution.

selection:
  mode: ENABLED_BACKLOG_ITEMS_ONLY
  max_active_backlog_items: 1
  choose_from_enabled_items_by: HIGHEST_PRIORITY_ELIGIBLE_ITEM
  require_three_level_ssot_gate: true
  require_statement_of_work_gate: true
  require_common_dependency_gate: true
  require_item_specific_quality_gate: true
  require_item_quality_gate_approved_by_user: true

execution_engine:
  owner: AUTOMATION_TOOL
  backend: LOCAL_PROCESS_POOL
  max_parallel_workers: 10
  github_role: VERSION_CONTROL_AND_DURABLE_PERSISTENCE_ONLY
  github_actions_required: false
  external_worker_service_required: false
  source_repository: vvekselva/CylinderManagement
  control_repository: vvekselva/CylindnderManagementDependcies
  source_provider_governance: governance/source-provider.yaml
  default_source_provider: ORCHESTRATOR_STAGED_SNAPSHOT
  fallback_source_provider: LOCAL_GIT_CHECKOUT

production_source_contract:
  gate: QG-SOURCE-001
  fail_closed: true
  local_git_checkout_required: false
  staged_snapshot:
    owner: PRIMARY_ORCHESTRATOR
    source: connected GitHub control-plane interface
    repository: vvekselva/CylinderManagement
    baseline: MUST_MATCH_DISPATCH_SOURCE_BASELINE
    manifest_required: true
    every_materialized_file_requires_git_blob_sha: true
    every_worker_verifies_file_before_read: true
    tamper_or_manifest_mismatch: BLOCK_BEFORE_SERVICE
    missing_component_behavior: RETURN_EXPLICIT_REFERENCE_TO_ORCHESTRATOR_FOR_RESTAGING
    workers_access_github_directly: false
  local_git_fallback:
    frozen_commit_must_exist_locally: true
    active_checkout_is_not_switched: true
    executor_uses_detached_worktree: true
  common_preflight:
    - Python_3_available_on_execution_host
    - approved executor worker and dispatch inputs available
    - zero_leftover_individual_lane_logs_before_fire
  failure_behavior: >-
    Start zero affected lanes when source integrity cannot be proved. Preserve BL-001 PARTIAL, record the exact
    source-provider failure, and never substitute naming inference or an unpinned source file.

backlog_items:
  BL-001:
    name: Controller Traceability
    run_enabled: true
    item_definition: backlog/items/BL-001-controller-traceability.yaml
    statement_of_work: backlog/sow/BL-001-controller-traceability.yaml
    statement_of_work_configured: true
    runtime: backlog/runtime/BL-001/
    completion_path: backlog/paths/BL-001-traceability.yaml
    quality_gate: backlog/gates/BL-001-traceability.yaml
    quality_gate_configured: true
    quality_gate_approved: true
  BL-002: {name: Unit Test Completion, run_enabled: false, item_definition: null, statement_of_work: null, statement_of_work_configured: false, runtime: null, completion_path: backlog/paths/BL-002-unit-test.yaml, quality_gate: null, quality_gate_configured: false, quality_gate_approved: false}
