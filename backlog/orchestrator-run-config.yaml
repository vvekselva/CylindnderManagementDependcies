scheduled_run_rules:
  - read this file first
  - ignore Backlog Items with run_enabled false
  - enforce QG-SOW-001 and QG-SSOT-001 before PLAN/REPLAN
  - apply QG-DEP-001 after the SSOT gate passes
  - create Worker Inputs only from approved in-scope Work Units
  - before worker fire enforce QG-SOURCE-001 using the highest-priority available source provider
  - prefer ORCHESTRATOR_STAGED_SNAPSHOT; do not require a local source checkout when this provider is available
  - stage exact files only at the frozen commit and record Git blob SHA in the snapshot manifest
  - never give local workers direct GitHub credentials
  - when workers report missing_component_references, stage those exact components from the same frozen commit and re-run affected evidence collection as needed
  - never auto-accept endpoint COMPLETE from partial staged source closure
  - enforce zero transient lane logs at invocation boundaries
  - evaluate QG-LANE-001 using measured SERVICE overlap
  - synchronize only accepted durable runtime/log/evidence changes back to GitHub
  - never mark CLOSED without required explicit user acceptance
