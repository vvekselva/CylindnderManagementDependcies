scheduled_run_rules:
  - read backlog/backlog.yaml, this run-config, governance/invocation-concurrency.yaml, and governance/execution-source-mode.yaml first
  - register a unique invocation; do not acquire a singleton lease
  - allow a new trigger to run in parallel with an existing invocation when max_concurrent_invocations has capacity
  - atomically claim work before dispatch and never assign work already claimed by another live invocation
  - capture repository tree once at each invocation start and reuse that invocations own snapshot
  - when git_changes_expected_during_execution is false, use only that invocation-start local/staged snapshot for runtime source reads
  - do not poll or refetch GitHub tree after worker completion, before replan, or before reassignment
  - orchestrator-authored commits update only the originating invocations local control snapshot and do not trigger whole-tree rediscovery
  - execute BL-001, BL-002 and BL-008 when independently eligible up to max_active_backlog_items
  - enforce QG-SSOT-001, QG-SOW-001, QG-DEP-001 and item-specific gates per stream
  - share up to 10 workers per invocation dynamically without starvation
  - an executor lives only while its currently assigned executor work remains
  - executor completion must emit EXECUTOR_COMPLETED_REPLAN_REQUIRED and return control to its Primary Orchestrator
  - on any single executor completion, validate that executor result, release that slot, replan, and immediately assign the next eligible unclaimed work to that slot
  - never wait for other still-running executors before refilling a completed executor slot
  - keep assigning productive work for about 30 minutes while eligible unclaimed work exists
  - at the 30-minute target stop starting new executor work, allow already-running long tasks to finish, then perform accumulation and cleanup
  - overlapping invocations do not wait for one another before their own accumulation; shared SSOT merge is serialized
  - BL-002 executes Release 1 field-level Story rework before Release 2
  - BL-008 uses Neon main only and creates no Neon branches
  - BL-008 selects and completes exactly one database requirement before selecting the next
  - BL-008 database writes use a global lock of capacity 1 across all overlapping invocations
  - retry PENDING_SYNC without restarting completed work
  - leave zero transient lane logs for the finishing invocation before its end
  - synchronize only validated durable state using batched checkpoint persistence
  - never mark any Backlog Item CLOSED without explicit user acceptance
