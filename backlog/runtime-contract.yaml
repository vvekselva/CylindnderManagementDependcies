runtime_ssot_contract:
  version: 6
  level: SSOT-L3
  planning_gate: QG-SSOT-001

  required_files:
    analysis.yaml: {purpose: current analysis proved facts progress and next step, may_exist_before_analysis_as: INITIALIZED}
    execution-plan.yaml: {purpose: current approved execution plan/work units, may_exist_before_first_plan_as: INITIALIZED_EMPTY}
    work-unit-status.yaml: {purpose: authoritative work-unit lifecycle states}
    gate-status.yaml: {purpose: authoritative current quality/pre-execution gate states including QG-SOURCE-001}
    blockers.yaml: {purpose: explicit blockers evidence gaps and source-staging gaps}
    decisions.yaml: {purpose: orchestrator/user decisions affecting execution}
    worker-input-register.yaml: {purpose: worker-input issuance/consumption state}
    lane-status.yaml: {purpose: authoritative live lane-to-task assignment run heartbeat blocker and release state, may_exist_before_execution_as: INITIALIZED_ALL_IDLE}
    lane-dispatch.yaml: {purpose: authoritative queue of safe independent tasks and selected source-provider policy, may_exist_before_execution_as: INITIALIZED_EMPTY_QUEUE}
    local-execution.yaml: {purpose: authoritative process-pool execution source-provider state measured concurrency aggregate evidence and closure state}
    execution-statistics.yaml: {purpose: authoritative run-over-run operational statistics including trace coverage real lane concurrency throughput and stale/no-progress cycles}
    result.yaml: {purpose: final/current backlog result and closure state}

  source_provider_rules:
    governance: governance/source-provider.yaml
    gate: QG-SOURCE-001
    preferred_provider: ORCHESTRATOR_STAGED_SNAPSHOT
    fallback_provider: LOCAL_GIT_CHECKOUT
    local_checkout_is_not_mandatory: true
    staged_snapshot_rules:
      - manifest identifies repository and exact dispatch baseline
      - every materialized source file records exact Git blob SHA
      - worker recomputes blob SHA before reading each file
      - controller root integrity failure blocks SERVICE
      - missing downstream component references remain explicit and trigger Orchestrator restaging
      - partial source closure never auto-completes endpoint traces
    local_git_rules:
      - frozen commit must exist in local Git object database
      - detached temporary worktree is used without switching active checkout

  lane_status_rules:
    - exactly ten orchestration lane records must exist for LANE-01 through LANE-10
    - a non-IDLE lane identifies Work Unit task and current execution
    - WORKING state must be supported by process/lifecycle evidence
    - CLOSED execution releases all lanes unless a newer assignment exists
    - summary counts reconcile to exactly ten lanes

  lane_dispatch_rules:
    - lane-dispatch.yaml identifies backlog item work unit frozen source baseline backend source-provider policy and configured lane count
    - worker_backend is LOCAL_PROCESS_POOL
    - READY tasks identify task_id lane exact task task_description controller path and safe_independent=true
    - no lane appears more than once in one active batch and no more than ten tasks are concurrent
    - worker evidence never automatically makes an endpoint COMPLETE

  execution_rules:
    - before source-reading worker SERVICE QG-SOURCE-001 must pass for the task root
    - before fire transient logs/runs/*-LANE-*.md count is zero
    - staged mode uses automation/staged-lane-executor.py and automation/staged-lane-worker.py
    - local Git mode uses automation/local-lane-executor.py and automation/local-lane-worker.py
    - GitHub Actions or another external worker service is not required
    - QG-LANE-001 uses overlapping SERVICE intervals rather than lane IDs or process creation
    - every transient lane log is aggregated verified deleted and rescanned to zero before closure
    - final endpoint trace validation remains primary-Orchestrator owned

  execution_statistics_rules:
    - percentages declare formula and must not be presented as overall project completion unless formally weighted
    - peak_concurrent_lanes means peak overlapping SERVICE intervals
    - average_concurrent_lanes means aggregate SERVICE seconds divided by SERVICE batch wall-clock seconds
    - peak_capacity_utilization_percentage equals peak SERVICE concurrency / configured lane count * 100
    - source-provider state and source_closure_complete are reported separately from QG-LANE-001
    - QG-LANE-001 underutilization preserves correctly verified source evidence
    - TaskStatus.md is derived and never overrides Level-3 runtime

  consistency_rule: >-
    Level 3 files reconcile to the same Level 1 item and Level 2 definition. lane-dispatch, source-provider state,
    local-execution, lane-status, execution statistics and aggregate evidence must identify the same baseline and execution.

  failure_rule: >-
    Missing or inconsistent Level 3 files fail QG-SSOT-001. Source integrity failures fail QG-SOURCE-001 and block
    affected worker SERVICE without converting missing evidence into guessed traceability conclusions.
