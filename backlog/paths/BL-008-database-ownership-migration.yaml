completion_path:
  id: CP-BL-008-v1
  backlog_item: BL-008
  type: DATABASE_MIGRATION
  name: Ownership Model Database Migration Completion Path
  prerequisites:
    - QG-SSOT-001 PASS
    - QG-SOW-001 PASS
    - BL-008 item-specific gates configured and approved
  phases:
    - id: DISCOVER_AND_INVENTORY
      owner: ORCHESTRATOR
      actions:
        - verify target Neon project/production branch/database from database-dependency-neon.md
        - inventory exact Flyway migration files and checksums through V176
        - inspect ownership-model source roots and derive source-proved integrity checks
      gate: QG-DBMIG-001
    - id: ESTABLISH_RECOVERY_POINT
      owner: ORCHESTRATOR
      actions:
        - create or verify isolated migration validation branch from production
        - capture pre-migration schema/history/critical-row-count evidence
      gate: QG-DBMIG-002
    - id: VALIDATE_MIGRATIONS
      owner: ORCHESTRATOR
      actions:
        - run Flyway validate against validation branch
        - reject duplicate/out-of-order/checksum-invalid migration sets
      gate: QG-DBMIG-003
    - id: MIGRATE_VALIDATION_BRANCH
      owner: ORCHESTRATOR
      actions:
        - run Flyway migrate through V176
        - verify flyway_schema_history
        - validate schema/referential integrity/ownership rules/critical data
      gate: QG-DBMIG-004
    - id: PROMOTE_TO_PRODUCTION
      owner: ORCHESTRATOR
      actions:
        - reverify production target identity and pre-state
        - run the identical validated Flyway source through V176 on production
        - do not use ad-hoc SQL repair
      gate: QG-DBMIG-005
    - id: POST_PRODUCTION_VALIDATE
      owner: ORCHESTRATOR
      actions:
        - validate flyway_schema_history
        - validate ownership invariants
        - validate critical cylinder, state, custody, logistics and audit integrity
        - compare required pre/post counts and constraints
      gate: QG-DBMIG-006
    - id: RECORD_AND_VERIFY
      owner: ORCHESTRATOR
      actions:
        - update database-dependency-neon.md migration status and evidence
        - synchronize BL-008 runtime and logs
      gate: QG-DBMIG-007
    - id: CLOSE
      owner: ORCHESTRATOR
      actions:
        - move to VERIFIED only after all configured gates pass
        - wait for explicit user acceptance before CLOSED
  parallelism:
    max_parallel_work_units: 10
    safe_parallel_work:
      - migration source inventory/checksum verification
      - read-only ownership-model source analysis
      - independent post-migration integrity queries
    serialized_work:
      - validation-branch Flyway migrate
      - production Flyway migrate
      - shared database ledger updates
  completion_conditions:
    - V176 reached successfully under Flyway on validation and production targets
    - ownership and integrity gates pass
    - database-dependency-neon.md synchronized
    - explicit user acceptance obtained before CLOSED
