completion_path:
  id: CP-BL-002-v2
  backlog_item: BL-002
  type: UNIT_TEST
  name: Unit Test Completion Path

  purpose: >-
    Analyse and complete unit testing only for projects explicitly approved for the
    current BL-002 scope. Testing scope must come from repository/project-inventory.yaml;
    the Orchestrator must not infer test requirements from source structure or project names.

  prerequisites:
    - QG-SSOT-001 must PASS before PLAN or REPLAN
    - QG-SOW-001 must PASS
    - repository/project-inventory.yaml must exist
    - every top-level CylinderManagement project must have an explicit unit_test_scope classification
    - only UNIT_TEST_REQUIRED projects may enter the current BL-002 execution scope
    - NO_UNIT_TEST_REQUIRED projects must be excluded
    - UNIT_TEST_POSTPONED projects must be excluded from the current cycle and retained for future user authorization
    - UNIT_TEST_SCOPE_UNCLASSIFIED projects prevent Level 2 scope completion and therefore prevent planning

  current_scope_policy:
    source: repository/project-inventory.yaml
    no_unit_test_required:
      - Cylinder.management.dto
      - cylinder.management.dao
      - cylindermanagement.custommapper.service
      - cylindermanagement.security
      - framework
    unit_test_postponed:
      - cmas.database.operations
      - cylindermanagement.offlinemap
    unit_test_scope_unclassified:
      - NewOwnerShipModelv3
      - cylinder.datascripts
      - cylindermanagement.web
    current_scope_complete: false
    planning_allowed: false
    blocker: >-
      The unit-test status of NewOwnerShipModelv3, cylinder.datascripts and
      cylindermanagement.web has not yet been explicitly defined. BL-002 must remain
      non-plannable until those classifications are supplied and its Level 2 SOW and
      item-specific Quality Gate are complete.

  phases:
    - id: ANALYZE
      owner: ORCHESTRATOR
      actions:
        - establish the approved source baseline
        - read repository/project-inventory.yaml before inspecting test scope
        - include only projects classified UNIT_TEST_REQUIRED
        - exclude NO_UNIT_TEST_REQUIRED projects from required test coverage
        - exclude UNIT_TEST_POSTPONED projects from the current cycle without marking them complete
        - refuse to classify UNIT_TEST_SCOPE_UNCLASSIFIED projects by inference
        - inventory production classes/components within the approved UNIT_TEST_REQUIRED projects
        - inventory existing unit tests and test framework/tooling for those projects
        - identify missing, obsolete, failing or duplicate unit-test areas
        - identify dependencies that must be mocked/stubbed for isolated tests
      outputs:
        - backlog/runtime/BL-002/analysis.yaml
        - quality/unit-test/unit-test-inventory.md
      gate: every in-scope production unit is classified as COVERED, GAP, NOT_APPLICABLE or UNRESOLVED

    - id: PLAN
      owner: ORCHESTRATOR
      start_condition: QG-SSOT-001_PASS_AND_SCOPE_COMPLETE
      actions:
        - create one or more independent unit-test Work Units only from approved UNIT_TEST_REQUIRED scope
        - group Work Units so unrelated test files can run in parallel
        - define source/test paths, permissions, expected assertions and test command
        - generate Worker Input files for each approved Work Unit
      outputs:
        - backlog/runtime/BL-002/execution-plan.yaml
        - worker/inputs/WI-*.yaml
      gate: every mandatory GAP has an execution Work Unit or an explicit blocker

    - id: EXECUTE
      owner: ORCHESTRATOR
      worker_permissions:
        source_read: true
        source_write: true
        database_write: false
      actions:
        - schedule eligible Worker Inputs
        - execute test creation/update only on approved automation branches/paths
        - execute the declared unit-test commands
        - collect Worker result and test evidence
        - create follow-up Work Units only when analysis of a result proves they are required
      outputs:
        - worker/runs/WI-*.md
        - worker/results/WI-*.yaml
        - backlog/runtime/BL-002/work-unit-status.yaml

    - id: VALIDATE
      owner: ORCHESTRATOR
      checks:
        - every mandatory unit-test Work Unit has an accepted result
        - required unit tests exist for every UNIT_TEST_REQUIRED project in the current cycle
        - required unit tests execute successfully
        - NO_UNIT_TEST_REQUIRED projects are not counted as test gaps
        - UNIT_TEST_POSTPONED projects remain explicitly postponed and are not counted as completed testing
        - failing tests are not hidden
        - unresolved testability blockers are recorded in plain English
      outputs:
        - quality/unit-test/unit-test-results.md
        - quality/unit-test/unresolved-unit-tests.md
      gate: no mandatory current-cycle unit-test Work Unit remains FAILED or unprocessed

    - id: CLOSE
      owner: ORCHESTRATOR
      actions:
        - persist final results and evidence
        - close all required runs
        - mark BL-002 VERIFIED then CLOSED only after all configured gates and required user acceptance pass

  parallelism:
    max_parallel_work_units: 10
    rule: only independent test-file/component Work Units may run concurrently

  completion_conditions:
    - project unit-test scope is explicitly classified
    - unit-test inventory complete for current UNIT_TEST_REQUIRED scope
    - all mandatory current-cycle gaps processed
    - required current-cycle unit-test suite passes
    - postponed projects remain recorded as postponed
    - required outputs exist
    - all required runs closed
