completion_path:
  id: CP-BL-003-v1
  backlog_item: BL-003
  type: INTEGRATION_TEST
  name: Integration Test Completion Path

  purpose: >-
    Analyse integration boundaries and existing integration tests, plan missing scenarios,
    generate Worker Inputs, execute them with the required test infrastructure, and verify
    that every mandatory integration scenario has a passing or explicitly blocked result.

  phases:
    - id: ANALYZE
      owner: ORCHESTRATOR
      actions:
        - establish the approved source baseline
        - identify integration boundaries such as controller-service, service-repository, database and external adapters
        - inventory existing integration tests and test infrastructure
        - identify required data/setup dependencies
        - classify scenarios as COVERED, GAP, NOT_APPLICABLE or UNRESOLVED
      outputs:
        - backlog/runtime/BL-003/analysis.yaml
        - quality/integration-test/integration-test-inventory.md
      gate: every in-scope integration boundary/scenario is classified

    - id: PLAN
      owner: ORCHESTRATOR
      actions:
        - create Work Units for every mandatory integration-test GAP
        - define setup/teardown, fixtures, infrastructure and test command per Work Unit
        - declare whether Work Units may run in parallel without sharing unsafe state
        - generate Worker Input files
      outputs:
        - backlog/runtime/BL-003/execution-plan.yaml
        - worker/inputs/WI-*.yaml
      gate: every mandatory GAP has a Work Unit or explicit blocker

    - id: EXECUTE
      owner: ORCHESTRATOR
      actions:
        - schedule eligible Worker Inputs
        - execute integration test creation/update on approved automation branches
        - start/use only infrastructure explicitly defined by the Work Unit and governance
        - run the integration tests
        - consume Worker results and create follow-up Work Units only when evidence requires them
      outputs:
        - backlog/runtime/BL-003/work-unit-status.yaml
        - worker/runs/WI-*.md
        - worker/results/WI-*.yaml

    - id: VALIDATE
      owner: ORCHESTRATOR
      checks:
        - every mandatory scenario has an accepted result
        - required integration tests exist and execute
        - required setup/teardown is reproducible
        - failures are visible
        - infrastructure blockers are explicitly recorded
      outputs:
        - quality/integration-test/integration-test-results.md
        - quality/integration-test/unresolved-integration-tests.md
      gate: no mandatory integration-test scenario remains unprocessed

    - id: CLOSE
      owner: ORCHESTRATOR
      actions:
        - persist final evidence
        - close required runs
        - mark BL-003 VERIFIED then CLOSED

  parallelism:
    max_parallel_work_units: 10
    rule: parallel execution allowed only for scenarios without conflicting shared state/resources

  completion_conditions:
    - integration-test inventory complete
    - every mandatory scenario processed
    - required integration tests pass
    - required outputs exist
    - all required runs closed
