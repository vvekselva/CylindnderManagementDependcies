completion_path:
  id: CP-BL-002-v1
  backlog_item: BL-002
  type: CONTROLLER_STORY_AND_USECASE
  name: Controller Dependency Matrix to Human-Readable Stories Completion Path

  purpose: >-
    Convert the final validated BL-001 technical dependency matrix into human-readable, evidence-backed Stories,
    obtain Story approval, combine approved Stories into approved Use Cases, and derive traceable use-case test scenarios
    for downstream unit and integration testing.

  prerequisites:
    - QG-SSOT-001 must PASS before PLAN or REPLAN
    - QG-SOW-001 must PASS
    - QG-DEP-001 must PASS with BL-001 VERIFIED or CLOSED
    - BL-001 matrix must be FINAL_VALIDATED
    - traceability/explorer/traceability-matrix.json must reconcile with traceability/controller-traceability.md

  phases:
    - id: IMPORT_MATRIX
      owner: ORCHESTRATOR
      actions:
        - read the final validated structured BL-001 matrix
        - enumerate canonical HTTP method plus path keys
        - preserve every ordered and branching dependency chain
        - build Story generation queue keyed by matrix row
        - classify rows that are genuinely non-business terminal/display flows without inventing meaning
      outputs:
        - backlog/runtime/BL-002/analysis.yaml
        - stories/story-register.yaml
      gate: every canonical matrix row has exactly one Story queue/disposition record

    - id: GENERATE_STORIES
      owner: ORCHESTRATOR
      actions:
        - create one atomic Story candidate per approved endpoint flow or explicitly justified variant
        - describe trigger/actor when source or existing approved context proves it
        - describe request inputs and source locations
        - describe validations and invalid-value behaviour in execution order
        - describe service/mediator/repository calls in execution order
        - describe reads, writes, state transitions, audit/logistics effects and external calls
        - describe successful output and alternate/error paths
        - attach matrix row key and durable source/evidence references
        - mark ambiguous business meaning NEEDS_CLARIFICATION rather than guessing
      outputs:
        - stories/STORY-*.yaml
        - stories/STORY-*.md
      gate: every generated Story conforms to stories/story-schema.yaml

    - id: VALIDATE_STORIES
      owner: ORCHESTRATOR
      checks:
        - each technical assertion is supported by matrix/source evidence
        - no intermediate dependency hop was silently skipped
        - validation statements match actual source conditions
        - persistence/read statements match proved repositories/entities/tables/views/files/APIs
        - error/alternate paths are represented when proved
        - unsupported business interpretation is clearly separated from proved facts
        - Story register counts reconcile to Story artifacts
      outputs:
        - backlog/runtime/BL-002/work-unit-status.yaml
        - traceability/controller-story-usecase-map.yaml
      gate: technically validated Stories move to READY_FOR_USER_REVIEW only

    - id: STORY_USER_APPROVAL
      owner: USER
      actions:
        - review one Story or an explicitly presented batch of Stories
        - approve, reject, or request clarification/correction
        - persist approval decision with Story IDs and evidence version/fingerprint
      outputs:
        - stories/story-register.yaml
        - backlog/runtime/BL-002/decisions.yaml
      gate: only APPROVED Stories may be consumed by Use Case grouping or downstream tests

    - id: BUILD_USECASES
      owner: ORCHESTRATOR
      actions:
        - group one or more APPROVED Stories into candidate Use Cases using source/evidence-supported functional relationships
        - prefer existing approved use-case identifiers/names when present in source/project documentation
        - never infer a business use-case grouping solely from similar class names
        - record preconditions, trigger, main flow, alternate flows, postconditions and data effects
        - preserve all contributing Story IDs and matrix row keys
      outputs:
        - usecases/usecase-register.yaml
        - usecases/UC-*.yaml
        - usecases/UC-*.md
      gate: each candidate Use Case contains only APPROVED Stories and conforms to usecases/usecase-schema.yaml

    - id: USECASE_USER_APPROVAL
      owner: USER
      actions:
        - review candidate Use Cases
        - approve, reject, split, merge or request clarification
        - persist decision and current Use Case fingerprint
      outputs:
        - usecases/usecase-register.yaml
        - backlog/runtime/BL-002/decisions.yaml
      gate: only APPROVED_FOR_TESTING Use Cases may produce authoritative downstream test scenarios

    - id: DERIVE_TEST_SCENARIOS
      owner: ORCHESTRATOR
      actions:
        - create positive/happy-path scenarios from approved main flows
        - create validation-failure scenarios from proved validation branches
        - create alternate/error scenarios from approved alternate flows
        - create persistence/state-effect assertions from approved data effects
        - mark scenario level as UNIT_CANDIDATE, INTEGRATION_REQUIRED or BOTH
        - map each scenario to Story IDs, Use Case ID and matrix rows
      outputs:
        - usecases/usecase-test-scenarios.yaml
        - traceability/controller-story-usecase-map.yaml
      gate: every APPROVED_FOR_TESTING Use Case has complete scenario coverage for all proved branches or explicit NOT_APPLICABLE rationale

    - id: FINAL_VALIDATE
      owner: ORCHESTRATOR
      checks:
        - matrix row accounting is complete
        - approved Story accounting is complete
        - approved Use Case accounting is complete
        - scenario traceability has no orphan approved records
        - BL-003 unit-testing inputs reference only approved Story assertions
        - BL-004 integration-testing inputs reference only APPROVED_FOR_TESTING Use Cases/scenarios
        - QG-STORY-001 through QG-STORY-010 pass
      outputs:
        - backlog/runtime/BL-002/gate-status.yaml
        - backlog/runtime/BL-002/result.yaml
      gate: BL-002 may move to VERIFIED, but not CLOSED without final user acceptance

    - id: CLOSE
      owner: ORCHESTRATOR
      actions:
        - persist final Story/Use Case/scenario registers and traceability
        - close all required Work Units
        - wait for explicit user acceptance
        - mark BL-002 CLOSED only after acceptance

  parallelism:
    max_parallel_work_units: 10
    safe_parallel_work:
      - independent Story generation by distinct matrix row
      - independent Story technical validation
      - independent Use Case draft generation when Story sets do not overlap
    serialized_work:
      - shared Story register updates
      - shared Use Case register updates
      - cross-traceability map reconciliation
      - user approval application

  downstream_gate:
    BL-003_unit_test:
      requires: APPROVED_STORY_INPUTS_ONLY
    BL-004_integration_test:
      requires: APPROVED_FOR_TESTING_USECASES_ONLY

  completion_conditions:
    - all canonical matrix rows accounted for
    - required Stories technically validated and user-reviewed
    - required Use Cases user-approved for testing
    - test scenarios derived and cross-linked
    - all BL-002 quality gates pass
    - required outputs exist
    - all Work Units closed
    - explicit user acceptance obtained before CLOSED
