completion_path:
  id: CP-BL-001-v3
  backlog_item: BL-001
  type: TRACEABILITY
  name: Controller Traceability Completion Path
  statement_of_work: backlog/sow/BL-001-controller-traceability.yaml
  statement_of_work_gate: QG-SOW-001
  common_dependency_gate: QG-DEP-001
  quality_gate_config: backlog/gates/BL-001-traceability.yaml

  purpose: >-
    Establish a trusted endpoint-to-final-dependency traceability baseline for the
    frozen CylinderManagement source version.

  prerequisites:
    - QG-SOW-001 must PASS before analysis, planning or execution
    - QG-DEP-001 must PASS
    - BL-001 run_enabled must be true in backlog/orchestrator-run-config.yaml
    - backlog/gates/BL-001-traceability.yaml must be configured and user-approved

  phases:
    - id: ANALYZE
      owner: ORCHESTRATOR
      required: true
      actions:
        - confirm the BL-001 Statement of Work remains valid and in force
        - freeze/confirm one source baseline
        - inspect current traceability runtime state
        - determine the complete Source Repository Check scope
        - create/update the full repository-check Worker Input
      outputs:
        - backlog/runtime/BL-001/analysis.yaml
        - backlog/runtime/BL-001/execution-plan.yaml
        - worker/inputs/WI-0004.yaml
      gates:
        - QG-SOW-001
        - QG-TRC-001

    - id: EXECUTE_SOURCE_CHECK
      owner: ORCHESTRATOR
      required: true
      actions:
        - submit WI-0004 to the Generic Worker
        - track init/service/close
        - accept only a CLOSED, COMPLETED structured result
        - validate the result against the Source Check Output contract
      worker_output: worker/results/WI-0004.yaml
      gates:
        - QG-TRC-002
        - QG-TRC-003
        - QG-TRC-004
        - QG-TRC-005

    - id: BUILD_MATRIX
      owner: ORCHESTRATOR
      required: true
      inputs:
        - worker/results/WI-0004.yaml
      rules:
        - do not re-read source during the initial matrix build
        - preserve Worker source conclusions
        - assign stable Controller and Endpoint IDs
      outputs:
        - traceability/source-repository-check.md
        - traceability/controller-inventory.md
        - traceability/endpoint-inventory.md
        - traceability/controller-traceability.md
        - traceability/unresolved-traceability.md
      gates:
        - QG-TRC-006
        - QG-TRC-007
        - QG-TRC-008
        - QG-TRC-009
        - QG-TRC-010
        - QG-TRC-011
        - QG-TRC-012

    - id: VALIDATE_AND_REGISTER
      owner: ORCHESTRATOR
      required: true
      actions:
        - register source-artifact baseline
        - confirm every required Worker/Work Unit run is CLOSED
        - update human story/status
      gates:
        - QG-TRC-013
        - QG-TRC-014

    - id: USER_ACCEPTANCE
      owner: USER
      required: true
      actions:
        - present Traceability summary, Coverage, Resolution, unresolved/blocked/failed items and artifact locations
        - wait for explicit user APPROVE or REJECT
      gate: QG-TRC-015
      on_reject: RETURN_TO_ORCHESTRATOR_ANALYSIS

    - id: CLOSE
      owner: ORCHESTRATOR
      required: true
      start_condition: QG-TRC-015_PASS
      actions:
        - mark BL-001 VERIFIED
        - mark BL-001 CLOSED

  parallelism:
    analysis: false
    source_check_worker: false
    matrix_build: false

  completion_conditions:
    - QG-SOW-001 PASS
    - QG-DEP-001 PASS
    - QG-TRC-001 through QG-TRC-014 PASS
    - QG-TRC-015 explicitly APPROVED by user
    - required artifacts exist
    - source-artifact registration complete
    - all required runs closed
