statement_of_work:
  backlog_item: BL-008
  version: 3
  title: Migrate CylinderManagement Database to Ownership Model
  status: APPROVED_FOR_EXECUTION_AFTER_GATES
  objective: >-
    Execute CylinderManagement database migration requirements against the separate Neon test environment on branch main only,
    one database requirement at a time, using Flyway and proving ownership-model and data integrity after each completed requirement.
  problem_statement: >-
    The verified Neon main/neondb test database is empty and the authoritative migration source is known, but ownership-model
    migration cannot advance safely unless each migration is selected in exact Flyway order, executed by a real Flyway runtime,
    verified in flyway_schema_history, and followed by schema/data integrity checks before the next requirement is selected.
  scope:
    in_scope:
      - verified Neon project neon-for-cylinder-db, branch main, database neondb
      - authoritative Flyway migrations from the frozen CylinderManagement source
      - exactly one active migration requirement at a time
      - Flyway info, validation, migration, history verification and post-migration integrity checks
      - ownership-model invariants and database-dependency-neon.md evidence
    out_of_scope:
      - Neon branch creation
      - direct external production deployment
      - parallel database migration requirements
      - manual SQL substitution
      - persistence of credentials or full connection strings
  authoritative_sources:
    dependency_ledger: database-dependency-neon.md
    flyway_repository: vvekselva/CylinderManagement
    frozen_source_commit: 3ae6e61442132d94a307275b08dd65fcef228d89
    flyway_path: cylinder.datascripts/src/main/resources/db/migration/
    ownership_reference_roots: [NewOwnerShipModelv3/, cmas.database.operations/]
  execution_requirements:
    - use Neon project neon-for-cylinder-db as a separate test environment, not as direct external production
    - use Neon branch main only for BL-008 migration execution
    - do not create any Neon migration, validation, feature or recovery branch
    - verify the exact database name on Neon main before any write
    - discover the ordered database requirements from authoritative Flyway/source evidence
    - keep exactly one database requirement in ACTIVE/EXECUTING state at a time
    - complete validation and durable evidence for the active database requirement before selecting the next one
    - run Flyway validation before applying the active requirement
    - validate flyway_schema_history after the active requirement
    - run post-change schema, ownership, referential-integrity and critical-data checks after each requirement
    - record the exact requirement/version/result in database-dependency-neon.md before the next requirement begins
    - never use manual SQL as a substitute for the Flyway migration sequence
    - do not log secrets or full connection strings
  ownership_invariants:
    - COMPANY_OWNED must not carry supplier-owner or customer-owner identity
    - SUPPLIER_OWNED must identify a supplier and must not identify a customer owner
    - CUSTOMER_OWNED must identify a customer and must not identify a supplier owner
    - supplier and customer ownership must never both be populated for one ownership record
    - migration must preserve cylinder identity, state/history, custody/logistics and audit relationships unless a versioned migration explicitly changes them
  recovery:
    branch_creation_allowed: false
    method: FAIL_CLOSED_AND_STOP_CURRENT_REQUIREMENT
    rule: >-
      If validation or execution fails, do not continue to the next database requirement and do not apply an ad-hoc fix.
      Preserve the failure evidence, repair the authoritative Flyway/source requirement, then retry the same requirement under governance.
  deliverables:
    - validated BL-008 runtime SSOT and logs
    - sequential database-requirement execution evidence
    - ownership-model integrity evidence
    - updated database-dependency-neon.md ledger
  acceptance_criteria:
    - all BL-008 quality gates pass
    - no Neon branch is created
    - only Neon main is mutated by BL-008
    - one database requirement is completed and recorded before the next starts
    - all selected Flyway requirements succeed in sequence
    - ownership invariants and critical integrity checks pass after each requirement
    - no manual SQL substitution occurs
    - explicit user acceptance is obtained before CLOSED
  completion_definition: >-
    BL-008 is complete only after every authoritative migration requirement has passed Flyway execution and verification in order,
    the ownership/data-integrity gates pass, the dependency ledger is synchronized, and explicit user acceptance is recorded.
  execution_authorization:
    sow_required: true
    structurally_valid: true
    placeholders_present: false
    authorization_basis: USER_DIRECTIVE_2026-08-26_NEON_MAIN_ONLY_SEQUENTIAL_DB_REQUIREMENTS
  user_authorization_basis: USER_DIRECTIVE_2026-08-26_NEON_MAIN_ONLY_SEQUENTIAL_DB_REQUIREMENTS
