statement_of_work:
  backlog_item: BL-008
  version: 1
  title: Migrate CylinderManagement Database to Ownership Model
  status: APPROVED_FOR_EXECUTION_AFTER_GATES
  objective: >-
    Execute the authoritative Flyway migration sequence for CylinderManagement against the governed Neon database, first on
    an isolated validation branch and then on production only after validation passes, while proving ownership-model and data integrity.
  authoritative_sources:
    dependency_ledger: database-dependency-neon.md
    flyway_repository: vvekselva/CylinderManagement
    flyway_path: cylinder.datascripts/src/main/resources/db/migration/
    required_target: V176
    ownership_reference_roots: [NewOwnerShipModelv3/, cmas.database.operations/]
  execution_requirements:
    - verify Neon project, branch and database identity before writes
    - prove the production database pre-state and current flyway_schema_history state
    - create or verify a migration validation branch derived from production before any migration
    - inventory migration filenames, versions and checksums; fail on duplicate/out-of-order/invalid migration candidates
    - run Flyway validate before migrate
    - run Flyway migrate through the required target on the validation branch
    - run post-migration schema, ownership, referential-integrity and critical-data checks
    - promote the identical validated migration source to production only if validation branch gates pass
    - run the same post-migration checks on production
    - record exact migration/version/result evidence in database-dependency-neon.md
    - never use manual SQL as a substitute for the Flyway migration sequence
    - do not log secrets or full connection strings
  ownership_invariants:
    - COMPANY_OWNED must not carry supplier-owner or customer-owner identity
    - SUPPLIER_OWNED must identify a supplier and must not identify a customer owner
    - CUSTOMER_OWNED must identify a customer and must not identify a supplier owner
    - supplier and customer ownership must never both be populated for one ownership record
    - migration must preserve cylinder identity, state/history, custody/logistics and audit relationships unless a versioned migration explicitly changes them
  rollback_and_recovery:
    required_before_mutation: true
    preferred: NEON_VALIDATION_BRANCH_FROM_PRODUCTION
    production_failure_action: FAIL_CLOSED_NO_MANUAL_PATCH
    evidence_required: branch identity plus pre-migration schema/history snapshot
  deliverables:
    - validated BL-008 runtime SSOT and logs
    - validated Flyway migration result through V176
    - ownership-model integrity evidence
    - updated database-dependency-neon.md ledger
  acceptance_criteria:
    - all BL-008 quality gates pass
    - validation branch migration passes before production migration
    - production migration reaches V176 with successful Flyway history
    - ownership invariants and critical integrity checks pass
    - no manual SQL substitution occurs
    - explicit user acceptance is obtained before CLOSED
  user_authorization_basis: USER_DIRECTIVE_2026-08-26_INCLUDE_DATABASE_MIGRATION_IN_ORCHESTRATION
  structurally_valid: true
  placeholders_present: false
