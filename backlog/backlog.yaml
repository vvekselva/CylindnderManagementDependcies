backlog:
  version: 6
  target_repository: vvekselva/CylinderManagement
  run_config: backlog/orchestrator-run-config.yaml
  quality_gate_governance: governance/quality-gates.yaml
  ssot_governance: governance/ssot-levels.yaml
  item_definition_template: backlog/item-definition-template.yaml
  statement_of_work_template: backlog/statement-of-work-template.yaml
  runtime_contract: backlog/runtime-contract.yaml
  three_level_ssot_gate: QG-SSOT-001
  statement_of_work_gate: QG-SOW-001
  selection_policy: HIGHEST_PRIORITY_ELIGIBLE_ITEM
  max_parallel_backlog_items: 1
  note: >-
    backlog.yaml is the authoritative Level 1 Backlog Master SSOT. A Backlog Item may be
    catalogued before it is ready, but PLAN/REPLAN is fail-closed until its Level 1 master
    entry, Level 2 definition/SOW/Completion Path/Quality Gate, and Level 3 runtime SSOT are
    complete and QG-SSOT-001 passes. Execution remains subject to QG-SOW-001, QG-DEP-001,
    item-specific Quality Gates, Work Unit dependencies and required user acceptance.

  states:
    - YET_TO_DO
    - WAITING_FOR_DEPENDENCY
    - READY
    - ANALYZING
    - PLANNED
    - EXECUTING
    - PARTIAL
    - BLOCKED
    - WAITING_FOR_DECISION
    - FAILED
    - VALIDATING
    - WAITING_FOR_USER_VERIFICATION
    - VERIFIED
    - CLOSED

  items:
    - id: BL-001
      name: Controller Traceability
      type: TRACEABILITY
      purpose: Establish a trusted endpoint-to-final-dependency traceability baseline for the frozen CylinderManagement source version.
      priority: P1_BLOCKER_CLEARING
      state: PARTIAL
      item_definition: backlog/items/BL-001-controller-traceability.yaml
      statement_of_work: backlog/sow/BL-001-controller-traceability.yaml
      completion_path: backlog/paths/BL-001-traceability.yaml
      quality_gate: backlog/gates/BL-001-traceability.yaml
      implementation_workflow: workflows/WF-001-controller-traceability/workflow.yaml
      runtime: backlog/runtime/BL-001/
      dependencies: []
      current_work_unit: WU-BL001-001
      expected_outputs:
        - traceability/source-repository-check.md
        - traceability/controller-inventory.md
        - traceability/endpoint-inventory.md
        - traceability/controller-traceability.md
        - traceability/unresolved-traceability.md
        - worker/results/WI-0004.yaml

    - id: BL-002
