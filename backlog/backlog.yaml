      statement_of_work: backlog/sow/BL-002-controller-story-usecase.yaml
      completion_path: backlog/paths/BL-002-controller-story-usecase.yaml
      quality_gate: backlog/gates/BL-002-controller-story-usecase.yaml
      implementation_workflow: workflows/WF-003-controller-story-usecase.yaml
      runtime: backlog/runtime/BL-002/
      dependencies: [BL-001]
      dependency_rule: INCREMENTAL_ACCEPTED_CANONICAL_ROWS
      incremental_dependency_contract: >-
        BL-002 may execute in parallel with BL-001 using only Primary-Orchestrator-accepted, materialized, non-stale
        canonical BL-001 rows. Pending atomic-projection rows, raw worker evidence and unaccepted candidates are forbidden.
      expected_outputs: [stories/story-register.yaml, stories/STORY-*.yaml, stories/STORY-*.md, usecases/usecase-register.yaml, usecases/UC-*.yaml, usecases/UC-*.md, traceability/controller-story-usecase-map.yaml, usecases/usecase-test-scenarios.yaml]

