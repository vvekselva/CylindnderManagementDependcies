backlog:
  version: 9
  target_repository: vvekselva/CylinderManagement
  run_config: backlog/orchestrator-run-config.yaml
  quality_gate_governance: governance/quality-gates.yaml
  ssot_governance: governance/ssot-levels.yaml
  item_definition_template: backlog/item-definition-template.yaml
  statement_of_work_template: backlog/statement-of-work-template.yaml
  runtime_contract: backlog/runtime-contract.yaml
  three_level_ssot_gate: QG-SSOT-001
  statement_of_work_gate: QG-SOW-001
  selection_policy: HIGHEST_PRIORITY_ELIGIBLE_ITEMS_WITH_SAFE_PARALLELISM
  max_parallel_backlog_items: 3
  note: >-
    backlog.yaml is the authoritative Level 1 Backlog Master SSOT. PLAN/REPLAN is fail-closed until Level 1, Level 2
    and Level 3 are complete. BL-001, BL-002 and BL-008 may execute as coordinated parallel workstreams when their own
    gates pass; database mutation remains serialized under BL-008.

  states: [YET_TO_DO, WAITING_FOR_DEPENDENCY, READY, ANALYZING, PLANNED, EXECUTING, PARTIAL, BLOCKED, WAITING_FOR_DECISION, FAILED, VALIDATING, WAITING_FOR_USER_VERIFICATION, VERIFIED, CLOSED]

