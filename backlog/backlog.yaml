backlog:
  version: 4
  target_repository: vvekselva/CylinderManagement
  run_config: backlog/orchestrator-run-config.yaml
  quality_gate_governance: governance/quality-gates.yaml
  selection_policy: HIGHEST_PRIORITY_ELIGIBLE_ITEM
  max_parallel_backlog_items: 1
  note: >-
    Run eligibility is controlled by backlog/orchestrator-run-config.yaml. A Backlog Item
    must also pass QG-DEP-001 and have an approved item-specific Quality Gate before it
    may execute. Only one Backlog Item is active at a time; safe Work Units inside it may
    use parallel execution.

  states:
    - YET_TO_DO
    - WAITING_FOR_DEPENDENCY
    - READY
    - ANALYZING
    - PLANNED
    - EXECUTING
    - PARTIAL
    - BLOCKED
    - WAITING_FOR_DECISION
    - FAILED
    - VALIDATING
    - WAITING_FOR_USER_VERIFICATION
    - VERIFIED
    - CLOSED

  items:
    - id: BL-001
      name: Controller Traceability
      type: TRACEABILITY
      priority: P1_BLOCKER_CLEARING
      state: PARTIAL
      completion_path: backlog/paths/BL-001-traceability.yaml
      quality_gate: backlog/gates/BL-001-traceability.yaml
      implementation_workflow: workflows/WF-001-controller-traceability/workflow.yaml
      runtime: backlog/runtime/BL-001/
      dependencies: []
      current_work_unit: WU-BL001-001
      expected_outputs:
        - traceability/source-repository-check.md
        - traceability/controller-inventory.md
        - traceability/endpoint-inventory.md
        - traceability/controller-traceability.md
        - traceability/unresolved-traceability.md

    - id: BL-002
      name: Unit Test Completion
      type: UNIT_TEST
      priority: P2_CRITICAL_PATH
      state: YET_TO_DO
      completion_path: backlog/paths/BL-002-unit-test.yaml
      quality_gate: null
      dependencies: []
      expected_outputs:
        - quality/unit-test/unit-test-inventory.md
        - quality/unit-test/unit-test-results.md
        - quality/unit-test/unresolved-unit-tests.md

    - id: BL-003
      name: Integration Test Completion
      type: INTEGRATION_TEST
      priority: P2_CRITICAL_PATH
      state: YET_TO_DO
      completion_path: backlog/paths/BL-003-integration-test.yaml
      quality_gate: null
      dependencies: []
      expected_outputs:
        - quality/integration-test/integration-test-inventory.md
        - quality/integration-test/integration-test-results.md
        - quality/integration-test/unresolved-integration-tests.md

    - id: BL-004
      name: Code Coverage Report
      type: CODE_COVERAGE
      priority: P2_CRITICAL_PATH
      state: WAITING_FOR_DEPENDENCY
      completion_path: backlog/paths/BL-004-code-coverage.yaml
      quality_gate: null
      dependencies: [BL-002, BL-003]
      dependency_rule: ALL_VERIFIED_OR_CLOSED
      expected_outputs:
        - quality/code-coverage/coverage-report.md
        - quality/code-coverage/coverage-summary.yaml

    - id: BL-005
      name: ArchUnit Architecture Test
      type: ARCHUNIT
      priority: P3_NORMAL
      state: YET_TO_DO
      completion_path: backlog/paths/BL-005-archunit.yaml
      quality_gate: null
      dependencies: []
      expected_outputs:
        - quality/archunit/architecture-rules.md
        - quality/archunit/archunit-results.md
        - quality/archunit/unresolved-architecture-rules.md

    - id: BL-006
      name: Requirements Traceability and Gap Analysis
      type: REQUIREMENTS
      priority: P2_CRITICAL_PATH
      state: YET_TO_DO
      completion_path: backlog/paths/BL-006-requirements.yaml
      quality_gate: null
      dependencies: []
      expected_outputs:
        - requirements/requirements-inventory.md
        - requirements/requirements-traceability.md
        - requirements/requirements-gaps.md

    - id: BL-007
      name: Migration of the Database to the Ownership Model
      type: DATABASE_MIGRATION
      priority: P3_NORMAL
      state: YET_TO_DO
      quality_gate: null
      dependencies: []

    - id: BL-008
      name: Supplier Owned, Customer Owned and Company Owned Cylinder Model
      type: OWNERSHIP_MODEL
      priority: P3_NORMAL
      state: YET_TO_DO
      quality_gate: null
      dependencies: []

    - id: BL-009
      name: Physical Challan Book Location
      type: CHALLAN_MANAGEMENT
      priority: P3_NORMAL
      state: YET_TO_DO
      quality_gate: null
      dependencies: []

    - id: BL-010
      name: Ownership Dashboard Changes
      type: DASHBOARD
      priority: P3_NORMAL
      state: YET_TO_DO
      quality_gate: null
      dependencies: []

    - id: BL-011
      name: CRUD Services for All Tables
      type: CRUD_SERVICES
      priority: P3_NORMAL
      state: YET_TO_DO
      quality_gate: null
      dependencies: []

    - id: BL-012
      name: On Spot Cylinder Checks
      type: CYLINDER_CHECK
      priority: P3_NORMAL
      state: YET_TO_DO
      quality_gate: null
      dependencies: []

    - id: BL-013
      name: Correction Management
      type: CORRECTION_MANAGEMENT
      priority: P3_NORMAL
      state: YET_TO_DO
      quality_gate: null
      dependencies: []

    - id: BL-014
      name: Invoice Generation and Check in Tally
      type: INVOICE_INTEGRATION
      priority: P3_NORMAL
      state: YET_TO_DO
      quality_gate: null
      dependencies: []

    - id: BL-015
      name: Attendance Management
      type: ATTENDANCE_MANAGEMENT
      priority: P3_NORMAL
      state: YET_TO_DO
      quality_gate: null
      dependencies: []

    - id: BL-016
      name: Trip Planning for the Customers
      type: TRIP_PLANNING
      priority: P3_NORMAL
      state: YET_TO_DO
      quality_gate: null
      dependencies: []

    - id: BL-017
      name: CEO Dashboard
      type: DASHBOARD
      priority: P3_NORMAL
      state: YET_TO_DO
      quality_gate: null
      dependencies: []

    - id: BL-018
      name: Restoring the Logical Backup
      type: DATABASE_RESTORE
      priority: P3_NORMAL
      state: YET_TO_DO
      quality_gate: null
      dependencies: []

    - id: BL-019
      name: Task Management
      type: TASK_MANAGEMENT
      priority: P3_NORMAL
      state: YET_TO_DO
      quality_gate: null
      dependencies: []

    - id: BL-020
      name: Customer Data Dashboard
      type: DASHBOARD
      priority: P3_NORMAL
      state: YET_TO_DO
      quality_gate: null
      dependencies: []

  current_selection:
    backlog_item: BL-001
    phase: EXECUTE_SOURCE_CHECK
    run_enabled: true
    quality_gate_configured: true
    quality_gate_approved: true
    analysis: backlog/runtime/BL-001/analysis.yaml
    execution_plan: backlog/runtime/BL-001/execution-plan.yaml
    current_work_unit: WU-BL001-001
    worker_input: worker/inputs/WI-0004.yaml
    last_attempt_result: PARTIAL
    next_action: RETRY_OR_CONTINUE_SOURCE_CHECK
