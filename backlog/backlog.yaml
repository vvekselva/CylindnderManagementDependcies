    - {id: BL-004, name: Integration Test Completion, type: INTEGRATION_TEST, purpose: Execute integration and Use Case tests from BL-002 approved Use Cases and authoritative scenarios., priority: P2_CRITICAL_PATH, state: WAITING_FOR_DEPENDENCY, item_definition: null, statement_of_work: null, completion_path: backlog/paths/BL-004-integration-test.yaml, quality_gate: null, runtime: null, dependencies: [BL-002], dependency_rule: ALL_VERIFIED_OR_CLOSED, expected_outputs: [quality/integration-test/integration-test-inventory.md, quality/integration-test/usecase-test-inventory.md, quality/integration-test/integration-test-results.md, quality/integration-test/usecase-test-results.md, quality/integration-test/unresolved-integration-tests.md]}
    - {id: BL-005, name: Code Coverage Report, type: CODE_COVERAGE, purpose: Produce code coverage after required unit and integration testing., priority: P2_CRITICAL_PATH, state: WAITING_FOR_DEPENDENCY, item_definition: null, statement_of_work: null, completion_path: backlog/paths/BL-005-code-coverage.yaml, quality_gate: null, runtime: null, dependencies: [BL-003, BL-004], dependency_rule: ALL_VERIFIED_OR_CLOSED, expected_outputs: [quality/code-coverage/coverage-report.md, quality/code-coverage/coverage-summary.yaml]}
    - {id: BL-006, name: ArchUnit Architecture Test, type: ARCHUNIT, purpose: Validate architecture rules., priority: P3_NORMAL, state: YET_TO_DO, item_definition: null, statement_of_work: null, completion_path: backlog/paths/BL-006-archunit.yaml, quality_gate: null, runtime: null, dependencies: [], expected_outputs: [quality/archunit/architecture-rules.md, quality/archunit/archunit-results.md, quality/archunit/unresolved-architecture-rules.md]}
