statement_of_work:
  backlog_item: BL-###
  version: 1
  title: <plain-English Statement of Work title>
  status: DRAFT

  objective: >-
    <business/technical outcome this backlog item must achieve>

  problem_statement: >-
    <problem, gap, risk or requirement that justifies this backlog item>

  scope:
    in_scope:
      - <included activity or component>
    out_of_scope:
      - <explicit exclusion>

  target:
    repository: <owner/repository>
    baseline_rule: <FROZEN_COMMIT|CURRENT_APPROVED_REF|OTHER>

  deliverables:
    - <required artifact/output>

  execution_requirements:
    - <mandatory execution rule>

  dependencies:
    backlog_items: []
    external_dependencies: []

  acceptance_criteria:
    - <objective condition that proves the work is acceptable>

  quality_gate_requirements:
    item_quality_gate: <backlog/gates/file.yaml>
    user_acceptance_required: true

  completion_definition:
    - all in-scope work is accounted for
    - all required deliverables exist
    - all mandatory quality gates pass
    - all required worker/work-unit runs are closed
    - required user acceptance is obtained

  execution_authorization:
    sow_required: true
    structurally_valid: false
    placeholders_present: true
    validated_by: ORCHESTRATOR
    validation_evidence: null

  governance_rule: >-
    A Backlog Item MUST NOT enter analysis or execution unless its Statement of Work
    exists and is structurally valid: objective, problem statement, in-scope work,
    deliverables, execution requirements, acceptance criteria and completion definition
    must be populated with non-placeholder content. Missing or incomplete SOW is a
    fail-closed governance blocker.
