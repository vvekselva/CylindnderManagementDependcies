backlog_item:
  id: BL-###
  version: 2
  name: <plain-English backlog item name>
  type: <TRACEABILITY|UNIT_TEST|INTEGRATION_TEST|CODE_COVERAGE|ARCHUNIT|REQUIREMENTS|OTHER>
  state: YET_TO_DO
  priority: P3_NORMAL

  purpose: >-
    <outcome this backlog item must achieve>

  statement_of_work:
    required: true
    file: backlog/sow/<BL-ID>-<slug>.yaml
    gate: QG-SOW-001

  target:
    repository: <owner/repository>
    baseline_rule: <FROZEN_COMMIT|CURRENT_APPROVED_REF|OTHER>

  dependencies:
    backlog_items: []
    dependency_rule: ALL_VERIFIED

  completion_path:
    path_file: backlog/paths/<file>.yaml

  orchestration:
    analysis_required: true
    execution_plan_required: true
    worker_inputs_generated_by: ORCHESTRATOR
    worker_execution_scheduled_by: ORCHESTRATOR
    worker_results_validated_by: ORCHESTRATOR
    final_gate_evaluated_by: ORCHESTRATOR

  expected_outputs:
    - <artifact>

  execution_prerequisites:
    - QG-SOW-001 must PASS before analysis, planning or execution
    - QG-DEP-001 must PASS
    - item-specific quality-gate configuration must exist and be approved when required

  closure_rule:
    - all mandatory path steps complete
    - all mandatory gates pass
    - required outputs exist
    - no required run remains open
    - required user acceptance is obtained
