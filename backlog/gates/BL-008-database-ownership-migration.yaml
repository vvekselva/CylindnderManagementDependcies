quality_gate:
  backlog_item: BL-008
  version: 2
  name: Database Ownership Migration Quality Gates
  approved_by_user: true
  approval_basis: USER_DIRECTIVE_2026-08-26_NEON_MAIN_ONLY_SEQUENTIAL_DB_REQUIREMENTS
  gates:
    - id: QG-DBMIG-001
      name: Migration Source and Neon Main Target Inventory
      owner: ORCHESTRATOR
      fail_closed: true
      pass_condition: Exact Neon project, main branch, database identity and authoritative ordered database requirements are proved; no ambiguous migration version remains.
    - id: QG-DBMIG-002
      name: Single Active Database Requirement
      owner: ORCHESTRATOR
      fail_closed: true
      pass_condition: Exactly one next database requirement is selected in migration order and no other database requirement is ACTIVE or EXECUTING.
    - id: QG-DBMIG-003
      name: Selected Requirement Validation
      owner: ORCHESTRATOR
      fail_closed: true
      pass_condition: The selected requirement passes Flyway/source validation with valid version, ordering and checksum evidence.
    - id: QG-DBMIG-004
      name: Apply Selected Requirement to Neon Main
      owner: ORCHESTRATOR
      fail_closed: true
      pass_condition: The selected requirement is applied successfully to Neon main through Flyway with no branch creation and no manual SQL substitution.
    - id: QG-DBMIG-005
      name: Selected Requirement Integrity
      owner: ORCHESTRATOR
      fail_closed: true
      pass_condition: flyway_schema_history, schema/referential integrity, applicable ownership invariants and critical cylinder/state/custody/logistics/audit checks pass after the selected requirement.
    - id: QG-DBMIG-006
      name: Requirement Ledger Synchronization
      owner: ORCHESTRATOR
      fail_closed: true
      pass_condition: database-dependency-neon.md and BL-008 runtime/log evidence record the selected requirement, exact result and validation evidence before another requirement is selected.
    - id: QG-DBMIG-007
      name: Sequential Completion/Replan
      owner: ORCHESTRATOR
      fail_closed: true
      pass_condition: The completed requirement is durably closed before either the next requirement is selected or BL-008 final verification begins.
  forbidden_actions:
    - NEON_BRANCH_CREATION
    - MULTIPLE_ACTIVE_DATABASE_REQUIREMENTS
    - DIRECT_EXTERNAL_PRODUCTION_MUTATION
    - MANUAL_SQL_SUBSTITUTION_FOR_FLYWAY
    - SECRET_OR_CONNECTION_STRING_COMMIT
    - SILENT_REWRITE_OF_APPLIED_MIGRATION
    - CONTINUE_AFTER_CURRENT_REQUIREMENT_FAILURE
  close_rule: BL-008 may become VERIFIED only after all required database requirements are completed sequentially and QG-DBMIG-001 through QG-DBMIG-007 pass; CLOSED additionally requires explicit user acceptance.
