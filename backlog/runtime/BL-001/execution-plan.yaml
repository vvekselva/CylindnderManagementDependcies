execution_plan:
  backlog_item: BL-001
  version: 6
  state: PLANNED
  generated_by: ORCHESTRATOR
  completion_path: backlog/paths/BL-001-traceability.yaml
  source_baseline: 3ae6e61442132d94a307275b08dd65fcef228d89

  planning_authorization:
    gate: QG-SSOT-001
    state: PASS
    level_1: COMPLETE
    level_2: COMPLETE
    level_3: COMPLETE
    statement_of_work_gate: QG-SOW-001
    statement_of_work_state: PASS
    user_authorized_change: REAL_PARALLEL_LANE_DISPATCH

  lifecycle_logging_policy:
    contract: governance/execution-lifecycle-logging.yaml
    gate: QG-LOG-001
    pre_invocation_individual_repo_lane_logs_required: 0
    every_start_requires_exact_task: true
    matrix_worker_required_events: [LANE_INIT_START, LANE_INIT_END, LANE_SERVICE_START, LANE_SERVICE_END, LANE_CLOSE_END]
    matrix_worker_lifecycle_evidence_file: lane-lifecycle.md
    matrix_individual_artifacts_transient: true
    matrix_aggregate_artifact_required: lane-dispatch-aggregate
    transient_matrix_artifacts_deleted_after_verified_aggregation: true
    orchestrator_invocation_end_requires_runtime_and_statistics_sync: true

  real_lane_dispatch_policy:
    governance: governance/lane-execution.yaml
    gate: QG-LANE-001
    dispatch_ssot: backlog/runtime/BL-001/lane-dispatch.yaml
    backend: GITHUB_ACTIONS_MATRIX
    workflow: .github/workflows/lane-matrix-dispatch.yml
    configured_lanes: 10
    expected_concurrency_formula: min(configured_lanes, safe_ready_tasks)
    distinct_lane_ids_are_not_concurrency: true
    measure_peak_concurrent_lanes: true
    measure_average_concurrent_lanes: true
    worker_role: READ_ONLY_SOURCE_EVIDENCE_COLLECTION
    final_trace_decision_owner: ORCHESTRATOR
    quality_rule: >-
      Matrix evidence may accelerate source inspection but never changes the no-guessing rule.
      The Orchestrator validates each endpoint path before classifying COMPLETE or UNRESOLVED.

  invocation_utilization_policy:
    objective: MAXIMIZE_MEASURED_SAFE_CONCURRENCY
    one_primary_coordinator: true
    one_active_backlog_item: true
    fixed_small_endpoint_batch_limit: false
    fill_available_real_workers_when_safe: true
    reuse_proved_relationships_only_when_source_confirms_same_path: true
    stop_conditions:
      - NO_ELIGIBLE_INDEPENDENT_WORK_REMAINS
      - HARD_BLOCKER_PREVENTS_FURTHER_ELIGIBLE_WORK
      - RESOURCE_OR_SHARED_FILE_LOCK_PREVENTS_SAFE_PARALLELISM
      - EXTERNAL_WORKER_BACKEND_FAILED
      - INVOCATION_OR_TOOL_EXECUTION_LIMIT_REACHED
      - WORK_UNIT_COMPLETION_BOUNDARY_REACHED

  work_units:
    - id: WU-BL001-001
      name: Complete Source Repository Check
      phase: EXECUTE_SOURCE_CHECK
      state: READY
      parallel: true
      executor: GITHUB_ACTIONS_MATRIX_EVIDENCE_WORKERS_PLUS_ORCHESTRATOR_VALIDATION
      parallel_scope: INDEPENDENT_CONTROLLER_OR_ENDPOINT_FAMILIES_ONLY
      max_parallel_lanes: 10
      batching_strategy: CONTROLLER_SERVICE_FAMILY
      lane_assignment_ssot: backlog/runtime/BL-001/lane-status.yaml
      lane_dispatch_ssot: backlog/runtime/BL-001/lane-dispatch.yaml
      real_worker_workflow: .github/workflows/lane-matrix-dispatch.yml
      real_worker_governance: governance/lane-execution.yaml
      real_lane_gate: QG-LANE-001
      lifecycle_logging_contract: governance/execution-lifecycle-logging.yaml
      matrix_worker_output: lane-dispatch-aggregate artifact
      worker_input: worker/inputs/WI-0004.yaml
      expected_result: worker/results/WI-0004.yaml
      result_contract: workflows/WF-001-controller-traceability/source-check-output-contract.yaml
      execution_sequence:
        - orchestrator selects safe independent not-yet-examined controller/endpoint families
        - orchestrator writes lane-dispatch.yaml
        - GitHub Actions matrix starts up to ten independent read-only workers
        - every worker logs INIT SERVICE CLOSE boundaries and uploads isolated evidence
        - summary job calculates actual peak and average concurrency
        - summary job aggregates lane evidence and deletes transient individual artifacts
        - orchestrator consumes the aggregate and validates endpoint-by-endpoint trace results
        - orchestrator synchronizes analysis statistics gates blockers and lane status
      evidence_rule: >-
        Each endpoint must still be traced independently to source-proved final dependency evidence.
        Worker-discovered dependency candidates are not final evidence until the Orchestrator confirms
        the actual source call path. No naming inference or guessing is allowed.
      result_acceptance_rule: >-
        Canonical source-check result is accepted only when its run is CLOSED, its result contract
        validates, QG-LOG-001 is satisfied, and endpoint trace-result coverage reaches 100 percent.
        QG-LANE-001 governs claims of parallel utilization; valid source evidence remains usable even
        if lane utilization is under target.
      completion_rule: Worker result COMPLETED, run CLOSED, contract valid, lifecycle logging valid, coverage 100 percent.

    - id: WU-BL001-002
      name: Build Traceability Matrix Artifacts
      phase: BUILD_MATRIX
      state: WAITING_FOR_DEPENDENCY
      needs: [WU-BL001-001]
      executor: ORCHESTRATION_LANE
      input: worker/results/WI-0004.yaml
      source_read_allowed: false
      outputs:
        - traceability/source-repository-check.md
        - traceability/controller-inventory.md
        - traceability/endpoint-inventory.md
        - traceability/controller-traceability.md
        - traceability/unresolved-traceability.md

    - id: WU-BL001-003
      name: Validate Traceability Gates
      phase: VALIDATE
      state: WAITING_FOR_DEPENDENCY
      needs: [WU-BL001-002]
      executor: ORCHESTRATOR
      completion_rule: Every exposed endpoint appears exactly once; coverage 100 percent; evidence/unresolved/logging rules pass.

    - id: WU-BL001-004
      name: Register Baseline and Close Backlog Item
      phase: CLOSE
      state: WAITING_FOR_DEPENDENCY
      needs: [WU-BL001-003]
      executor: ORCHESTRATOR
      outputs:
        - sync/source-artifact-sync-register.yaml
        - logs/automation-story.md
      completion_rule: Source-artifact baseline registered, all required runs/logs closed, automatic gates pass, and required user acceptance is obtained.
