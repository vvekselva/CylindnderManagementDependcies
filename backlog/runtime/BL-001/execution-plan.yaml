execution_plan:
  backlog_item: BL-001
  version: 5
  state: PLANNED
  generated_by: ORCHESTRATOR
  completion_path: backlog/paths/BL-001-traceability.yaml
  source_baseline: 3ae6e61442132d94a307275b08dd65fcef228d89

  planning_authorization:
    gate: QG-SSOT-001
    state: PASS
    level_1: COMPLETE
    level_2: COMPLETE
    level_3: COMPLETE
    statement_of_work_gate: QG-SOW-001
    statement_of_work_state: PASS
    note: >-
      This plan is revalidated against the three-level SSOT model. The user explicitly
      authorized safe lane utilization, mandatory lifecycle boundary logging, exact task
      identity on START records, and invocation-boundary lane-log hygiene/aggregation.

  lifecycle_logging_policy:
    contract: governance/execution-lifecycle-logging.yaml
    gate: QG-LOG-001
    effective_for_next_invocation: true
    pre_invocation_lane_log_hygiene:
      required: true
      individual_lane_log_pattern: logs/runs/*-LANE-*.md
      required_count_before_new_execution: 0
      if_nonzero: RECOVERY_AGGREGATE_VERIFY_DELETE_ONLY_NO_NEW_EXECUTION
    orchestrator_event_order:
      - ORCHESTRATOR_INVOCATION_START
      - ORCHESTRATOR_LOG_AGGREGATION_START
      - ORCHESTRATOR_LOG_AGGREGATION_END
      - ORCHESTRATOR_INVOCATION_END
    lane_event_order:
      - LANE_INIT_START
      - LANE_INIT_END
      - LANE_SERVICE_START
      - LANE_SERVICE_END
      - LANE_CLOSE_END
    blocked_before_service_exception: >-
      If LANE_INIT_END is BLOCKED_BEFORE_SERVICE, SERVICE_START/SERVICE_END are omitted;
      close() still executes and LANE_CLOSE_END remains mandatory.
    lane_logs_are_transient: true
    invocation_close_log_aggregation:
      required: true
      aggregate_target: logs/runs/<invocation-id>.md
      shared_audit_target: logs/automation-log.md
      verify_before_delete: true
      delete_individual_lane_logs_after_verified_accumulation: true
      required_individual_lane_log_count_after_cleanup: 0
      invocation_end_requires_aggregation_pass: true
    fail_closed_rules:
      - pre-invocation individual lane log count must be zero before new execution
      - invocation start log must persist before analysis/planning/assignment/execution
      - every START log must contain exact task/task_description
      - lane INIT_START must persist before init executes
      - lane INIT_END INITIALIZED must persist before service may start
      - lane SERVICE_START must persist before service executes
      - SERVICE_END must persist after service returns
      - lane cannot be released until CLOSE_END or recovery-close persists
      - execution result is not accepted unless QG-LOG-001 reconciles required events
      - invocation cannot close until all lane logs are accumulated verified deleted and zero remain

  invocation_utilization_policy:
    objective: MAXIMIZE_SAFE_PROGRESS_PER_COORDINATOR_INVOCATION
    one_primary_coordinator: true
    one_active_backlog_item: true
    fixed_small_endpoint_batch_limit: false
    fill_available_lanes_when_safe: true
    refill_released_lanes_within_same_invocation: true
    reuse_proved_relationships_only_when_source_confirms_same_path: true
    stop_conditions:
      - NO_ELIGIBLE_INDEPENDENT_WORK_REMAINS
      - HARD_BLOCKER_PREVENTS_FURTHER_ELIGIBLE_WORK
      - RESOURCE_OR_SHARED_FILE_LOCK_PREVENTS_SAFE_PARALLELISM
      - INVOCATION_OR_TOOL_EXECUTION_LIMIT_REACHED
      - WORK_UNIT_COMPLETION_BOUNDARY_REACHED

  work_units:
    - id: WU-BL001-001
      name: Complete Source Repository Check
      phase: EXECUTE_SOURCE_CHECK
      state: READY
      parallel: true
      executor: ORCHESTRATOR_WITH_ORCHESTRATION_LANES
      parallel_scope: INDEPENDENT_CONTROLLER_OR_ENDPOINT_FAMILIES_ONLY
      max_parallel_lanes: 10
      batching_strategy: CONTROLLER_SERVICE_FAMILY
      lane_assignment_ssot: backlog/runtime/BL-001/lane-status.yaml
      lifecycle_logging_contract: governance/execution-lifecycle-logging.yaml
      required_lane_events: [LANE_INIT_START, LANE_INIT_END, LANE_SERVICE_START, LANE_SERVICE_END, LANE_CLOSE_END]
      lane_logs_transient_until_invocation_aggregation: true
      refill_released_lanes_within_same_invocation: true
      worker_input: worker/inputs/WI-0004.yaml
      expected_result: worker/results/WI-0004.yaml
      result_contract: workflows/WF-001-controller-traceability/source-check-output-contract.yaml
      evidence_rule: >-
        Each endpoint must still be traced independently to source-proved final dependency
        evidence. Shared previously proved component relationships may be reused only when
        the frozen source proves the same path. No naming inference or guessing is allowed.
      result_acceptance_rule: >-
        Run CLOSED, result contract valid, required lifecycle logs reconciled by QG-LOG-001,
        and final Source Check coverage reaches 100 percent.
      completion_rule: Worker result COMPLETED, run CLOSED, contract valid, lifecycle logging valid, coverage 100 percent.

    - id: WU-BL001-002
      name: Build Traceability Matrix Artifacts
      phase: BUILD_MATRIX
      state: WAITING_FOR_DEPENDENCY
      needs: [WU-BL001-001]
      executor: ORCHESTRATION_LANE
      input: worker/results/WI-0004.yaml
      source_read_allowed: false
      outputs:
        - traceability/source-repository-check.md
        - traceability/controller-inventory.md
        - traceability/endpoint-inventory.md
        - traceability/controller-traceability.md
        - traceability/unresolved-traceability.md

    - id: WU-BL001-003
      name: Validate Traceability Gates
      phase: VALIDATE
      state: WAITING_FOR_DEPENDENCY
      needs: [WU-BL001-002]
      executor: ORCHESTRATOR
      completion_rule: Every exposed endpoint appears exactly once; coverage 100 percent; evidence/unresolved/logging rules pass.

    - id: WU-BL001-004
      name: Register Baseline and Close Backlog Item
      phase: CLOSE
      state: WAITING_FOR_DEPENDENCY
      needs: [WU-BL001-003]
      executor: ORCHESTRATOR
      outputs:
        - sync/source-artifact-sync-register.yaml
        - logs/automation-story.md
      completion_rule: Source-artifact baseline registered, all required runs/logs closed, lane-log aggregation clean, automatic gates pass, and required user acceptance is obtained.
