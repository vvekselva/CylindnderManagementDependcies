execution_plan:
  backlog_item: BL-001
  version: 8
  state: PLANNED
  generated_by: ORCHESTRATOR
  completion_path: backlog/paths/BL-001-traceability.yaml
  source_baseline: 3ae6e61442132d94a307275b08dd65fcef228d89

  planning_authorization:
    gate: QG-SSOT-001
    state: PASS
    level_1: COMPLETE
    level_2: COMPLETE
    level_3: COMPLETE
    statement_of_work_gate: QG-SOW-001
    statement_of_work_state: PASS
    user_authorized_change: LOCAL_REAL_PARALLEL_LANE_EXECUTION

  lifecycle_logging_policy:
    contract: governance/execution-lifecycle-logging.yaml
    gate: QG-LOG-001
    every_start_requires_exact_task: true
    worker_required_events: [LANE_INIT_START, LANE_INIT_END, LANE_SERVICE_START, LANE_SERVICE_END, LANE_CLOSE_END]
    individual_lane_logs_transient: true
    invocation_aggregate_required: true
    transient_lane_logs_deleted_after_verified_aggregation: true

  real_lane_dispatch_policy:
    governance: governance/lane-execution.yaml
    gate: QG-LANE-001
    authoritative_dispatch_ssot: backlog/runtime/BL-001/lane-dispatch.yaml
    execution_status_ssot: backlog/runtime/BL-001/local-execution.yaml
    backend: LOCAL_PROCESS_POOL
    executor: automation/local-lane-executor.py
    worker: automation/local-lane-worker.py
    windows_fire_script: automation/fire-local-lanes.ps1
    source_repository: vvekselva/CylinderManagement
    source_checkout_mode: TEMPORARY_DETACHED_GIT_WORKTREE_AT_FROZEN_COMMIT
    configured_lanes: 10
    max_parallel_workers: 10
    external_service_dependency: NONE
    expected_concurrency_formula: min(configured_lanes, safe_ready_tasks)
    distinct_lane_ids_are_not_concurrency: true
    measure_peak_worker_processes_alive: true
    measure_peak_service_concurrent_lanes: true
    measure_average_service_concurrent_lanes: true
    worker_role: READ_ONLY_SOURCE_EVIDENCE_COLLECTION
    final_trace_decision_owner: CONTROL_REPOSITORY_ORCHESTRATOR

  invocation_utilization_policy:
    objective: MAXIMIZE_MEASURED_SAFE_LOCAL_CONCURRENCY
    one_primary_coordinator: true
    one_active_backlog_item: true
    fixed_small_endpoint_batch_limit: false
    fill_available_real_workers_when_safe: true
    reuse_proved_relationships_only_when_source_confirms_same_path: true
    stop_conditions:
      - NO_ELIGIBLE_INDEPENDENT_WORK_REMAINS
      - HARD_BLOCKER_PREVENTS_FURTHER_ELIGIBLE_WORK
      - RESOURCE_OR_SHARED_FILE_LOCK_PREVENTS_SAFE_PARALLELISM
      - LOCAL_SOURCE_CHECKOUT_NOT_AVAILABLE
      - FROZEN_SOURCE_COMMIT_NOT_AVAILABLE_LOCALLY
      - LOCAL_WORKER_EXECUTION_FAILED
      - INVOCATION_OR_TOOL_EXECUTION_LIMIT_REACHED
      - WORK_UNIT_COMPLETION_BOUNDARY_REACHED

  work_units:
    - id: WU-BL001-001
      name: Complete Source Repository Check
      phase: EXECUTE_SOURCE_CHECK
      state: READY
      parallel: true
      executor: LOCAL_PROCESS_POOL_PLUS_CONTROL_ORCHESTRATOR_VALIDATION
      parallel_scope: INDEPENDENT_CONTROLLER_OR_ENDPOINT_FAMILIES_ONLY
      max_parallel_lanes: 10
      batching_strategy: CONTROLLER_SERVICE_FAMILY
      lane_assignment_ssot: backlog/runtime/BL-001/lane-status.yaml
      lane_dispatch_ssot: backlog/runtime/BL-001/lane-dispatch.yaml
      local_execution_ssot: backlog/runtime/BL-001/local-execution.yaml
      real_worker_governance: governance/lane-execution.yaml
      real_lane_gate: QG-LANE-001
      lifecycle_logging_contract: governance/execution-lifecycle-logging.yaml
      worker_input: worker/inputs/WI-0004.yaml
      expected_result: worker/results/WI-0004.yaml
      result_contract: workflows/WF-001-controller-traceability/source-check-output-contract.yaml
      execution_sequence:
        - orchestrator selects safe independent not-yet-examined controller or endpoint families
        - orchestrator writes authoritative lane-dispatch.yaml
        - user or local scheduler fires automation/fire-local-lanes.ps1 against the local CylinderManagement checkout
        - local executor verifies zero leftover lane logs and verifies the frozen source commit exists locally
        - local executor creates a temporary detached Git worktree at the exact frozen source commit without changing the active checkout
        - local executor starts up to ten independent OS worker processes
        - every worker logs INIT SERVICE CLOSE boundaries with exact task identity and reads only the temporary frozen-baseline worktree
        - local executor updates lane-status.yaml and local-execution.yaml from process state and heartbeat evidence
        - local executor measures peak worker-process overlap and peak/average SERVICE concurrency
        - local executor aggregates evidence, verifies and deletes transient individual lane logs, and rescans to zero
        - local executor writes one durable lane-dispatch aggregate and closes local-execution.yaml
        - control Orchestrator validates endpoint-by-endpoint source evidence and updates canonical trace states
      evidence_rule: >-
        Each endpoint must still be traced independently to source-proved final dependency evidence. Local-worker dependency candidates are not final evidence until the control Orchestrator confirms the actual source call path. No naming inference or guessing is allowed.
      result_acceptance_rule: >-
        Canonical Source Check result is accepted only when its run is CLOSED, result contract validates, QG-LOG-001 is satisfied and endpoint trace-result coverage reaches 100 percent. QG-LANE-001 governs claims of real parallel utilization; correct source evidence remains usable if utilization is under target.
      completion_rule: Worker result COMPLETED, run CLOSED, contract valid, lifecycle logging valid, coverage 100 percent.

    - id: WU-BL001-002
      name: Build Traceability Matrix Artifacts
      phase: BUILD_MATRIX
      state: WAITING_FOR_DEPENDENCY
      needs: [WU-BL001-001]
      executor: ORCHESTRATION_LANE
      input: worker/results/WI-0004.yaml
      source_read_allowed: false
      outputs: [traceability/source-repository-check.md, traceability/controller-inventory.md, traceability/endpoint-inventory.md, traceability/controller-traceability.md, traceability/unresolved-traceability.md]

    - id: WU-BL001-003
      name: Validate Traceability Gates
      phase: VALIDATE
      state: WAITING_FOR_DEPENDENCY
      needs: [WU-BL001-002]
      executor: ORCHESTRATOR
      completion_rule: Every exposed endpoint appears exactly once; coverage 100 percent; evidence/unresolved/logging rules pass.

    - id: WU-BL001-004
      name: Register Baseline and Close Backlog Item
      phase: CLOSE
      state: WAITING_FOR_DEPENDENCY
      needs: [WU-BL001-003]
      executor: ORCHESTRATOR
      outputs: [sync/source-artifact-sync-register.yaml, logs/automation-story.md]
      completion_rule: Source-artifact baseline registered, all required runs/logs closed, automatic gates pass, and required user acceptance is obtained.
