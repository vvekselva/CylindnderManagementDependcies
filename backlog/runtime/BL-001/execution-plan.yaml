execution_plan:
  backlog_item: BL-001
  version: 11
  state: PLANNED
  generated_by: ORCHESTRATOR
  completion_path: backlog/paths/BL-001-traceability.yaml
  source_baseline: 3ae6e61442132d94a307275b08dd65fcef228d89
  architecture: architecture/self-reliant-e2e-execution.md
  self_reliant_governance: governance/self-reliant-execution.yaml
  incremental_matrix_workflow: workflows/WF-002-incremental-traceability-matrix.yaml

  architecture_separation:
    github_role: VERSION_CONTROL_AND_DURABLE_PERSISTENCE_ONLY
    automation_tool_role: ORCHESTRATION_SOURCE_STAGING_EXECUTION_RECOVERY_VALIDATION_MATRIX_PROJECTION_AND_SYNC
    execution_backend: LOCAL_PROCESS_POOL
    default_source_provider: ORCHESTRATOR_STAGED_SNAPSHOT
    fallback_source_provider: LOCAL_GIT_CHECKOUT
    github_actions_required: false
    preexisting_local_source_checkout_required: false

  planning_authorization:
    gate: QG-SSOT-001
    state: PASS
    level_1: COMPLETE
    level_2: COMPLETE
    level_3: COMPLETE_AFTER_SELF_RELIANT_RECONCILIATION
    statement_of_work_gate: QG-SOW-001
    statement_of_work_state: PASS

  source_execution_policy:
    source_gate: QG-SOURCE-001
    governance: governance/source-provider.yaml
    source_layout: repository/source-layout.yaml
    staged_executor: automation/staged-lane-executor-v3.py
    staged_worker: automation/staged-lane-worker-v3.py
    source_stage_max_iterations: 8
    source_requests: [missing_source_requests, missing_binding_requests]
    source_closure_success: SOURCE_CLOSURE_COMPLETE
    source_stall_state: SOURCE_RESOLUTION_STALLED
    interface_binding_requires_source_validation: true
    worker_has_github_credentials: false

  incremental_matrix_policy:
    enabled_during_source_check: true
    workflow: workflows/WF-002-incremental-traceability-matrix.yaml
    matrix_artifact: traceability/controller-traceability.md
    unresolved_artifact: traceability/unresolved-traceability.md
    progress_artifact: traceability/matrix-progress.yaml
    row_key: HTTP_METHOD_PLUS_PATH
    update_trigger: EACH_PRIMARY_ORCHESTRATOR_ACCEPTED_ENDPOINT_TRACE
    worker_may_write_matrix: false
    matrix_state_while_coverage_below_100_percent: INCREMENTAL_PARTIAL
    finalization_work_unit: WU-BL001-002
    finalization_rule: >-
      WU-BL001-002 reconciles and finalizes the already-growing matrix after canonical Source Check reaches 100 percent;
      it does not wait until then to create the first rows.

  lifecycle_logging_policy:
    contract: governance/execution-lifecycle-logging.yaml
    gate: QG-LOG-001
    worker_required_events: [LANE_INIT_START, LANE_INIT_END, LANE_SERVICE_START, LANE_SERVICE_END, LANE_CLOSE_END]
    heartbeat_required: true
    individual_lane_logs_transient: true
    invocation_aggregate_required: true
    transient_lane_logs_deleted_after_verified_aggregation: true

  real_lane_dispatch_policy:
    governance: governance/lane-execution.yaml
    gate: QG-LANE-001
    authoritative_dispatch_ssot: backlog/runtime/BL-001/lane-dispatch.yaml
    execution_status_ssot: backlog/runtime/BL-001/local-execution.yaml
    backend: LOCAL_PROCESS_POOL
    configured_lanes: 10
    max_parallel_workers: 10
    expected_concurrency_formula: min(configured_lanes, safe_ready_tasks)
    natural_service_overlap_is_gate_metric: true
    artificial_delay_to_pass_gate_prohibited: true
    backend_capacity_probe_peak: 10
    worker_role: READ_ONLY_SOURCE_EVIDENCE_COLLECTION
    final_trace_decision_owner: PRIMARY_ORCHESTRATOR

  recovery_and_idempotency_policy:
    gate: QG-RECOVERY-001
    execution_journal_required: true
    dispatch_fingerprint_required: true
    same_fingerprint_pending_sync: RETRY_SYNC_ONLY
    same_fingerprint_closed_waiting_validation: VALIDATE_EXISTING_EVIDENCE
    interrupted_running_no_live_workers: RECOVER_AND_REJECT_PARTIAL_OUTPUT
    changed_fingerprint: START_NEW_EXECUTION_GENERATION
    already_closed_synced: NOOP_ALREADY_COMMITTED
    matrix_upsert_idempotency: SAME_METHOD_PATH_AND_ACCEPTED_EVIDENCE_FINGERPRINT_IS_UPDATE_OR_NOOP_NOT_DUPLICATE

  invocation_utilization_policy:
    objective: MAXIMIZE_NATURAL_SAFE_LOCAL_CONCURRENCY
    one_primary_coordinator: true
    one_active_backlog_item: true
    fixed_small_endpoint_batch_limit: false
    fill_available_real_workers_when_safe: true
    stop_conditions:
      - NO_ELIGIBLE_INDEPENDENT_WORK_REMAINS
      - HARD_BLOCKER_PREVENTS_FURTHER_ELIGIBLE_WORK
      - SOURCE_RESOLUTION_STALLED
      - SOURCE_RESOLUTION_LIMIT_REACHED
      - SOURCE_INTEGRITY_OR_BINDING_FAILURE
      - LOCAL_WORKER_EXECUTION_FAILED
      - INVOCATION_OR_TOOL_EXECUTION_LIMIT_REACHED
      - WORK_UNIT_COMPLETION_BOUNDARY_REACHED

  work_units:
    - id: WU-BL001-001
      name: Complete Source Repository Check And Maintain Incremental Matrix
      phase: EXECUTE_SOURCE_CHECK_AND_PROJECT_MATRIX
      state: READY
      parallel: true
      executor: AUTOMATION_TOOL_SELF_RELIANT_SOURCE_STAGER_PLUS_LOCAL_PROCESS_POOL_PLUS_ORCHESTRATOR_VALIDATION
      parallel_scope: INDEPENDENT_CONTROLLER_OR_ENDPOINT_FAMILIES_ONLY
      max_parallel_lanes: 10
      lane_assignment_ssot: backlog/runtime/BL-001/lane-status.yaml
      lane_dispatch_ssot: backlog/runtime/BL-001/lane-dispatch.yaml
      local_execution_ssot: backlog/runtime/BL-001/local-execution.yaml
      worker_input: worker/inputs/WI-0004.yaml
      expected_result: worker/results/WI-0004.yaml
      result_contract: workflows/WF-001-controller-traceability/source-check-output-contract.yaml
      incremental_matrix_outputs:
        - traceability/controller-traceability.md
        - traceability/unresolved-traceability.md
        - traceability/matrix-progress.yaml
      execution_sequence:
        - Orchestrator reads authoritative Level 1/2/3 state and inspects any prior execution journal
        - recovery/idempotency rules decide sync-only validation-reuse recovery no-op or new execution
        - Orchestrator selects safe independent not-yet-examined controller or endpoint families
        - Orchestrator writes authoritative lane-dispatch.yaml and dispatch fingerprint
        - Source Provider Manager prefers ORCHESTRATOR_STAGED_SNAPSHOT
        - Orchestrator resolves controller/source requests through repository/source-layout.yaml and fetches exact files at the frozen commit
        - staged snapshot manifest records repository baseline path Git blob SHA and source bindings
        - QG-SOURCE-001 verifies all controller roots before discovery SERVICE
        - staged executor starts up to ten independent OS worker processes
        - workers verify blobs/bindings and emit lifecycle heartbeat and evidence only
        - workers return explicit missing_source_requests and missing_binding_requests
        - Orchestrator stages/rebinds exact requests and repeats discovery while the request set changes and source closure advances
        - source loop stops successfully only at SOURCE_CLOSURE_COMPLETE or fail-closed on stall/iteration limit
        - executor aggregates lifecycle/evidence deletes transient lane logs and rescans to zero
        - QG-LANE-001 records natural SERVICE overlap separately from source correctness
        - Primary Orchestrator validates endpoint-by-endpoint source evidence and assigns canonical COMPLETE UNRESOLVED BLOCKED or FAILED only when proved
        - immediately after each accepted endpoint trace the Orchestrator upserts its HTTP method/path row into traceability/controller-traceability.md
        - unresolved blocked or failed accepted rows are synchronized with traceability/unresolved-traceability.md
        - traceability/matrix-progress.yaml is updated in the same accepted synchronization checkpoint
        - source analysis continues while the matrix remains INCREMENTAL_PARTIAL until canonical endpoint trace-result coverage reaches 100 percent
        - accepted runtime evidence and incremental matrix updates are synchronized to GitHub; sync failure becomes PENDING_SYNC without worker rerun
      evidence_rule: >-
        Each endpoint is traced independently to source-proved final dependency evidence. Source/binding candidates are not
        final evidence until the Primary Orchestrator confirms the actual call path. No naming inference or guessing is allowed.
      matrix_rule: >-
        Matrix rows are created as accepted traces become available, but only Primary-Orchestrator-validated evidence may
        become matrix truth. Historical accepted rows may be backfilled only from durable accepted evidence.
      result_acceptance_rule: >-
        Canonical Source Check result is accepted only when its run is CLOSED, result contract validates, QG-LOG-001 is
        satisfied and endpoint trace-result coverage reaches 100 percent. QG-SOURCE-001 controls source integrity/closure;
        QG-LANE-001 controls parallel-utilization claims; neither auto-accepts trace results.
      completion_rule: Worker result COMPLETED, run CLOSED, contract valid, lifecycle logging valid, coverage 100 percent.

    - id: WU-BL001-002
      name: Finalize And Reconcile Traceability Matrix Artifacts
      phase: FINALIZE_MATRIX
      state: WAITING_FOR_DEPENDENCY
      needs: [WU-BL001-001]
      executor: ORCHESTRATION_LANE
      inputs:
        - worker/results/WI-0004.yaml
        - traceability/controller-traceability.md
        - traceability/unresolved-traceability.md
        - traceability/matrix-progress.yaml
        - traceability/controller-inventory.md
        - traceability/endpoint-inventory.md
      source_read_allowed: false
      outputs:
        - traceability/source-repository-check.md
        - traceability/controller-inventory.md
        - traceability/endpoint-inventory.md
        - traceability/controller-traceability.md
        - traceability/unresolved-traceability.md
        - traceability/matrix-progress.yaml
      completion_rule: >-
        Reconcile the incremental matrix against canonical Source Check and inventories; every caller-visible endpoint appears
        exactly once by HTTP method/path, all evidence references are valid, unresolved accounting reconciles, and matrix state
        becomes READY_FOR_FINAL_RECONCILIATION or FINAL_VALIDATED only according to the defined traceability gates.

    - id: WU-BL001-003
      name: Validate Traceability Gates From Final Matrix
      phase: VALIDATE
      state: WAITING_FOR_DEPENDENCY
      needs: [WU-BL001-002]
      executor: ORCHESTRATOR
      principal_input: traceability/controller-traceability.md
      completion_rule: Every exposed endpoint appears exactly once; coverage 100 percent; evidence/unresolved/logging/matrix rules pass.

    - id: WU-BL001-004
      name: Register Source And Matrix Baseline And Close Backlog Item
      phase: CLOSE
      state: WAITING_FOR_DEPENDENCY
      needs: [WU-BL001-003]
      executor: ORCHESTRATOR
      inputs:
        - traceability/controller-traceability.md
        - traceability/matrix-progress.yaml
      outputs: [sync/source-artifact-sync-register.yaml, logs/automation-story.md]
      completion_rule: Source/matrix baseline registered, all required runs/logs closed, automatic gates pass, and required user acceptance is obtained.
