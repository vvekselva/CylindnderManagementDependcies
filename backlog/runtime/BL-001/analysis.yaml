    exposed_controller_customer_spot_check:
      state: PROVED
      source: cylindermanagement.web/src/main/java/com/sreyas/datamatics/cylindermanagement/web/controller/CustomerSpotCylinderCheckController.java
      class_annotation: '@Controller'
      class_mapping: /customer-spot-cylinder-check
      endpoints:
        - http_method: GET
          path: /customer-spot-cylinder-check/fetch
          handler: fetch
        - http_method: POST
          path: /customer-spot-cylinder-check/submit
          handler: submit
      proven_service_handoff:
        service: CustomerSpotCylinderCheckService
        calls:
          - submitSpotCheck(requestDto)
          - findActiveSpotCheckBooksForLoad(vehicleLoadId)

    exposed_controller_register_customer:
      state: PROVED
      source: cylindermanagement.web/src/main/java/com/sreyas/datamatics/cylindermanagement/web/controller/UC01RegisterCustomerController.java
      class_annotation: '@Controller'
      endpoints:
        - http_method: GET
          path: /registerCustomer
          handler: doGet
        - http_method: POST
          path: /registerCustomer
          handler: doPost
      proven_immediate_handoffs:
        - component: ICylinderManagementApplicationMediator<UC01RegisterCustomerRequestDto, UC01RegisterCustomerResponseDto>
          call: uC01RegisterCustomerMediator.invokeServices(requestDto)
          used_by: POST /registerCustomer
        - component: LookupDataCache
          call: lookupDataCache.getAddressTypes()
          used_by: GET /registerCustomer and validation-error rendering
      finding: >-
        UC01RegisterCustomerController is source-proved as an exposed MVC Controller with two
        caller-visible endpoints. Its immediate mediator/cache handoffs are proved, but the POST
        endpoint has not yet been traced through the mediator to its final dependency.

    exposed_rest_customer_search:
      state: PROVED
      source: cylindermanagement.web/src/main/java/com/sreyas/datamatics/cylindermanagement/web/rest/RestfulCustomerServices.java
      class_annotation: '@RestController'
      class_mapping: /search/customer
      endpoints:
        - http_method: GET
          path: /search/customer/{searchText}
          handler: getCustomers
      proven_immediate_handoff:
        component: ICylinderManagementApplicationSearchService<CylinderManagementApplicationRequestDto, CustomerSearchResponseDto>
        call: customerSearchService.searchWithText(requestDto, null)
      finding: >-
        RestfulCustomerServices proves that the web.rest candidate package contains actual REST exposure.
        Its one customer-search endpoint and immediate search-service handoff are proved, while its final
        persistence dependency remains to be traced.

    current_proved_exposure_checkpoint:
      proved_exposed_components: 3
      proved_endpoints: 5
      candidate_components_remaining_to_classify: 59
      note: >-
        These are progress counters only. They are not the final exposed-component or endpoint totals and
        cannot be used to claim Traceability coverage until all 62 candidates have been classified.

