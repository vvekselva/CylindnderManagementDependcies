  platform_blockers:
    - id: PB-BL001-001
      state: OPEN
      affects_gate: QG-LANE-001
      category: SOURCE_REPOSITORY_ACTIONS_NOT_STARTING
      summary: >-
        The real worker backend has been moved into the private CylinderManagement repository on
        branch automation/lane-matrix, but the source-local push-triggered GitHub Actions workflow
        has not started or self-reported a run ID.
      proved_facts:
        - Control-side matrix run 32638659581 spawned ten matrix worker jobs.
        - All ten control-side jobs failed before service while cloning private CylinderManagement because the control repository GITHUB_TOKEN has no cross-repository private access.
        - The control-side auto-trigger was retired to prevent repeated known failures.
        - CylinderManagement branch automation/lane-matrix was created from the frozen source baseline.
        - The source-local workflow, worker scripts and ten-task dispatch copy are installed on that branch.
        - No automation/matrix-execution.yaml has been created by the source workflow after the dispatch push.
      not_yet_proved: >-
        Whether source-repository Actions is disabled, restricted by repository/account policy, or another
        workflow-start policy is preventing the push workflow from starting. The framework does not guess.
      impact: >-
        BL-001 source tracing itself still has eligible work, but the newly required real parallel worker
        backend cannot yet demonstrate or deliver parallel service execution. QG-LANE-001 cannot PASS.
      next_action: >-
        Verify that GitHub Actions is enabled/allowed for vvekselva/CylinderManagement and permits GitHub-owned
        actions (checkout, setup-python, upload/download-artifact). Then re-trigger automation/lane-dispatch.yaml
        on automation/lane-matrix and wait for automation/matrix-execution.yaml to record the run ID.
      alternative: >-
        A cross-repository PAT/GitHub App token secret in the control repository could also grant private source
        access, but the source-local execution design avoids needing a new secret and is preferred.

