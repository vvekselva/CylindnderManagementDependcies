decisions:
  - id: DEC-BL001-001
    state: APPLIED
    decision: COMPLETE_SOURCE_CHECK_BEFORE_MATRIX
    reason: The first trusted traceability baseline must not be assembled from partial source-check batches.
  - id: DEC-BL001-002
    state: APPLIED
    decision: SOURCE_CHECK_OUTPUT_IS_MATRIX_INPUT
    reason: The canonical Worker YAML output is the formal input to the Orchestrator matrix Work Unit.
  - id: DEC-BL001-003
    state: APPLIED
    decision: MAXIMIZE_SAFE_LANE_UTILIZATION_WITHIN_EACH_COORDINATOR_INVOCATION
    reason: >-
      WU-BL001-001 may partition independent controller/endpoint families across up to ten lanes,
      refill released lanes during the same invocation, and continue until no eligible independent work
      remains or a documented stop condition is reached. Quality gates, frozen-source evidence and
      no-guessing rules remain unchanged.
  - id: DEC-BL001-004
    state: APPLIED
    decision: MANDATORY_ORCHESTRATOR_AND_LANE_LIFECYCLE_BOUNDARY_LOGGING
    reason: >-
      New executions must persist ORCHESTRATOR_INVOCATION_START before analysis/execution and
      ORCHESTRATOR_INVOCATION_END after all started lanes close and runtime is synchronized. Each
      lane logs INIT start/end, SERVICE start/end and CLOSE end. Every START identifies the exact task.
  - id: DEC-BL001-005
    state: APPLIED
    decision: INDIVIDUAL_LANE_LOGS_ARE_TRANSIENT_AND_MUST_BE_CLEAN_AT_INVOCATION_BOUNDARIES
    reason: >-
      Before a new Orchestrator invocation begins execution, logs/runs must contain zero individual
      lane logs from a previous invocation. Any leftover lane logs force recovery-only aggregation,
      verification and deletion before new work may begin. During Orchestrator closure, every current
      invocation lane log must be accumulated into the invocation aggregate/shared audit, verified as
      represented, and deleted. ORCHESTRATOR_INVOCATION_END is allowed only when the post-cleanup
      individual lane log count is zero.
  - id: DEC-BL001-006
    state: APPLIED
    decision: USER_VISIBLE_RUN_OVER_RUN_EXECUTION_STATISTICS_AND_STALE_CYCLE_TRACKING
    reason: >-
      Level 3 contains execution-statistics.yaml as the machine-readable source for Previous Run versus
      Current/Latest Run progress, lane usage and staleness. BL-001 progress percentage is endpoint trace
      coverage, not an overall project percentage. Completed no-progress invocations increment stale_cycles;
      meaningful progress resets the count to zero.
  - id: DEC-BL001-007
    state: SUPERSEDED
    decision: REPLACE_LOGICAL_ONLY_LANE_PARTICIPATION_WITH_REAL_GITHUB_ACTIONS_MATRIX_WORKERS
    reason: >-
      This decision proved that logical lane participation was not real concurrency, but its GitHub Actions
      execution backend was later removed because the user required the framework not to depend on GitHub Actions.
    superseded_by: DEC-BL001-008
  - id: DEC-BL001-008
    state: APPLIED
    decision: USE_LOCAL_PROCESS_POOL_FOR_REAL_PARALLEL_LANES_WITHOUT_GITHUB_ACTIONS_DEPENDENCY
    reason: >-
      Real parallel execution now uses automation/local-lane-executor.py and automation/local-lane-worker.py,
      fired on Windows through automation/fire-local-lanes.ps1. The executor verifies zero leftover lane logs,
      creates a temporary detached Git worktree at the frozen source commit without switching the active checkout,
      starts up to ten local OS worker processes, tracks PID/heartbeat lane state, measures peak and average SERVICE
      overlap, aggregates evidence, deletes transient lane logs and closes local-execution.yaml. Worker evidence is
      read-only and never auto-classifies endpoint traces; the primary Orchestrator remains final trace-decision owner.
