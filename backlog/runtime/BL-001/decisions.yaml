decisions:
  - id: DEC-BL001-001
    state: APPLIED
    decision: COMPLETE_SOURCE_CHECK_BEFORE_MATRIX
    reason: The first trusted traceability baseline must not be assembled from partial source-check batches.
  - id: DEC-BL001-002
    state: APPLIED
    decision: SOURCE_CHECK_OUTPUT_IS_MATRIX_INPUT
    reason: The canonical Worker YAML output is the formal input to the Orchestrator matrix Work Unit.
  - id: DEC-BL001-003
    state: APPLIED
    decision: MAXIMIZE_SAFE_LANE_UTILIZATION_WITHIN_EACH_COORDINATOR_INVOCATION
    reason: >-
      WU-BL001-001 may partition independent controller/endpoint families across up to ten lanes,
      refill released lanes during the same invocation, and continue until no eligible independent work
      remains or a documented stop condition is reached. Quality gates, frozen-source evidence and
      no-guessing rules remain unchanged.
  - id: DEC-BL001-004
    state: APPLIED
    decision: MANDATORY_ORCHESTRATOR_AND_LANE_LIFECYCLE_BOUNDARY_LOGGING
    reason: >-
      New executions must persist ORCHESTRATOR_INVOCATION_START before analysis/execution and
      ORCHESTRATOR_INVOCATION_END after all started lanes close and runtime is synchronized. Each
      lane logs INIT start/end, SERVICE start/end and CLOSE end. Every START identifies the exact task.
  - id: DEC-BL001-005
    state: APPLIED
    decision: INDIVIDUAL_LANE_LOGS_ARE_TRANSIENT_AND_MUST_BE_CLEAN_AT_INVOCATION_BOUNDARIES
    reason: >-
      Before a new Orchestrator invocation begins execution, logs/runs must contain zero individual
      lane logs from a previous invocation. Any leftover lane logs force recovery-only aggregation,
      verification and deletion before new work may begin. During Orchestrator closure, every current
      invocation lane log must be accumulated into the invocation aggregate/shared audit, verified as
      represented, and deleted. ORCHESTRATOR_INVOCATION_END is allowed only when the post-cleanup
      individual lane log count is zero. This preserves complete audit evidence while preventing stale
      per-lane files from surviving across invocation boundaries.
