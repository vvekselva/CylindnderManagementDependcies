decisions:
  - id: DEC-BL001-001
    state: APPLIED
    decision: COMPLETE_SOURCE_CHECK_BEFORE_MATRIX
    reason: The first trusted traceability baseline must not be assembled from partial source-check batches.
  - id: DEC-BL001-002
    state: APPLIED
    decision: SOURCE_CHECK_OUTPUT_IS_MATRIX_INPUT
    reason: The canonical Worker YAML output is the formal input to the Orchestrator matrix Work Unit.
  - id: DEC-BL001-003
    state: APPLIED
    decision: MAXIMIZE_SAFE_LANE_UTILIZATION_WITHIN_EACH_COORDINATOR_INVOCATION
    reason: >-
      WU-BL001-001 may partition independent controller/endpoint families across up to ten lanes,
      refill released lanes during the same invocation, and continue until no eligible independent work
      remains or a documented stop condition is reached. Quality gates, frozen-source evidence and
      no-guessing rules remain unchanged.
  - id: DEC-BL001-004
    state: APPLIED
    decision: MANDATORY_ORCHESTRATOR_AND_LANE_LIFECYCLE_BOUNDARY_LOGGING
    reason: >-
      The user requires visible audit records before and after every coordinator invocation and at
      each lane lifecycle boundary. New executions must persist ORCHESTRATOR_INVOCATION_START before
      analysis/execution and ORCHESTRATOR_INVOCATION_END after all started lanes close and runtime is
      synchronized. Each lane must log INIT start/end, SERVICE start/end and CLOSE end. A missing
      mandatory pre-phase log blocks that phase; a lane is not released until its close/recovery-close
      record is persisted; execution results require QG-LOG-001 compliance before acceptance.
