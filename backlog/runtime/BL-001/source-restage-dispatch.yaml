  generation_boundary:
    - fetch exact frozen-ref bytes for every slot
    - compute and verify Git blob SHA against source-restage-resolution.yaml
    - write exact repository-relative path into a new execution-host source root
    - update snapshot manifest atomically
    - verify materialized file count and snapshot identity
    - if snapshot identity changed recompute trace dispatch fingerprint
    - once QG-SOURCE-001 permits fire the next safe-independent trace-worker generation immediately
  failure_policy:
    - a failed source slot is explicit and does not allow guessed replacement source
    - complete successful slots and continue independent slots
    - identical unresolved request across two restage generations becomes SOURCE_RESOLUTION_STALLED
