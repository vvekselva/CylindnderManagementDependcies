execution_statistics:
  version: 3
  backlog_item: BL-001
  authoritative_for_run_statistics: true
  purpose: >-
    Machine-readable source for user-visible run statistics. BL-001 percentages are endpoint-trace
    coverage metrics, not overall project-completion percentages. Lane participation and real worker
    concurrency are separate metrics.

  metric_definitions:
    progress_percentage: {formula: examined_for_final_dependency / total_endpoints * 100, meaning: percentage of caller-visible endpoints that have received trace examination}
    complete_percentage: {formula: complete / total_endpoints * 100, meaning: percentage of caller-visible endpoints currently classified COMPLETE}
    distinct_lane_participation_percentage: {formula: distinct_lanes_used / configured_lane_count * 100, configured_lane_count: 10, warning: this is not a concurrency metric}
    peak_concurrent_lanes: {meaning: maximum number of worker execution intervals overlapping at the same time}
    average_concurrent_lanes: {formula: aggregate_worker_seconds / worker_batch_wall_clock_seconds}
    peak_capacity_utilization_percentage: {formula: peak_concurrent_lanes / configured_lane_count * 100}
    expected_concurrent_lanes: {formula: min(configured_lane_count, eligible_safe_independent_tasks)}
    meaningful_progress:
      true_when_any: [examined_for_final_dependency increases, complete count increases, an unresolved/blocked/failed trace is resolved with evidence, a required gate or Work Unit advances, a required artifact is created or validated]
    stale_cycle: {definition: one completed Orchestrator invocation in which no meaningful-progress indicator advances, stale_when: consecutive_no_progress_cycles > 0}

  comparison_window:
    previous_run:
      attempt: 27
      invocation_id: INVOCATION-20260823-160000
