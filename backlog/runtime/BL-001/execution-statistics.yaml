    workflow: .github/workflows/lane-matrix-dispatch.yml
    queue: backlog/runtime/BL-001/lane-dispatch.yaml
    seed_batch_safe_ready_tasks: 10
    expected_concurrent_lanes: 10
    state: PENDING_FIRST_CURRENT_WORKFLOW_EVIDENCE
    required_summary_fields:
      - distinct_lanes_used
      - peak_concurrent_lanes
      - average_concurrent_lanes
      - peak_capacity_utilization_percentage
      - worker_failures
      - qg_lane_001_state

