      endpoints_examined_added: 10
      distinct_lanes_used: 3
      distinct_lane_participation_percentage: 30.00
      peak_concurrent_lanes: 1
      average_concurrent_lanes: 0.95
      peak_capacity_utilization_percentage: 10.00
      real_concurrency_metric_available: true
      concurrency_basis: >-
        Attempt 27 lane intervals in the durable invocation log do not overlap: LANE-01 completed before
        LANE-02 began, and LANE-02 completed before LANE-03 began. Peak measured/inferred concurrency is 1.
      endpoints_per_lane: 3.33
      invocation_start: '2026-08-23T16:00:00+05:30'
      invocation_end: '2026-08-23T16:35:00+05:30'
