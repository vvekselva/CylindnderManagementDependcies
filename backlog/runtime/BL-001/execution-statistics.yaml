    last_meaningful_progress_invocation: INVOCATION-20260823-175300
    last_meaningful_progress_summary: Matrix dispatch generation 3 synchronized and external lane-state semantics corrected
    current_status: ACTIVE_BACKLOG_WAITING_FOR_SOURCE_ACTIONS_EVIDENCE

  update_rules:
    - update at ORCHESTRATOR_INVOCATION_START with new current-run baseline and zero lanes used
    - update at meaningful synchronized checkpoints while ACTIVE
    - for matrix dispatch consume only lane-dispatch-summary.yaml from lane-dispatch-aggregate after summarize completes
    - never use distinct_lanes_used as a substitute for concurrency
    - do not infer ASSIGNED WORKING WAITING or measured concurrency without workflow/job evidence
    - finalize at ORCHESTRATOR_INVOCATION_END after runtime synchronization
    - increment stale cycles only for completed invocations with no meaningful progress
    - reset stale cycles to zero on completed meaningful progress
    - TaskStatus.md statistics table is derived from this file and must not override it
