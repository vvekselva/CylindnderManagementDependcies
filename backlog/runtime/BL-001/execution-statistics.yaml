execution_statistics:
  version: 22
  backlog_item: BL-001
  authoritative_for_run_statistics: true
  purpose: >-
    Machine-readable source for endpoint-trace coverage and self-reliant execution statistics. BL-001 percentages are
    endpoint-trace coverage metrics, not overall project-completion percentages. Source closure, natural production
    concurrency and backend capacity are separate metrics.

  metric_definitions:
    progress_percentage: {formula: examined_for_final_dependency / total_endpoints * 100, meaning: endpoint trace examination coverage}
    complete_percentage: {formula: complete / total_endpoints * 100, meaning: endpoint traces currently COMPLETE}
    peak_concurrent_lanes: {meaning: maximum natural overlapping LANE_SERVICE_START to LANE_SERVICE_END intervals}
    average_concurrent_lanes: {formula: aggregate natural SERVICE seconds / SERVICE batch wall-clock seconds}
    peak_capacity_utilization_percentage: {formula: peak_concurrent_lanes / configured_lane_count * 100}
    expected_concurrent_lanes: {formula: min(configured_lane_count, eligible_safe_independent_tasks)}
    backend_capacity_probe: {meaning: isolated executor capability measurement, not a substitute for natural production QG-LANE-001}
    source_closure_complete: {meaning: zero missing_source_requests and zero missing_binding_requests for the batch}

