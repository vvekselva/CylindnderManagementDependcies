execution_statistics:
  version: 2
  backlog_item: BL-001
  authoritative_for_run_statistics: true
  purpose: >-
    Machine-readable source for user-visible run statistics. BL-001 percentages are endpoint-trace
    coverage metrics, not overall project-completion percentages. Lane participation and real worker
    concurrency are separate metrics.

  metric_definitions:
    progress_percentage:
      formula: examined_for_final_dependency / total_endpoints * 100
      meaning: percentage of caller-visible endpoints that have received trace examination
    complete_percentage:
      formula: complete / total_endpoints * 100
      meaning: percentage of caller-visible endpoints currently classified COMPLETE
    distinct_lane_participation_percentage:
      formula: distinct_lanes_used / configured_lane_count * 100
      configured_lane_count: 10
      warning: this is not a concurrency metric
    peak_concurrent_lanes:
      meaning: maximum number of worker execution intervals overlapping at the same time
    average_concurrent_lanes:
      formula: aggregate_worker_seconds / worker_batch_wall_clock_seconds
    peak_capacity_utilization_percentage:
      formula: peak_concurrent_lanes / configured_lane_count * 100
    expected_concurrent_lanes:
      formula: min(configured_lane_count, eligible_safe_independent_tasks)
    endpoints_per_lane:
      formula: endpoints_examined_added / distinct_lanes_used
    meaningful_progress:
      true_when_any:
        - examined_for_final_dependency increases
        - complete count increases
        - an unresolved/blocked/failed trace is resolved with evidence
        - a required gate or Work Unit advances
        - a required artifact is created or validated
    stale_cycle:
      definition: one completed Orchestrator invocation in which no meaningful-progress indicator advances
      stale_when: consecutive_no_progress_cycles > 0

  comparison_window:
    previous_run:
      attempt: 26
      invocation_id: INVOCATION-20260823-145512
      state: CLOSED
      result: PARTIAL
      start_checkpoint_examined: 22
      end_checkpoint_examined: 27
      total_endpoints: 134
      progress_percentage: 20.15
      complete: 25
      complete_percentage: 18.66
      unresolved: 2
      blocked: 0
      failed: 0
      endpoints_examined_added: 5
      distinct_lanes_used: 3
      distinct_lane_participation_percentage: 30.00
      peak_concurrent_lanes: null
      average_concurrent_lanes: null
      peak_capacity_utilization_percentage: null
      real_concurrency_metric_available: false
      endpoints_per_lane: 1.67
      invocation_start: '2026-08-23T14:55:12+05:30'
      invocation_end: '2026-08-23T15:11:30+05:30'
      stop_condition: INVOCATION_OR_TOOL_EXECUTION_LIMIT_REACHED
      meaningful_progress: true
      stale: false
      stale_cycles: 0
      evidence: logs/runs/INVOCATION-20260823-145512.md

    current_or_latest_run:
      semantics: >-
        When an invocation is ACTIVE this record is the live current-run checkpoint. When BETWEEN_INVOCATIONS
        it represents the latest closed invocation checkpoint.
      attempt: 27
      invocation_id: INVOCATION-20260823-160000
      invocation_state: CLOSED
      runtime_state: BETWEEN_INVOCATIONS
      result: PARTIAL
      start_checkpoint_examined: 27
