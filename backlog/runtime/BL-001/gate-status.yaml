      The first post-activation Orchestrator invocation must persist ORCHESTRATOR_INVOCATION_START
      before analysis/execution, produce all applicable ordered lane lifecycle logs, leave no orphan
      OPEN lane event, release lanes only after persisted CLOSE/recovery-close, synchronize runtime,
      and persist ORCHESTRATOR_INVOCATION_END. The resulting evidence must reconcile with lane-status.
    result_acceptance_allowed_for_new_runs: false
    reason: >-
      The logging contract and execution/scheduler rules are installed, but no post-activation
      invocation has yet demonstrated the complete lifecycle sequence. QG-LOG-001 therefore
      remains IN_PROGRESS rather than being guessed PASS.

