  rules:
    - every task is independent and read-only against the frozen source baseline
    - one task is assigned to one lane for one process-pool execution
    - duplicate lanes and task IDs are rejected before fire
    - before SERVICE the selected source provider must pass QG-SOURCE-001 for the controller root
    - staged files require manifest repository baseline path and exact Git blob SHA
    - workers recompute each staged file Git blob hash before reading it
    - missing source and binding requests remain explicit and are never guessed
    - workers never access GitHub directly
    - source staging is bounded to eight iterations and fails closed on no-progress request repetition
    - up to ten local OS worker processes may run concurrently
    - every worker emits INIT SERVICE CLOSE lifecycle plus heartbeat evidence with exact task identity
    - worker evidence does not automatically classify an endpoint COMPLETE
    - QG-LANE-001 uses measured natural SERVICE overlap not lane labels or process creation
    - individual lane logs are transient and are aggregated verified deleted and rescanned to zero before closure
    - execution journal and dispatch fingerprint drive idempotent recovery and PENDING_SYNC handling

