lane_status:
  version: 2
  backlog_item: BL-001
  authoritative: true
  purpose: >-
    Provide the single point of truth for what each orchestration lane is doing now.
    This file records current lane assignment, task, Worker Input, run, heartbeat,
    blocker and release state. Historical run logs do not replace this live runtime SSOT.

  current_backlog_state: PARTIAL
  current_work_unit: WU-BL001-001
  source_baseline: 3ae6e61442132d94a307275b08dd65fcef228d89
  last_reconciled_attempt: 25
  last_reconciled_run: RUN-WI0004-20260823-025
  invocation_state: BETWEEN_INVOCATIONS
  current_idle_reason: LAST_RECONCILED_RUN_CLOSED_NO_ACTIVE_COORDINATOR_INVOCATION

  utilization_policy:
    objective: MAXIMIZE_SAFE_PROGRESS_PER_COORDINATOR_INVOCATION
    fixed_small_batch_limit: false
    max_parallel_lanes: 10
    batching_strategy: CONTROLLER_SERVICE_FAMILY
    fill_available_lanes_when_safe: true
    refill_released_lanes_within_same_invocation: true
    idle_between_invocations_is_valid: true
    idle_during_active_invocation_requires_reason_when_eligible_work_exists: true
    do_not_parallelize:
      - DEPENDENT_WORK
      - CONFLICTING_SHARED_FILE_WRITES
      - RESOURCE_LOCK_CONFLICTS
      - WORK_REQUIRING_UNPROVED_DEPENDENCY_ASSUMPTIONS
    stop_conditions:
      - NO_ELIGIBLE_INDEPENDENT_WORK_REMAINS
      - HARD_BLOCKER_PREVENTS_FURTHER_ELIGIBLE_WORK
      - RESOURCE_OR_SHARED_FILE_LOCK_PREVENTS_SAFE_PARALLELISM
      - INVOCATION_OR_TOOL_EXECUTION_LIMIT_REACHED
      - WORK_UNIT_COMPLETION_BOUNDARY_REACHED

  policy:
    one_active_job_per_lane: true
    coordinator_is_not_a_lane: true
    generic_worker_consumes_orchestration_lane: false
    valid_states:
      - IDLE
      - ASSIGNED
      - INITIALIZING
      - WORKING
      - BLOCKED
      - WAITING
      - CLOSING
      - STALE
    assignment_requirements:
      - non-IDLE lane must identify its work_unit and task
      - WORKING lane must identify its run_id and last_heartbeat
      - BLOCKED lane must contain a plain-English blocker
      - a CLOSED run must release its lane unless another assignment has already replaced it
      - summary counts must reconcile exactly to the ten lane records
      - during an active invocation the coordinator should fill and refill safe independent lanes while eligible work remains

