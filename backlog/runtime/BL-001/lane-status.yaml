lane_status:
  version: 3
  backlog_item: BL-001
  authoritative: true
  purpose: >-
    Provide the single point of truth for what each orchestration lane is doing now.
    This file records current lane assignment, task, Worker Input, run, heartbeat,
    blocker, lifecycle-log boundary and release state. Historical run logs do not replace
    this live runtime SSOT.

  current_backlog_state: PARTIAL
  current_work_unit: WU-BL001-001
  source_baseline: 3ae6e61442132d94a307275b08dd65fcef228d89
  last_reconciled_attempt: 25
  last_reconciled_run: RUN-WI0004-20260823-025
  invocation_state: ACTIVE
  current_invocation: INVOCATION-20260823-145512
  current_idle_reason: SAFE_CAPACITY_NOT_YET_FILLED_DURING_INITIAL_ASSIGNMENT

  lifecycle_logging:
    contract: governance/execution-lifecycle-logging.yaml
    gate: QG-LOG-001
    effective_for_next_invocation: true
    invocation_start_required_before_analysis_or_execution: true
    required_lane_event_order: [LANE_INIT_START, LANE_INIT_END, LANE_SERVICE_START, LANE_SERVICE_END, LANE_CLOSE_END]
    blocked_before_service_exception: >-
      SERVICE_START and SERVICE_END are omitted only when LANE_INIT_END is
      BLOCKED_BEFORE_SERVICE. close() and LANE_CLOSE_END remain mandatory.
    lane_release_requires_persisted_close_log: true
    result_acceptance_requires_qg_log_001: true

  utilization_policy:
    objective: MAXIMIZE_SAFE_PROGRESS_PER_COORDINATOR_INVOCATION
    fixed_small_batch_limit: false
    max_parallel_lanes: 10
    batching_strategy: CONTROLLER_SERVICE_FAMILY
    fill_available_lanes_when_safe: true
    refill_released_lanes_within_same_invocation: true
    idle_between_invocations_is_valid: true
    idle_during_active_invocation_requires_reason_when_eligible_work_exists: true
    do_not_parallelize: [DEPENDENT_WORK, CONFLICTING_SHARED_FILE_WRITES, RESOURCE_LOCK_CONFLICTS, WORK_REQUIRING_UNPROVED_DEPENDENCY_ASSUMPTIONS]
    stop_conditions: [NO_ELIGIBLE_INDEPENDENT_WORK_REMAINS, HARD_BLOCKER_PREVENTS_FURTHER_ELIGIBLE_WORK, RESOURCE_OR_SHARED_FILE_LOCK_PREVENTS_SAFE_PARALLELISM, INVOCATION_OR_TOOL_EXECUTION_LIMIT_REACHED, WORK_UNIT_COMPLETION_BOUNDARY_REACHED]

  policy:
    one_active_job_per_lane: true
    coordinator_is_not_a_lane: true
    generic_worker_consumes_orchestration_lane: false
    valid_states: [IDLE, ASSIGNED, INITIALIZING, WORKING, BLOCKED, WAITING, CLOSING, STALE]
    assignment_requirements:
      - non-IDLE lane must identify its work_unit and task
      - WORKING lane must identify its run_id and last_heartbeat
      - BLOCKED lane must contain a plain-English blocker
      - LANE_INIT_START must exist before init executes
      - LANE_INIT_END must be persisted immediately after init
      - service may start only after persisted LANE_INIT_END equals INITIALIZED
      - LANE_SERVICE_START must exist before service executes
      - LANE_SERVICE_END must be persisted immediately after service
      - LANE_CLOSE_END or recovery-close must exist before lane release/reuse
      - summary counts must reconcile exactly to the ten lane records
      - during an active invocation the coordinator should fill and refill safe independent lanes while eligible work remains

