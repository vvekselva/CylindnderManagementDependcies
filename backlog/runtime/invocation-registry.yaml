rules:
  - each invocation owns only its own workspace, lane logs and executor processes
  - each work claim is globally unique across active invocations
  - every RUNNING invocation must carry compliant heartbeat/progress health fields
  - a RUNNING flag or scheduler last_run_time alone never proves Orchestrator liveness
  - START and initial heartbeat must be read back before ORCHESTRATOR_STARTED
  - eligible work requires a persisted and read-back-verified work claim before dispatch
  - stale/stuck owners are recovered fail-closed before capacity or duplicate-work decisions
  - shared SSOT merge and BL-008 database writes remain globally serialized
