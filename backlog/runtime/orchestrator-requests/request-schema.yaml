request_schema:
  version: 1
  purpose: DURABLE_TRIGGER_FOR_HOSTED_CYLINDER_ORCHESTRATOR
  required_fields:
    - request_id
    - requested_at
    - mode
    - streams
  allowed_mode: [MANUAL, SCHEDULED]
  allowed_streams: [BL-001, BL-002, BL-008]
  rule: REQUEST_FILE_PROVES_TRIGGER_INTENT_NOT_EXECUTION_SUCCESS
  execution_success_requires:
    - hosted_workflow_run
    - source_checkout_verified
    - governed_executor_result
    - durable_result_persisted
