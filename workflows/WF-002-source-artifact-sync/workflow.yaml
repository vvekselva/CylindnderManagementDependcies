workflow:
  id: WF-002-source-artifact-sync
  version: 2
  name: Source to Artifact Synchronization
  purpose: >-
    Detect changes in CylinderManagement after the last verified source commit,
    classify their impact on controlled artifacts, refresh stale artifacts, and
    notify the user when an exposed API changes or impact cannot be confirmed.

  target_repository: vvekselva/CylinderManagement
  control_repository: vvekselva/CylindnderManagementDependcies

  independent_worker:
    component: WORKER
    contract: automation/worker-component-contract.md
    input_template: worker/worker-input-template.yaml
    task_definition_source: INPUT_FILE_ONLY

  trigger:
    modes:
      - SOURCE_CHANGE_CHECK
      - MANUAL_RUN
      - BEFORE_TRACEABILITY_USE

  orchestration_worker_model:
    coordinator_is_separate: true
    lanes: 10
    max_parallel_jobs: 10

  logging:
    policy: governance/automation-log-policy.md
    shared_log: logs/automation-log.md
    story_output: logs/automation-story.md
    worker_runs: worker/runs/WI-*.md
    worker_results: worker/results/WI-*.md

  synchronization:
    policy: governance/source-artifact-sync-policy.md
    register: sync/source-artifact-sync-register.yaml

  jobs:
    - id: JOB-001
      name: Read Comparison Commits
      needs: []
      parallel: false
      actions:
        - id: ACT-001
          instruction: Read the last verified CylinderManagement commit represented by the sync register.
          expected_result: Base comparison commit is known.
        - id: ACT-002
          instruction: Read the newest CylinderManagement commit that must be checked.
          expected_result: Head comparison commit is known.

    - id: JOB-002
      name: Find Source Changes
      needs: [JOB-001]
      parallel: false
      actions:
        - id: ACT-001
          instruction: Create a Worker Input that compares the two commits and returns added, changed, renamed and deleted source files.
          expected_result: The comparison task is explicit in an input file.
        - id: ACT-002
          instruction: Execute the Worker Input and accept only a CLOSED result.
          expected_result: Changed source files/components are returned with evidence.
        - id: ACT-003
          instruction: Map changed files to registered artifacts where possible.
          expected_result: Potentially affected artifacts enter the impact-check queue.

    - id: JOB-003
      name: Classify Change Impact In Parallel
      needs: [JOB-002]
      parallel: true
      strategy:
        type: QUEUE_FAN_OUT
        item_source: changed_source_components
        max_parallel: 10
        worker_ownership: ONE_CHANGED_COMPONENT_PER_WORK_ITEM
      actions:
        - id: ACT-001
          instruction: For the assigned changed component, create/select a Worker Input that compares old and new behaviour relevant to the registered artifact.
          expected_result: The exact comparison question, scope and permissions are explicit.
        - id: ACT-002
          instruction: Use CLOSED Worker results to determine whether exposed API behaviour changed.
          expected_result: Caller-visible impact is evidence-backed.
        - id: ACT-003
          instruction: If API behaviour is unchanged, use Worker results to determine whether the recorded internal trace changed.
          expected_result: Internal traceability impact is evidence-backed.
        - id: ACT-004
          instruction: Classify the change using the synchronization policy.
          expected_result: One classification is recorded with a simple-English explanation.

    - id: JOB-004
      name: Decide Required Response
      needs: [JOB-003]
      parallel: false
      actions:
        - id: ACT-001
          instruction: Leave INTERNAL_ONLY artifacts unchanged when still correct.
          expected_result: No unnecessary artifact churn.
        - id: ACT-002
          instruction: Queue TRACE_CHANGED artifacts for refresh without normal user notification.
          expected_result: Internal path changes are reflected.
        - id: ACT-003
          instruction: Queue EXPOSED_API_CHANGED and COMPONENT_ADDED_OR_REMOVED items for refresh and user notification.
          expected_result: Caller-visible changes are surfaced.
        - id: ACT-004
          instruction: Mark IMPACT_NOT_CONFIRMED items REVIEW_REQUIRED and prepare a user notification.
          expected_result: Uncertainty is not silently accepted.

    - id: JOB-005
      name: Refresh Affected Artifacts
      needs: [JOB-004]
      parallel: true
      strategy:
        type: QUEUE_FAN_OUT
        item_source: artifact_refresh_queue
        max_parallel: 10
      actions:
        - id: ACT-001
          instruction: Create/select Worker Inputs that collect the new evidence required to refresh each stale artifact.
          expected_result: Refresh evidence comes from explicit input-driven Worker tasks.
        - id: ACT-002
          instruction: Update only artifact sections made stale by the source change.
          expected_result: Artifact matches the new source.
        - id: ACT-003
          instruction: Verify the update against CLOSED Worker evidence.
          expected_result: Artifact can be marked IN_SYNC.

    - id: JOB-006
      name: Notify User When Required
      needs: [JOB-004]
      parallel: false
      actions:
        - id: ACT-001
          instruction: Create a simple-English notification for caller-visible API changes, added/removed exposed components, or unconfirmed impact.
          expected_result: User understands what changed and what action is needed.

    - id: JOB-007
      name: Update Sync Register
      needs: [JOB-005, JOB-006]
      parallel: false
      actions:
        - id: ACT-001
          instruction: Record new source commit, classification, evidence IDs and synchronization state.
          expected_result: Register represents the current source-to-artifact relationship.

    - id: JOB-008
      name: Update Human Log And Story
      needs: [JOB-007]
      parallel: false
      actions:
        - id: ACT-001
          instruction: Confirm all Worker runs used by this synchronization check are CLOSED.
          expected_result: No unfinished result is accepted as evidence.
        - id: ACT-002
          instruction: Record the synchronization event and rebuild the human story.
          expected_result: Human-readable history is current.

  classification_response:
    INTERNAL_ONLY:
      notify_user: false
      refresh_artifact: false
    TRACE_CHANGED:
      notify_user: false
      refresh_artifact: true
    EXPOSED_API_CHANGED:
      notify_user: true
      refresh_artifact: true
    COMPONENT_ADDED_OR_REMOVED:
      notify_user: true
      refresh_artifact: true
    IMPACT_NOT_CONFIRMED:
      notify_user: true
      refresh_artifact: false
      review_required: true
