workflow:
  id: WF-001-controller-traceability
  version: 5
  name: Controller Traceability
  purpose: >-
    Build the initial Controller Traceability Matrix from one complete, closed
    Source Repository Check result at a frozen CylinderManagement source commit.

  target_repository: vvekselva/CylinderManagement
  control_repository: vvekselva/CylindnderManagementDependcies
  design: traceability/controller-traceability-design.md
  controller_artifact_template: traceability/controller-trace-template.md

  initial_baseline_mode:
    name: COMPLETE_REPOSITORY_CHECK_THEN_MATRIX
    enabled: true
    rule: >-
      During the first baseline run, the Source Repository Check must finish completely
      and close before the Traceability Matrix Job may start. Partial Worker batches do
      not unlock the matrix Job.
    source_check_input: worker/inputs/WI-0004.yaml
    source_check_result: worker/results/WI-0004.md
    source_check_artifact: traceability/source-repository-check.md
    matrix_output: traceability/controller-traceability.md

  independent_worker:
    component: WORKER
    contract: automation/worker-component-contract.md
    input_template: worker/worker-input-template.yaml
    input_directory: worker/inputs/
    run_directory: worker/runs/
    result_directory: worker/results/
    consumes_orchestration_lane: false
    task_definition_source: INPUT_FILE_ONLY

  source_baseline:
    rule: ONE_COMMIT_FOR_THE_COMPLETE_WORKFLOW
    ref: 3ae6e61442132d94a307275b08dd65fcef228d89
    description: >-
      The complete Source Repository Check and the Traceability Matrix must describe
      exactly the same CylinderManagement source commit.

  orchestration_worker_model:
    coordinator_is_separate: true
    lanes: 10
    max_parallel_jobs: 10
    initial_baseline_is_sequential: true

  logging:
    policy: governance/automation-log-policy.md
    shared_log: logs/automation-log.md
    story_output: logs/automation-story.md
    independent_worker_runs: worker/runs/WI-*.md
    independent_worker_results: worker/results/WI-*.md

  synchronization:
    policy: governance/source-artifact-sync-policy.md
    register: sync/source-artifact-sync-register.yaml

  quality_gates:
    - id: GATE-TRC-001
      name: Source Baseline Frozen
    - id: GATE-TRC-002
      name: Complete Source Repository Check Closed
    - id: GATE-TRC-003
      name: Complete Exposed Controller Set Produced
    - id: GATE-TRC-004
      name: Complete Endpoint Set Produced
    - id: GATE-TRC-005
      name: Every Endpoint Has Trace Result
    - id: GATE-TRC-006
      name: Complete Traces Have Source Evidence
    - id: GATE-TRC-007
      name: Unresolved Traces Have Clear Stopping Point
    - id: GATE-TRC-008
      name: Traceability Matrix Coverage Is 100 Percent
    - id: GATE-TRC-009
      name: Source Artifact Sync Registered
    - id: GATE-TRC-010
      name: Worker And Orchestration Runs Closed And Story Current

  jobs:
    - id: JOB-001
      name: Freeze Source Baseline
      needs: []
      parallel: false
      lifecycle: INHERIT_WORKER_SERVICE_CONTRACT
      actions:
        - id: ACT-001
          instruction: Record the approved CylinderManagement source commit for this initial baseline run.
          expected_result: One immutable source baseline is fixed for all later work.
      completion_check: The frozen source baseline is recorded and available to JOB-002 and JOB-003.
      gate: GATE-TRC-001

    - id: JOB-002
      name: Complete Source Repository Check
      needs: [JOB-001]
      parallel: false
      lifecycle: INHERIT_WORKER_SERVICE_CONTRACT
      worker_input: worker/inputs/WI-0004.yaml
      actions:
        - id: ACT-001
          instruction: Execute WI-0004 from init() through service() and close().
          expected_result: One complete closed Worker result describes the repository, exposed components, endpoints, call paths, final dependencies and unresolved items.
        - id: ACT-002
          instruction: Copy the accepted closed Worker result into the orchestration artifact traceability/source-repository-check.md without changing its source conclusions.
          expected_result: The complete repository-check output is available as a stable orchestration artifact.
      completion_check: >-
        WI-0004 result is COMPLETED, its run is CLOSED, it is not PARTIAL, and
        traceability/source-repository-check.md contains the accepted complete output.
      outputs:
        - worker/results/WI-0004.md
        - worker/runs/WI-0004.md
        - traceability/source-repository-check.md
      gates:
        - GATE-TRC-002
        - GATE-TRC-003
        - GATE-TRC-004
        - GATE-TRC-005
        - GATE-TRC-006
        - GATE-TRC-007

    - id: JOB-003
      name: Complete Traceability Matrix
      needs: [JOB-002]
      parallel: false
      lifecycle: INHERIT_WORKER_SERVICE_CONTRACT
      start_condition: JOB-002_VERIFIED_AND_SOURCE_REPOSITORY_CHECK_CLOSED
      actions:
        - id: ACT-001
          instruction: Read only the accepted complete initial Source Repository Check output for source facts used to build the baseline matrix.
          input: traceability/source-repository-check.md
          expected_result: Matrix construction starts from one complete source-analysis baseline, not partial Worker batches.
        - id: ACT-002
          instruction: Create traceability/controller-inventory.md from the complete exposed-component set in the source repository check and assign stable CTL IDs.
          expected_result: Every exposed production component has one stable Controller ID.
        - id: ACT-003
          instruction: Create traceability/endpoint-inventory.md from the complete endpoint set and assign stable Endpoint IDs under their Controller IDs.
          expected_result: Every caller-visible endpoint is inventoried.
        - id: ACT-004
          instruction: Build traceability/controller-traceability.md with one row for every endpoint and its proved call path/final dependency.
          expected_result: The Traceability Matrix has 100 percent endpoint coverage.
        - id: ACT-005
          instruction: Create traceability/unresolved-traceability.md from every endpoint whose final dependency is not fully proved.
          expected_result: No unresolved endpoint is hidden or guessed.
      completion_check: >-
        Controller inventory, Endpoint inventory, Traceability Matrix and unresolved list
        are generated from the same closed Source Repository Check; every exposed endpoint
        appears exactly once in the matrix; coverage equals 100 percent.
      outputs:
        - traceability/controller-inventory.md
        - traceability/endpoint-inventory.md
        - traceability/controller-traceability.md
        - traceability/unresolved-traceability.md
      gate: GATE-TRC-008

    - id: JOB-004
      name: Register Initial Source Artifact Baseline
      needs: [JOB-003]
      parallel: false
      lifecycle: INHERIT_WORKER_SERVICE_CONTRACT
      actions:
        - id: ACT-001
          instruction: Register the Traceability Matrix and related artifacts against the frozen source commit.
          expected_result: The initial source-to-artifact synchronization baseline is established.
      output: sync/source-artifact-sync-register.yaml
      gate: GATE-TRC-009

    - id: JOB-005
      name: Close Initial Traceability Run
      needs: [JOB-004]
      parallel: false
      lifecycle: INHERIT_WORKER_SERVICE_CONTRACT
      actions:
        - id: ACT-001
          instruction: Confirm WI-0004 and every orchestration Job used by the initial run are CLOSED.
          expected_result: No open run is treated as final evidence.
        - id: ACT-002
          instruction: Generate/update the human-readable automation story and final status.
          expected_result: The first Traceability baseline is auditable and understandable.
      output: logs/automation-story.md
      gate: GATE-TRC-010

  future_incremental_mode:
    enabled_after_initial_baseline: true
    description: >-
      After JOB-005 closes the initial baseline, WF-002 may use targeted Worker Inputs
      for later source changes. The initial baseline itself always uses the complete
      repository-check-first sequence.

  workflow_completion:
    required:
      - source baseline frozen
      - WI-0004 COMPLETED and CLOSED
      - complete source repository check artifact produced
      - Traceability Matrix built only after JOB-002 verification
      - controller inventory complete
      - endpoint inventory complete
      - every endpoint has one trace result
      - matrix coverage equals 100 percent
      - unresolved items explicitly recorded
      - sync register updated
      - all Worker and orchestration runs CLOSED
      - human-readable story generated
