project_inventory:
  version: 2
  repository: vvekselva/CylinderManagement
  source_branch: main
  purpose: >-
    Provide the Level 1 Single Source of Truth for top-level projects/modules and backlog-specific scope classifications.
    The Orchestrator must use this inventory instead of inferring scope from project names.

  unit_test_policy:
    backlog_item: BL-002
    rule: Preserve the existing explicit unit-test classifications; unclassified unit-test scope must not be inferred.

  bl008_database_migration_policy:
    backlog_item: BL-008
    rule: >-
      BL-008 may read only modules explicitly classified below. cylinder.datascripts is the authoritative Flyway execution
      source; NewOwnerShipModelv3 is an ownership-model reference source; cmas.database.operations is a database-governance
      and recovery reference source. Other top-level modules are not direct BL-008 migration sources unless a later source-proved dependency is recorded.

  projects:
    - id: PRJ-001
      path: Cylinder.management.dto
      unit_test_scope: NO_UNIT_TEST_REQUIRED
      bl008_database_migration_scope: NOT_DIRECT_MIGRATION_SOURCE
      source: USER_DIRECTIVE_2026-08-23

    - id: PRJ-002
      path: NewOwnerShipModelv3
      unit_test_scope: UNIT_TEST_SCOPE_UNCLASSIFIED
      bl008_database_migration_scope: OWNERSHIP_MODEL_REFERENCE_REQUIRED
      source: USER_DIRECTIVE_2026-08-26_BL008_BOOTSTRAP

    - id: PRJ-003
      path: cmas.database.operations
      unit_test_scope: UNIT_TEST_POSTPONED
      bl008_database_migration_scope: DATABASE_GOVERNANCE_AND_RECOVERY_REFERENCE_REQUIRED
