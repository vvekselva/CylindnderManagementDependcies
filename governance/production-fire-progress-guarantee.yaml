version: 3
name: Production Fire Progress Guarantee
purpose: >-
  Ensure every scheduled or manual Cylinder production fire performs productive work when eligible work exists. Startup is
  primarily read/plan/classify work. Shared GitHub SSOT, registry, runtime status and durable reporting files are synchronized
  after execution in one governed END_OF_ORCHESTRATION_RECONCILIATION phase. A production fire must never fail merely because
  a large shared registry cannot be rewritten before analysis.

authority:
  applies_to: [MANUAL_PRODUCTION_FIRE, SCHEDULED_PRODUCTION_FIRE]
  authoritative_control_repository: vvekselva/CylindnderManagementDependcies
  authoritative_control_branch: chore/rename-dependency-files
  invocation_registry: backlog/runtime/invocation-registry.yaml
  invocation_health: governance/invocation-health.yaml
  invocation_concurrency: governance/invocation-concurrency.yaml
  orchestrator_bootstrap_gate: governance/orchestrator-bootstrap-gate.yaml

startup_phase:
  mandatory: true
  shared_repository_write_required: false
  shared_registry_start_write_required: false
  order:
    - PIN_AUTHORITATIVE_CONTROL_BRANCH
    - GENERATE_UNIQUE_INVOCATION_ID
    - READ_GOVERNANCE_LEVEL_1_LEVEL_2_LEVEL_3_SSOT
    - CLASSIFY_PRIOR_NONTERMINAL_INVOCATIONS
    - BUILD_IN_MEMORY_EXECUTION_PLAN
    - BUILD_END_OF_ORCHESTRATION_UPDATE_SET
    - SELECT_ELIGIBLE_WORK
    - ACQUIRE_ONLY_REQUIRED_EXECUTION_LOCKS
    - START_EXECUTION
  end_update_set_must_be_known_before_dispatch: true
  startup_failure_classes:
    read_failure: ORCHESTRATOR_BOOTSTRAP_READ_FAILURE
    plan_failure: ORCHESTRATOR_BOOTSTRAP_PLAN_FAILURE
    required_lock_failure: ORCHESTRATOR_EXECUTION_LOCK_FAILURE

heartbeat:
  required_during_execution: true
  maximum_interval_seconds: 60
  persistence_mode: EXECUTION_RUNTIME_FIRST
  shared_github_heartbeat_write_required_every_interval: false
  shared_terminal_health_projection_required_at_reconciliation: true
  heartbeat_does_not_equal_progress: true

productive_execution:
  target_minutes: 30
  terminal_checkpoint_forbidden_when:
    eligible_unclaimed_work_count_greater_than_zero: true
    active_lane_count_equals_zero: true
    execution_budget_open: true
  mandatory_action_when_terminal_forbidden: [REPLAN, CLAIM_ELIGIBLE_UNCLAIMED_WORK, DISPATCH]
  refill_free_worker_slot_immediately: true
  max_safe_workers_per_invocation: 10
  one_blocked_stream_must_not_stop_other_eligible_streams: true
  starvation_forbidden: true

work_conversion_rules:
  source_or_binding_gap:
    do_not_treat_as_final_blocker_when_resolvable_from_frozen_source: true
    convert_to_task_type: SOURCE_RESOLUTION
  ui_or_story_field_gap:
    do_not_invent_meaning: true
    convert_to_task_type: UI_SOURCE_ANALYSIS
    permitted_sources: [PAGE_TEMPLATE, REQUEST_MODEL, DTO, CONTROLLER, VALIDATOR, SERVICE, REPOSITORY, ENTITY]
    unresolved_after_source_analysis: NEEDS_CLARIFICATION
  atomic_projection_ready:
    priority: CRITICAL
    rule: >-
      When BL-001 has a validated complete candidate projection, execute the canonical projection and consistency gates before
      repeating already-proved discovery.

anti_repeat:
  same_task_same_progress_fingerprint_same_result:
    immediate_reanalysis_forbidden: true
    action: SELECT_DIFFERENT_ELIGIBLE_UNCLAIMED_WORK
  unchanged_external_blocker:
    repeated_check_within_same_invocation_forbidden: true
    cache_state: BLOCKER_CACHE
    default_recheck_after_seconds: 1800
  known_blocker_does_not_consume_worker_capacity_continuously: true

stream_rules:
  BL-008:
    one_requirement_at_a_time: true
    database_write_parallelism: 1
    branch: main
    branch_creation_forbidden: true
    manual_sql_substitution_forbidden: true
  BL-001:
    full_unique_target: 134
    duplicates_allowed: 0
    missing_chain_proof_becomes_source_resolution_task: true
  BL-002:
    release_1_before_release_2: true
    accepted_non_stale_BL001_rows_only: true
    missing_field_contract_becomes_ui_source_analysis_task_before_final_needs_clarification: true
    auto_approval_forbidden: true

end_of_orchestration_reconciliation:
  mandatory: true
  purpose: >-
    Convert validated execution results into durable shared truth exactly once at the end of the orchestration phase.
  required_order:
    - STOP_NEW_DISPATCH
    - COLLECT_ALL_TERMINAL_WORKER_RESULTS
    - VALIDATE_RESULTS_AND_ITEM_GATES
    - REJECT_INVALID_OR_INCOMPLETE_PARTIAL_OUTPUT
    - FINALIZE_CANONICAL_UPDATE_SET
    - ACQUIRE_SHARED_SSOT_SINGLE_WRITER_LOCK
    - UPDATE_CANONICAL_ARTIFACTS
    - UPDATE_LEVEL_3_RUNTIME
    - UPDATE_BACKLOG_STATUS_IF_DERIVED_STATE_CHANGED
    - UPDATE_INVOCATION_REGISTRY_WITH_FINAL_RECORD
    - UPDATE_EXECUTION_STATISTICS
    - WRITE_DURABLE_RUN_LOG
    - RELEASE_ALL_LOCKS_AND_CLAIMS
    - READ_BACK_AND_VERIFY_FINAL_FILES
    - VERIFY_ZERO_TRANSIENT_LANE_LOGS
  shared_files_updated_only_from_validated_results: true
  expected_files_known_at_start: true
  newly_discovered_output_files_may_be_added_to_update_set_with_journal_evidence: true
  registry_is_terminal_history_and_index_not_startup_gate: true
  on_reconciliation_failure:
    preserve_last_valid_shared_state: true
    terminal_state: PARTIAL_CONTINUE_REQUIRED
    classification: ORCHESTRATOR_END_RECONCILIATION_FAILURE

terminal_state_rules:
  COMPLETE:
    allowed_only_when:
      - end_reconciliation_completed
      - all_work_claims_or_locks_released
      - no_eligible_or_recoverable_unclaimed_work_remains_for_this_invocation
      - all_remaining owned work is validated complete or durably blocked
  PARTIAL_CONTINUE_REQUIRED:
    required_when:
      - eligible_or_recoverable_unclaimed_work_still_exists
      - productive_window_or_other_execution_limit_prevents_more_dispatch
    also_required_when_reconciliation_failed: true
  BLOCKED:
    allowed_only_when:
      - every_remaining_owned_work_item_has_explicit_durable_blocker
      - no_other_eligible_unclaimed_work_exists_across_enabled_streams
  forbidden_terminal_claims:
    - COMPLETE_AFTER_STATUS_CHECK_ONLY
    - COMPLETE_WHILE_ELIGIBLE_WORK_EXISTS
    - COMPLETE_WITHOUT_END_RECONCILIATION
    - PRODUCTION_SUCCESS_FROM_SCHEDULER_LAST_RUN_TIME_ONLY

persistence_and_observability:
  invocation_registry_role: END_STATE_INDEX_AND_HISTORY
  invocation_start_must_exist_in_registry_before_analysis: false
  durable_start_log_required_before_analysis: false
  final_invocation_record_required: true
  durable_terminal_log_required: true
  report_fields:
    - scheduler_fire_observed
    - invocation_id
    - execution_plan_complete
    - planned_end_update_file_count
    - execution_state
    - health_state
    - workers_started
    - backlog_items_touched
    - canonical_progress_delta
    - blocker_changes
    - reconciliation_outcome
    - next_action

acceptance_test_for_each_fire:
  pass_if_any:
    - canonical_progress_delta_greater_than_zero
    - validated_blocker_state_changed
    - recoverable_work_was_attempted_with_durable_evidence
    - no_eligible_work_existed_and_clean_blocked_or_noop_state_was_reconciled
  fail_if:
    - eligible_work_existed_but_no_execution_plan_or_dispatch_was_attempted
    - status_checked_only_while_eligible_work_existed
    - free_worker_capacity_existed_but_no_replan_or_dispatch_was_attempted
    - end_reconciliation_required_but_not_attempted

safety:
  fail_closed_on_unproved_source: true
  never_duplicate_claimed_work: true
  never_invent_story_or_traceability_meaning: true
  never_create_neon_branch: true
  never_run_parallel_BL008_database_writes: true
  never_close_backlog_item_without_required_gates_and_user_acceptance: true
