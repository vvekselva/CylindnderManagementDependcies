version: 2
purpose: >-
  Control whether the Primary Orchestrator must expect repository changes while a production invocation is running.
  This separates runtime source reads from GitHub persistence, prevents repeated repository-tree discovery when the
  source is stable, and batches durable Git writes so scheduling is never gated by one commit per executor.

runtime_source_mode:
  repository_tree_snapshot:
    fetch_once_at_invocation_start: true
    cache_for_entire_invocation: true
    re_fetch_during_invocation: false
    snapshot_identity_required: true
    use_snapshot_for_path_resolution: true
  source_content:
    primary_provider_after_start: LOCAL_OR_STAGED_SNAPSHOT
    github_direct_reads_by_workers: false
    github_direct_reads_by_executor: false
    github_direct_reads_by_orchestrator_after_snapshot: false
    missing_local_source_action: RESOLVE_FROM_START_SNAPSHOT_OR_FAIL_CLOSED

repository_change_expectation:
  git_changes_expected_during_execution: false
  external_commits_expected: false
  effective_until: 2026-08-30T23:59:59+05:30
  user_statement: >-
    No external commits are expected through Sunday. Commits may occur only when the Primary Orchestrator deliberately
    persists validated orchestration/control artifacts.
  when_false:
    poll_remote_during_execution: false
    refresh_repository_tree_after_executor_completion: false
    refresh_repository_tree_before_replan: false
    compare_remote_head_before_each_assignment: false
    source_of_truth_for_runtime_reads: INVOCATION_START_LOCAL_OR_STAGED_SNAPSHOT
  when_true:
    remote_change_detection_required: true
    refresh_only_after_change_signal: true
    never_poll_per_worker: true
    invalidate_only_affected_cached_paths: true

orchestrator_generated_commits:
  allowed: true
  treated_as_external_source_change: false
  update_local_control_state_immediately: true
  require_repository_tree_refetch: false
  reason: >-
    The Primary Orchestrator already knows exactly which control files it changed. It updates its local control snapshot
    directly instead of rediscovering the whole repository tree.

git_persistence_mode:
  mode: BATCHED_CHECKPOINT_ONLY
  commit_after_each_worker: false
  commit_after_each_executor: false
  commit_after_each_story: false
  commit_before_replan: false
  commit_before_slot_refill: false
  scheduling_uses_local_validated_state_before_git_persistence: true
  accumulate_validated_deltas_locally: true
  preferred_commit_boundaries:
    - FAIL_CLOSED_DURABILITY_BOUNDARY_WHEN_REQUIRED
    - EXPLICIT_ORCHESTRATOR_CHECKPOINT
    - INVOCATION_END
  one_batch_commit_may_contain_multiple_executor_results: true
  persistence_failure_state: PENDING_SYNC
  persistence_failure_does_not_restart_completed_executor: true
  prohibited_patterns:
    - ONE_COMMIT_PER_WORKER
    - ONE_COMMIT_PER_EXECUTOR
    - ONE_COMMIT_PER_STORY
    - TREE_REFETCH_AFTER_SELF_COMMIT

executor_completion_scheduling:
  completion_signal: EXECUTOR_COMPLETED_REPLAN_REQUIRED
  process_each_completion_independently: true
  wait_for_peer_executors: false
  wait_for_peer_workers: false
  release_completed_slot_immediately_after_validation: true
  refill_completed_slot_immediately_when_eligible_work_exists: true
  github_persistence_required_before_refill: false
  sibling_executors_continue_uninterrupted: true

next_invocation_rule:
  always_take_new_tree_snapshot_at_start: true
  reason: >-
    A new invocation gets one fresh repository view. Within that invocation the view remains stable unless the explicit
    git_changes_expected_during_execution flag is changed to true or a change signal is received.
