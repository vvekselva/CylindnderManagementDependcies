version: 2
name: Orchestrator Bootstrap and Deferred Reconciliation Gate
purpose: >-
  Separate scheduler invocation from productive Orchestrator execution without requiring shared GitHub runtime files to be
  rewritten before work can start. At invocation start the Primary Orchestrator reads authoritative truth, creates an in-memory
  execution plan, determines the exact durable files that may require synchronization at the end, classifies prior health, and
  reserves only the minimum execution locks required for safety. Shared SSOT, registry, status and reporting files are updated
  during END_OF_ORCHESTRATION_RECONCILIATION after worker results are validated.

authority:
  applies_to: [SCHEDULED_PRODUCTION_FIRE, MANUAL_PRODUCTION_FIRE]
  authoritative_control_repository: vvekselva/CylindnderManagementDependcies
  authoritative_control_branch: chore/rename-dependency-files
  invocation_registry: backlog/runtime/invocation-registry.yaml
  invocation_health: governance/invocation-health.yaml
  production_progress_guarantee: governance/production-fire-progress-guarantee.yaml

bootstrap_contract:
  scheduler_fire_is_orchestrator_start: false
  shared_repository_mutation_required_before_analysis: false
  shared_registry_start_write_required_before_analysis: false
  required_order:
    - PIN_AUTHORITATIVE_CONTROL_BRANCH
    - GENERATE_UNIQUE_INVOCATION_ID
    - READ_AUTHORITATIVE_GOVERNANCE_AND_SSOT
    - CLASSIFY_PRIOR_INVOCATION_HEALTH_FROM_DURABLE_EVIDENCE
    - BUILD_IN_MEMORY_EXECUTION_PLAN
    - BUILD_END_OF_ORCHESTRATION_UPDATE_SET
    - SELECT_ELIGIBLE_WORK
    - ACQUIRE_ONLY_REQUIRED_EXECUTION_LOCKS
    - SET_COORDINATOR_PHASE_ORCHESTRATOR_STARTED
  production_execution_acknowledged_only_after:
    - authoritative_inputs_read_successfully
    - prior_health_classification_complete
    - execution_plan_complete
    - end_update_set_complete
    - required_execution_locks_acquired
  forbidden_acknowledgements:
    - scheduler_last_run_time_only
    - running_flag_without_health_classification
    - orchestrator_started_without_execution_plan
    - orchestrator_started_without_known_end_update_set

end_update_set:
  required: true
  generated_before_dispatch: true
  persisted_to_shared_repository_at_start: false
  must_list:
    - backlog_item
    - work_unit
    - candidate_output_files
    - shared_ssot_files_to_reconcile
    - runtime_status_files_to_reconcile
    - logs_or_evidence_files_to_reconcile
    - lock_or_claim_cleanup_required
  may_expand_during_execution_only_when:
    - newly discovered valid output requires durable synchronization
    - expansion is recorded in the in-memory execution journal
  shared_files_are_not_rewritten_merely_to_record_startup: true

execution_lock_policy:
  general_shared_status_lock_required_at_start: false
  work_claim_strategy: IN_MEMORY_FOR_SINGLETON_INVOCATION
  singleton_invocation_source: governance/invocation-concurrency.yaml
  bl008_database_write_lock:
    required_immediately_before_database_mutation: true
    capacity: 1
    scope: GLOBAL
    release_after: DATABASE_RESULT_VALIDATED_OR_FAILED_CLOSED
  if_singleton_invocation_is_later_relaxed:
    durable_atomic_claim_mechanism_must_be_added_before_overlap_is_enabled: true

stale_recovery:
  required_before_dispatch_when_prior_nonterminal_evidence_exists: true
  stale_after_seconds_without_heartbeat: 300
  steps:
    - inspect durable prior terminal/runtime evidence
    - verify no live worker or executor remains
    - preserve completed durable evidence
    - reject incomplete partial output
    - schedule stale-state correction in the end update set
  startup_must_not_rewrite_shared_registry_only_to_mark_recovery: true

end_of_orchestration_reconciliation:
  mandatory: true
  phase: END_OF_ORCHESTRATION_RECONCILIATION
  order:
    - STOP_NEW_DISPATCH
    - COLLECT_WORKER_RESULTS
    - VALIDATE_RESULTS_AND_GATES
    - REJECT_INVALID_OR_PARTIAL_OUTPUT
    - BUILD_FINAL_CANONICAL_UPDATE_SET
    - ACQUIRE_SHARED_SSOT_SINGLE_WRITER_LOCK
    - APPLY_SHARED_FILE_UPDATES
    - UPDATE_INVOCATION_REGISTRY_WITH_FINAL_INVOCATION_RECORD
    - UPDATE_RUNTIME_STATUS_AND_EXECUTION_STATISTICS
    - WRITE_DURABLE_RUN_LOG
    - RELEASE_SHARED_LOCKS_AND_BL008_LOCK
    - READ_BACK_AND_VERIFY_UPDATED_FILES
    - CONFIRM_ZERO_TRANSIENT_LANE_LOGS
    - TERMINALIZE
  all_shared_updates_must_derive_from_validated_results: true
  partial_shared_reconciliation_forbidden: true
  failure_behavior: PRESERVE_LAST_VALID_SHARED_STATE_AND_RETURN_PARTIAL_CONTINUE_REQUIRED

failure_classification:
  authoritative_read_failure: ORCHESTRATOR_BOOTSTRAP_READ_FAILURE
  execution_plan_failure: ORCHESTRATOR_BOOTSTRAP_PLAN_FAILURE
  required_lock_failure: ORCHESTRATOR_EXECUTION_LOCK_FAILURE
  reconciliation_failure: ORCHESTRATOR_END_RECONCILIATION_FAILURE
  terminal_readback_failure: ORCHESTRATOR_TERMINAL_ACK_FAILURE

terminal_rules:
  bootstrap_failure_must_not_be_reported_as_production_success: true
  successful_bootstrap_must_continue_into_execution_loop: true
  complete_requires_successful_end_reconciliation: true
  if_work_remains_at_window_end: PARTIAL_CONTINUE_REQUIRED

observability:
  report_fields:
    - scheduler_fire_observed
    - invocation_id
    - bootstrap_read_complete
    - execution_plan_complete
    - planned_end_update_file_count
    - selected_work
    - required_locks
    - coordinator_phase
    - workers_started
    - canonical_progress_delta
    - reconciliation_outcome
    - terminal_state

safety:
  fail_closed: true
  no_shared_registry_rewrite_as_startup_prerequisite: true
  shared_truth_updates_after_validation_only: true
  one_failed_stream_does_not_block_independent_streams: true
  never_run_parallel_bl008_database_writes: true
