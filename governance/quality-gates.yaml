version: 8
purpose: >-
  Define common Backlog planning/execution gates and the item-specific Quality Gate registry.
  Planning requires complete SSOT and SOW. Execution additionally requires dependency,
  lifecycle logging and real-lane-utilization governance where parallel dispatch is used.

three_level_ssot_gate:
  id: QG-SSOT-001
  name: Three-Level SSOT Planning Gate
  applies_to: ALL_BACKLOG_ITEMS
  owner: ORCHESTRATOR
  governance: governance/ssot-levels.yaml
  fail_closed: true
  pass_condition: >-
    SSOT-L1 Backlog Master/Repository Scope, SSOT-L2 Backlog Definition and SSOT-L3 Runtime
    are COMPLETE and mutually consistent for the selected Backlog Item. Level 2 includes a
    valid Statement of Work. Level 3 contains every file required by backlog/runtime-contract.yaml,
    including blockers.yaml, lane-status.yaml, lane-dispatch.yaml and execution-statistics.yaml.
  on_pass: ITEM_MAY_PROCEED_TO_REQUIRED_ANALYSIS_AND_PLANNING_RULES
  on_fail: BLOCKED_SSOT_INCOMPLETE_NO_PLANNING

statement_of_work_gate:
  id: QG-SOW-001
  name: Statement of Work Completeness Gate
  applies_to: ALL_BACKLOG_ITEMS
  owner: ORCHESTRATOR
  pass_condition: >-
    The selected Backlog Item declares a non-null Statement of Work file, the file exists,
    its backlog_item id matches the selected item, and objective, problem statement, in-scope
    work, deliverables, execution requirements, acceptance criteria and completion definition
    contain non-placeholder content.
  on_pass: SOW_COMPONENT_OF_SSOT_L2_IS_VALID
  on_fail: BLOCKED_MISSING_OR_INVALID_STATEMENT_OF_WORK
  fail_closed: true

common_gate:
  id: QG-DEP-001
  name: Backlog Dependency Gate
  applies_to: ALL_BACKLOG_ITEMS
  owner: ORCHESTRATOR
  pass_condition: >-
    Every dependency declared by the selected Backlog Item is VERIFIED or CLOSED,
    or the selected Backlog Item declares no dependencies.
  on_pass: ITEM_MAY_CONTINUE_TO_ITEM_SPECIFIC_QUALITY_GATES
  on_fail: WAITING_FOR_DEPENDENCY

execution_lifecycle_logging_gate:
  id: QG-LOG-001
  name: Execution Lifecycle Logging Completeness
  applies_to: ALL_ORCHESTRATOR_INVOCATIONS_AND_ORCHESTRATION_LANE_RUNS_AFTER_ACTIVATION
  owner: ORCHESTRATOR
  governance: governance/execution-lifecycle-logging.yaml
  fail_closed: true
  pass_condition: >-
    Pre-invocation lane-log hygiene proves zero leftover individual lane logs; required
    Orchestrator/lane lifecycle records exist in order with exact task identity; every lane
    closes or recovery-closes; transient lane logs are accumulated, verified and deleted;
    runtime/log evidence reconciles; and invocation closure proves zero lane logs remain.
  on_fail: EXECUTION_RESULT_NOT_ACCEPTED_AND_RECOVERY_LOG_REQUIRED
  historical_rule: Historical runs before contract activation remain legacy evidence and are not retroactively invalidated.

real_lane_utilization_gate:
  id: QG-LANE-001
  name: Real Lane Utilization Gate
  applies_to: MATRIX_OR_OTHER_REAL_PARALLEL_LANE_DISPATCH
  owner: ORCHESTRATOR
  governance: governance/lane-execution.yaml
  category: PERFORMANCE_GOVERNANCE
  fail_closed_for_parallelism_claim: true
  does_not_invalidate_source_evidence: true
  expected_concurrency_formula: min(configured_lanes, eligible_independent_tasks)
  pass_condition: >-
    When at least two safe independent tasks are dispatchable, measured peak concurrent lanes
    reaches expected safe concurrency, or a concrete runner/platform concurrency cap is recorded
    and the measured peak reaches that cap. Fewer than two independent tasks require no artificial
    parallelism.
  underutilized_condition: >-
    measured peak concurrent lanes is lower than expected safe concurrency and no dependency,
    resource lock, runner-capacity limit or platform limitation explains the shortfall.
  on_pass: REAL_PARALLELISM_CONFIRMED
  on_underutilized: LANE_UNDERUTILIZATION_RECORDED_CORRECT_EXECUTION_MECHANISM

user_verification:
  required_before_backlog_close: true
  rule: >-
    Automated gates may prove technical completion, but a Backlog Item must not move to CLOSED
    until its item-specific User Acceptance gate has been approved by the user.

backlog_quality_gates:
  BL-001: {name: Controller Traceability, configured: true, config: backlog/gates/BL-001-traceability.yaml, approved_by_user: true, execution_allowed: true}
  BL-002: {name: Unit Test Completion, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-003: {name: Integration Test Completion, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-004: {name: Code Coverage Report, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-005: {name: ArchUnit Architecture Test, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-006: {name: Requirements Traceability and Gap Analysis, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-007: {name: Migration of the Database to the Ownership Model, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-008: {name: Supplier Owned, Customer Owned and Company Owned Cylinder Model, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-009: {name: Physical Challan Book Location, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-010: {name: Ownership Dashboard Changes, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-011: {name: CRUD Services for All Tables, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-012: {name: On Spot Cylinder Checks, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-013: {name: Correction Management, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-014: {name: Invoice Generation and Check in Tally, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-015: {name: Attendance Management, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-016: {name: Trip Planning for the Customers, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-017: {name: CEO Dashboard, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-018: {name: Restoring the Logical Backup, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-019: {name: Task Management, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-020: {name: Customer Data Dashboard, configured: false, config: null, approved_by_user: false, execution_allowed: false}

orchestrator_rule: >-
  Validate QG-SSOT-001 before PLAN/REPLAN. After planning, enforce dependency, logging and
  item-specific gates. When lane-dispatch.yaml selects a real parallel backend, measure actual
  worker overlap and evaluate QG-LANE-001. Distinct lane IDs alone must never be reported as
  concurrency. Under-utilization preserves valid source evidence but blocks a claim that real
  parallel utilization is solved until the measured concurrency gap is explained or corrected.
