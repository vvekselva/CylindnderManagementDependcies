version: 10
purpose: >-
  Define common Backlog planning/execution gates and the item-specific Quality Gate registry. Planning requires complete SSOT and SOW. Production execution additionally requires verified source input, lifecycle logging and measured real-lane utilization.

three_level_ssot_gate:
  id: QG-SSOT-001
  name: Three-Level SSOT Planning Gate
  applies_to: ALL_BACKLOG_ITEMS
  owner: ORCHESTRATOR
  governance: governance/ssot-levels.yaml
  fail_closed: true
  pass_condition: >-
    SSOT-L1 Backlog Master/Repository Scope, SSOT-L2 Backlog Definition and SSOT-L3 Runtime are COMPLETE and mutually consistent for the selected Backlog Item.

statement_of_work_gate:
  id: QG-SOW-001
  name: Statement of Work Completeness Gate
  applies_to: ALL_BACKLOG_ITEMS
  owner: ORCHESTRATOR
  fail_closed: true
  pass_condition: >-
    The selected Backlog Item has a non-placeholder SOW whose backlog ID, objective, scope, deliverables, execution requirements, acceptance criteria and completion definition are valid.

common_gate:
  id: QG-DEP-001
  name: Backlog Dependency Gate
  applies_to: ALL_BACKLOG_ITEMS
  owner: ORCHESTRATOR
  pass_condition: Every declared dependency is VERIFIED or CLOSED, or the selected Backlog Item declares no dependencies.

execution_source_gate:
  id: QG-SOURCE-001
  name: Execution Source Availability And Integrity
  applies_to: ALL_SOURCE_READING_WORKER_EXECUTION
  owner: ORCHESTRATOR
  governance: governance/source-provider.yaml
  fail_closed: true
  preferred_provider: ORCHESTRATOR_STAGED_SNAPSHOT
  fallback_provider: LOCAL_GIT_CHECKOUT
  pass_for_evidence_collection_condition: >-
    An approved provider supplies every dispatched controller root at the exact frozen baseline. For an Orchestrator-staged snapshot, each root must be present in the manifest and its recomputed Git blob hash must match the manifest before SERVICE.
  source_closure_complete_condition: >-
    Recursive source evidence collection reports zero missing_component_references for the batch.
  partial_closure_rule: >-
    PASS_ROOTS_VERIFIED permits source evidence collection but never automatic endpoint COMPLETE classification. Missing components remain explicit and are restaged at the same frozen commit.
  on_integrity_failure: BLOCK_BEFORE_SERVICE

execution_lifecycle_logging_gate:
  id: QG-LOG-001
  name: Execution Lifecycle Logging Completeness
  applies_to: ALL_ORCHESTRATOR_INVOCATIONS_AND_LANE_RUNS
  owner: ORCHESTRATOR
  governance: governance/execution-lifecycle-logging.yaml
  fail_closed: true
  pass_condition: >-
    Zero stale individual lane logs exist before fire; required START/END records with exact task identity exist in order; every started lane closes; transient logs are aggregated verified deleted and rescanned to zero.

real_lane_utilization_gate:
  id: QG-LANE-001
  name: Real Lane Utilization Gate
  applies_to: ANY_REAL_PARALLEL_LANE_BACKEND
  owner: ORCHESTRATOR
  governance: governance/lane-execution.yaml
  category: PERFORMANCE_GOVERNANCE
  fail_closed_for_parallelism_claim: true
  does_not_invalidate_source_evidence: true
  expected_concurrency_formula: min(configured_lanes, eligible_independent_tasks)
  current_backend: LOCAL_PROCESS_POOL
  pass_condition: >-
    When at least two safe independent tasks are dispatched, measured peak overlapping SERVICE intervals reaches expected safe concurrency.
  underutilized_condition: >-
    measured peak SERVICE concurrency is lower than expected safe concurrency.
  latest_validated_real_source_run:
    execution_id: PROD-STAGED-BL001-20260823-145139
    peak_service_concurrent_lanes: 9
    expected_concurrent_lanes: 10
    state: UNDERUTILIZED
    source_evidence_remains_usable: true

user_verification:
  required_before_backlog_close: true
  rule: Automated gates may prove technical completion, but a Backlog Item must not move to CLOSED until its User Acceptance gate is approved by the user.

backlog_quality_gates:
  BL-001: {name: Controller Traceability, configured: true, config: backlog/gates/BL-001-traceability.yaml, approved_by_user: true, execution_allowed: true}
  BL-002: {name: Unit Test Completion, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-003: {name: Integration Test Completion, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-004: {name: Code Coverage Report, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-005: {name: ArchUnit Architecture Test, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-006: {name: Requirements Traceability and Gap Analysis, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-007: {name: Migration of the Database to the Ownership Model, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-008: {name: Supplier Owned, Customer Owned and Company Owned Cylinder Model, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-009: {name: Physical Challan Book Location, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-010: {name: Ownership Dashboard Changes, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-011: {name: CRUD Services for All Tables, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-012: {name: On Spot Cylinder Checks, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-013: {name: Correction Management, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-014: {name: Invoice Generation and Check in Tally, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-015: {name: Attendance Management, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-016: {name: Trip Planning for the Customers, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-017: {name: CEO Dashboard, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-018: {name: Restoring the Logical Backup, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-019: {name: Task Management, configured: false, config: null, approved_by_user: false, execution_allowed: false}
  BL-020: {name: Customer Data Dashboard, configured: false, config: null, approved_by_user: false, execution_allowed: false}

orchestrator_rule: >-
  Validate QG-SSOT-001 before PLAN/REPLAN. Before source-reading workers start, enforce QG-SOURCE-001. Then enforce lifecycle logging and measure actual SERVICE overlap for QG-LANE-001. Source-provider partial closure and lane underutilization preserve valid evidence candidates but do not authorize guessing, automatic endpoint completion, or a claim of full parallel utilization.
