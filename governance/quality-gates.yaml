version: 3
purpose: >-
  Define the common Backlog pre-planning/pre-execution gates and register the approved
  quality-gate configuration for each Backlog Item. A Backlog Item may be planned only
  after its three Single Source of Truth levels are complete. Execution additionally
  requires Statement of Work, dependency and item-specific Quality Gate rules to pass.

three_level_ssot_gate:
  id: QG-SSOT-001
  name: Three-Level SSOT Planning Gate
  applies_to: ALL_BACKLOG_ITEMS
  owner: ORCHESTRATOR
  governance: governance/ssot-levels.yaml
  fail_closed: true
  pass_condition: >-
    SSOT-L1 Backlog Master, SSOT-L2 Backlog Definition and SSOT-L3 Runtime SSOT are all
    COMPLETE and mutually consistent for the selected Backlog Item. Level 2 includes a
    valid Statement of Work that passes QG-SOW-001. Level 3 contains every file required
    by backlog/runtime-contract.yaml, including blockers.yaml.
  on_pass: ITEM_MAY_PROCEED_TO_REQUIRED_ANALYSIS_AND_PLANNING_RULES
  on_fail: BLOCKED_SSOT_INCOMPLETE_NO_PLANNING

statement_of_work_gate:
  id: QG-SOW-001
  name: Statement of Work Completeness Gate
  applies_to: ALL_BACKLOG_ITEMS
  owner: ORCHESTRATOR
  pass_condition: >-
    The selected Backlog Item declares a non-null Statement of Work file, the file exists,
    its backlog_item id matches the selected item, and objective, problem statement,
    in-scope work, deliverables, execution requirements, acceptance criteria and completion
    definition contain non-placeholder content. execution_authorization.sow_required must
    be true, structurally_valid must be true and placeholders_present must be false.
  on_pass: SOW_COMPONENT_OF_SSOT_L2_IS_VALID
  on_fail: BLOCKED_MISSING_OR_INVALID_STATEMENT_OF_WORK
  fail_closed: true

common_gate:
  id: QG-DEP-001
  name: Backlog Dependency Gate
  applies_to: ALL_BACKLOG_ITEMS
  owner: ORCHESTRATOR
  pass_condition: >-
    Every dependency declared by the selected Backlog Item is VERIFIED or CLOSED,
    or the selected Backlog Item declares no dependencies.
  on_pass: ITEM_MAY_CONTINUE_TO_ITEM_SPECIFIC_QUALITY_GATES
  on_fail: WAITING_FOR_DEPENDENCY

user_verification:
  required_before_backlog_close: true
  rule: >-
    Automated quality gates may prove that execution is technically complete, but a
    Backlog Item must not move to CLOSED until its item-specific User Acceptance gate
    has been approved by the user.

backlog_quality_gates:
  BL-001:
    name: Controller Traceability
    configured: true
    config: backlog/gates/BL-001-traceability.yaml
    approved_by_user: true
  BL-002:
    name: Unit Test Completion
    configured: false
    config: null
    approved_by_user: false
    execution_allowed: false
  BL-003:
    name: Integration Test Completion
    configured: false
    config: null
    approved_by_user: false
    execution_allowed: false
  BL-004:
    name: Code Coverage Report
    configured: false
    config: null
    approved_by_user: false
    execution_allowed: false
  BL-005:
    name: ArchUnit Architecture Test
    configured: false
    config: null
    approved_by_user: false
    execution_allowed: false
  BL-006:
    name: Requirements Traceability and Gap Analysis
    configured: false
    config: null
    approved_by_user: false
    execution_allowed: false

orchestrator_rule: >-
  For PLAN or REPLAN, the Orchestrator must first validate QG-SSOT-001. If Level 1, Level 2
  or Level 3 is incomplete, only framework/definition/runtime initialization or repair work
  required to make those levels complete is permitted; planning is forbidden. QG-SOW-001 is
  a mandatory component of Level 2 and remains independently fail-closed. After QG-SSOT-001
  passes, dependency and item-specific Quality Gate rules still apply. Missing SSOT, SOW or
  Quality Gate configuration is a governance blocker, not permission to invent requirements.
