version: 6
purpose: >-
  Define the mandatory three-level Single Source of Truth model. Planning or replanning for a Backlog Item is fail-closed
  until Level 1, Level 2 and Level 3 are complete and internally consistent. Domain artifacts such as BL-002 Stories and
  Use Cases become authoritative execution outputs only through their registered approval gates; they do not replace the
  three planning SSOT levels.

planning_gate:
  id: QG-SSOT-001
  name: Three-Level SSOT Planning Gate
  owner: ORCHESTRATOR
  applies_to: ALL_BACKLOG_ITEMS
  fail_closed: true
  pass_condition: ALL_LEVELS_PASS
  on_fail: BLOCKED_SSOT_INCOMPLETE_NO_PLANNING
  on_pass: PLANNING_MAY_BE_CONSIDERED_AFTER_REQUIRED_ANALYSIS

levels:
  level_1:
    id: SSOT-L1
    name: Backlog Master and Repository Scope SSOT
    authoritative_files:
      - backlog/backlog.yaml
      - repository/project-inventory.yaml
    purpose: >-
      Answer what work exists, which top-level CylinderManagement projects/modules exist, and provide the authoritative
      master register and cross-backlog scope classifications.
    required_item_fields: [id, name, type, purpose, priority, state, item_definition, statement_of_work, completion_path, quality_gate, dependencies, expected_outputs, runtime]
    repository_inventory_rules:
      - every top-level CylinderManagement project/module must appear exactly once
      - backlog-specific scope classifications must be explicit and machine-readable
      - the Orchestrator must not infer missing project classifications
      - postponed work remains distinct from NOT_REQUIRED and COMPLETED work
    validation_rules:
      - selected Backlog Item exists exactly once in backlog/backlog.yaml
      - id/name/type/purpose references reconcile with Level 2
      - planning references are non-null and resolvable
      - state and dependency declarations are machine-readable
      - required Level 1 project/module scope classifications are complete before Level 2 is complete
    pass_state: COMPLETE

  level_2:
    id: SSOT-L2
    name: Backlog Definition SSOT
    authoritative_pattern: backlog/items/BL-*.yaml
    purpose: >-
      Define what the selected Backlog Item means, why it exists, its Statement of Work, scope, target, constraints,
      dependencies, deliverables, acceptance criteria, Completion Path and Quality Gates.
    required_components:
      - backlog item definition file
      - valid Statement of Work
      - Completion Path
      - item-specific Quality Gate configuration
    required_definition_fields: [id, name, type, purpose, statement_of_work, target, scope, dependencies, deliverables, acceptance_criteria, completion_path, quality_gate, runtime]
    validation_rules:
      - QG-SOW-001 must PASS
      - definition reconciles with Level 1
      - SOW, Completion Path and Quality Gate references exist
      - deliverables and acceptance criteria are non-placeholder
      - execution scope cannot be invented outside the SOW or contradict Level 1 classifications
    pass_state: COMPLETE

  level_3:
    id: SSOT-L3
    name: Runtime SSOT
    authoritative_pattern: backlog/runtime/<BL-ID>/
    purpose: >-
      Answer what is happening now, including current work-unit state, blockers, worker inputs, execution journal,
      statistics and live assignment of tasks to orchestration lanes.
    required_runtime_files:
      - analysis.yaml
      - execution-plan.yaml
      - work-unit-status.yaml
      - gate-status.yaml
      - blockers.yaml
      - decisions.yaml
      - worker-input-register.yaml
      - lane-status.yaml
      - lane-dispatch.yaml
      - local-execution.yaml
      - execution-statistics.yaml
      - result.yaml
    validation_rules:
      - all required runtime files exist before PLAN or REPLAN
      - runtime files identify the same Backlog Item
      - blockers.yaml records active blockers or an empty blocker set
      - gate-status.yaml records QG-SSOT-001 and applicable pre-execution gates
      - execution-plan.yaml may be INITIALIZED/EMPTY before first planning but must exist
      - lane-status.yaml contains LANE-01 through LANE-10 exactly once
      - lane-status.yaml is the authoritative current lane-to-task map
      - lane-dispatch.yaml identifies only eligible safe-independent tasks when populated
      - local-execution.yaml preserves dispatch fingerprint/idempotency and synchronization state
      - execution-statistics.yaml records measured run-over-run progress and staleness without inventing completion percentages
      - every non-IDLE lane reconciles to an eligible Work Unit and current task/run assignment
      - lane summary counts reconcile to ten lane records
      - closed runs release their lane unless a newer assignment replaced them
      - stale runtime values never override newer canonical runtime evidence
    pass_state: COMPLETE

bl002_domain_ssot:
  purpose: >-
    Define the approved narrative/test-design layer produced by BL-002 after planning/execution is authorized. These
    artifacts are domain SSOT for downstream testing but are not additional planning levels.
  story:
    register: stories/story-register.yaml
    schema: stories/story-schema.yaml
    artifacts: [stories/STORY-*.yaml, stories/STORY-*.md]
    authoritative_state_for_downstream: APPROVED
    approval_owner: USER
  usecase:
    register: usecases/usecase-register.yaml
    schema: usecases/usecase-schema.yaml
    artifacts: [usecases/UC-*.yaml, usecases/UC-*.md]
    authoritative_state_for_testing: APPROVED_FOR_TESTING
    approval_owner: USER
  scenarios:
    register: usecases/usecase-test-scenarios.yaml
    schema: usecases/usecase-test-scenario-schema.yaml
  cross_traceability: traceability/controller-story-usecase-map.yaml
  rules:
    - technical Story assertions originate only from Primary-Orchestrator-accepted, materialized, non-stale canonical BL-001 traceability rows
    - pending atomic-projection rows and raw or unaccepted worker evidence are forbidden BL-002 inputs
    - BL-001 and BL-002 may execute concurrently when each has independently eligible work
    - no Story or Use Case is auto-approved
    - source or contributing-Story fingerprint changes make affected approval stale
    - BL-003 consumes only APPROVED Story assertions
    - BL-004 consumes only APPROVED_FOR_TESTING Use Cases and authoritative scenarios

planning_rule: >-
  The Orchestrator must not create, replace, extend or materially modify an Execution Plan until SSOT-L1, SSOT-L2 and
  SSOT-L3 all validate COMPLETE and QG-SSOT-001 is PASS. If any level is incomplete, only framework/definition/runtime
  initialization or repair is allowed.

execution_rule: >-
  Passing QG-SSOT-001 does not itself authorize execution. Statement of Work, dependency, item-specific quality gates,
  Work Unit rules and user acceptance continue to apply. BL-002 may execute incrementally in parallel with BL-001 only
  from Primary-Orchestrator-accepted, materialized, non-stale canonical BL-001 matrix rows. BL-002 must fail closed on
  pending atomic-projection rows, raw/unaccepted evidence, or stale fingerprints. Story/Use Case approval gates remain
  fail-closed for downstream testing.
