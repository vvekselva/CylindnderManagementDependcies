version: 3
name: Invocation Health, Heartbeat, Stale and Stuck Recovery Governance
purpose: >-
  Determine whether a Cylinder Orchestrator invocation is genuinely active, idle but healthy, blocked, stale, stuck,
  recovering, or complete. Shared GitHub registry writes are not required before analysis. Invocation health is tracked in
  the execution runtime and projected to durable shared files during END_OF_ORCHESTRATION_RECONCILIATION.

authority:
  applies_to: [MANUAL_PRODUCTION_FIRE, SCHEDULED_PRODUCTION_FIRE]
  architecture: architecture/invocation-health-and-recovery.md
  invocation_registry: backlog/runtime/invocation-registry.yaml
  production_progress_guarantee: governance/production-fire-progress-guarantee.yaml
  authoritative_control_branch: chore/rename-dependency-files

startup_health:
  mandatory_shared_start_record_before_analysis: false
  required_order:
    - PIN_AUTHORITATIVE_CONTROL_BRANCH
    - GENERATE_UNIQUE_INVOCATION_ID
    - READ_PRIOR_DURABLE_INVOCATION_EVIDENCE
    - CLASSIFY_PRIOR_NONTERMINAL_INVOCATIONS
    - BUILD_IN_MEMORY_EXECUTION_PLAN
    - BUILD_END_UPDATE_SET
  registry_is_startup_gate: false
  registry_role: END_STATE_INDEX_AND_HISTORY

health_signals:
  required:
    - invocation_id
    - execution_state
    - health_state
    - heartbeat_at
    - last_progress_at
    - last_lane_activity_at
    - active_lane_count
    - coordinator_phase
    - current_backlog_item
    - current_work_unit
    - progress_fingerprint
    - blocked_reason
    - recovery_action
  running_flag_is_liveness_proof: false

heartbeat:
  interval_seconds: 60
  stale_after_seconds: 300
  runtime_first: true
  github_write_each_interval_required: false
  durable_terminal_projection_required: true
  requirements:
    - Primary Orchestrator refreshes runtime heartbeat while it owns active work or is performing aggregation, validation, synchronization or recovery.
    - Worker heartbeat does not substitute for the Primary Orchestrator heartbeat.
    - Every heartbeat state records coordinator_phase and active_lane_count in the execution journal.

progress_detection:
  progress_fingerprint_sources:
    - accepted result count
    - work-unit state
    - executor terminal result count
    - canonical matrix/story/database checkpoint
    - synchronization state
    - blocker state
  meaningful_progress_updates_last_progress_at: true
  heartbeat_without_progress_does_not_update_last_progress_at: true
  stuck_after_seconds_without_meaningful_progress: 600
  stuck_evaluation_requires_fresh_heartbeat: true

health_states:
  ACTIVE:
    condition: HEARTBEAT_FRESH_AND_MEANINGFUL_WORK_OR_PROGRESS_RECENT
  IDLE_BUT_HEALTHY:
    condition: HEARTBEAT_FRESH_AND_ZERO_ACTIVE_LANES_AND_COORDINATOR_IN_GOVERNED_NON_WORKER_PHASE
    allowed_phases: [PLANNING, AGGREGATING, VALIDATING, END_OF_ORCHESTRATION_RECONCILIATION, REPLANNING, RECOVERING]
    maximum_seconds_without_progress: 600
  BLOCKED:
    condition: ALL_OWNED_WORK_HAS_EXPLICIT_DURABLE_BLOCKERS_AND_NO_ELIGIBLE_UNCLAIMED_WORK_FOR_THIS_INVOCATION
  STALE:
    condition: HEARTBEAT_AGE_EXCEEDS_300_SECONDS
  STUCK:
    condition: HEARTBEAT_FRESH_AND_NO_MEANINGFUL_PROGRESS_FOR_600_SECONDS_AND_NOT_EXPLICITLY_BLOCKED
  RECOVERING:
    condition: FAIL_CLOSED_RECOVERY_IN_PROGRESS
  COMPLETE:
    condition: END_RECONCILIATION_PERSISTED_AND_LOCKS_RELEASED_AND_NO_ELIGIBLE_OR_RECOVERABLE_UNCLAIMED_WORK_REMAINS
  PARTIAL_CONTINUE_REQUIRED:
    condition: EXECUTION_LIMIT_OR_RECONCILIATION_FAILURE_WHILE_WORK_REMAINS

zero_lane_rule:
  zero_active_lanes_is_not_by_itself_stale_or_stuck: true
  required_interpretation:
    - If heartbeat is fresh and coordinator_phase is governed, classify IDLE_BUT_HEALTHY.
    - If heartbeat is stale, classify STALE.
    - If heartbeat is fresh but no progress exceeds stuck threshold and no durable blocker exists, classify STUCK.
    - If all work has durable blockers and no other eligible work exists, classify BLOCKED.
    - If eligible unclaimed work exists while execution budget is open, zero lanes requires REPLAN_AND_DISPATCH.

productive_completion_guard:
  terminal_checkpoint_forbidden_when:
    - eligible_unclaimed_work_exists
    - active_lane_count_is_zero
    - productive_window_is_open
  mandatory_action: REPLAN_CLAIM_AND_DISPATCH
  one_blocked_stream_does_not_stop_other_eligible_streams: true
  status_check_only_is_not_production_completion: true
  complete_while_eligible_work_exists_forbidden: true

recovery:
  prior_nonterminal_evidence:
    action: FAIL_CLOSED_RECOVERY_ANALYSIS
    steps:
      - verify latest durable heartbeat or terminal evidence
      - verify no live worker or executor still owns the task
      - preserve completed durable evidence
      - reject incomplete partial output
      - add required recovery corrections to the end update set
      - do not rewrite the shared registry during startup only to record recovery
  BLOCKED:
    action: CLEAN_TERMINATION
    steps:
      - persist blocker in final reconciliation
      - release execution locks
      - do not wait artificially to reach productive-window duration
      - confirm no other eligible unclaimed work exists before terminal BLOCKED

trigger_preflight:
  before_starting_execution:
    - pin authoritative control branch chore/rename-dependency-files
    - create invocation identity in execution memory
    - read authoritative registry and terminal logs as evidence
    - evaluate prior heartbeat age where durable evidence exists
    - classify prior nonterminal invocations
    - build execution plan and end update set
  rules:
    - ACTIVE or IDLE_BUT_HEALTHY prior live owner: respect singleton/concurrency governance
    - STALE: recover ownership before duplicate work
    - STUCK: diagnose and recover before duplicate work
    - BLOCKED zombie: schedule final correction and release capacity
    - COMPLETE: never blocks a new trigger

terminal_persistence:
  shared_updates_phase: END_OF_ORCHESTRATION_RECONCILIATION
  registry_terminal_record_required: true
  durable_terminal_log_required: true
  registry_and_log_must_reconcile: true
  COMPLETE_requires:
    - final reconciliation persisted
    - execution locks released
    - no eligible or recoverable unclaimed work remains
  PARTIAL_CONTINUE_REQUIRED_requires:
    - eligible or recoverable unclaimed work remains
    - execution limit or safe checkpoint prevents more dispatch
  reconciliation_failure:
    health_state: RECOVERING
    terminal_state: PARTIAL_CONTINUE_REQUIRED
    production_success_claim_forbidden: true

observability:
  status_report_must_include:
    - invocation_id
    - execution_state
    - health_state
    - heartbeat_age_seconds
    - seconds_since_progress
    - active_lane_count
    - coordinator_phase
    - current_backlog_item
    - current_work_unit
    - blocker_or_recovery_action
    - eligible_unclaimed_work_count
    - workers_started
    - canonical_progress_delta
    - reconciliation_outcome

safety:
  fail_closed: true
  duplicate_work_during_uncertain_health_forbidden: true
  healthy_long_running_task_must_not_be_killed_only_for_exceeding_30_minutes: true
  stale_detection_uses_heartbeat_not_total_runtime: true
  stuck_detection_uses_fresh_heartbeat_plus_no_progress: true
  complete_requires_truthful_work_exhaustion_and_successful_end_reconciliation: true
