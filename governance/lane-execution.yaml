version: 6
name: Real Lane Dispatch And Utilization Governance
architecture: architecture/self-reliant-e2e-execution.md
self_reliant_governance: governance/self-reliant-execution.yaml
purpose: >-
  Run measurable independent OS workers from source supplied by an approved self-reliant source provider,
  while keeping GitHub as Version Control/persistence and the Automation Tool as Orchestrator/execution engine.

architecture_roles:
  github:
    role: VERSION_CONTROL_AND_DURABLE_PERSISTENCE
    repositories: [vvekselva/CylinderManagement, vvekselva/CylindnderManagementDependcies]
    explicitly_not_required_for_execution: [GitHub Actions, GitHub-hosted runners, workflow run ID]
  automation_tool:
    role: ORCHESTRATOR_SOURCE_STAGER_EXECUTION_VALIDATION_RECOVERY_ENGINE
  local_execution_engine:
    implementation: LOCAL_PROCESS_POOL
    max_parallel_workers: 10

source_provider:
  governance: governance/source-provider.yaml
  gate: QG-SOURCE-001
  preferred: ORCHESTRATOR_STAGED_SNAPSHOT
  fallback: LOCAL_GIT_CHECKOUT
  preexisting_local_source_checkout_required: false
  workers_access_github_directly: false
  recursive_source_requests: [missing_source_requests, missing_binding_requests]
  maximum_staging_iterations: 8

worker_backend:
  type: LOCAL_PROCESS_POOL
  queue_ssot: backlog/runtime/<BL-ID>/lane-dispatch.yaml
  lane_state_ssot: backlog/runtime/<BL-ID>/lane-status.yaml
  execution_ssot: backlog/runtime/<BL-ID>/local-execution.yaml
  source_repository: vvekselva/CylinderManagement
  max_parallel_workers: 10
  staged_executor_script: automation/staged-lane-executor-v3.py
  staged_worker_script: automation/staged-lane-worker-v3.py
  local_git_executor_script: automation/local-lane-executor.py
  local_git_worker_script: automation/local-lane-worker.py
  local_git_windows_fire_script: automation/fire-local-lanes.ps1
  github_actions_dependency: NONE
  final_trace_decision_owner: PRIMARY_ORCHESTRATOR

preflight_rules:
  - every dispatched task must be READY and safe_independent=true
  - duplicate lane IDs are rejected before worker start
  - duplicate task IDs are rejected before worker start
  - source manifest repository and baseline must match dispatch
  - every controller root must be present and integrity verified
  - stale transient lane logs must equal zero
  - source/binding integrity failure blocks affected SERVICE

source_integrity_rules:
  - every source input is pinned to dispatch source_baseline
  - ORCHESTRATOR_STAGED_SNAPSHOT requires a manifest with repository baseline path and exact Git blob SHA
  - staged workers recompute Git blob SHA before reading each component
  - interface injection requires a source-validated manifest binding before following an implementation
  - qualifier or variable naming may locate a candidate but never proves a dependency
  - missing source/binding remains explicit and triggers bounded Orchestrator restage/rebind
  - identical unresolved request set with no new verified source becomes SOURCE_RESOLUTION_STALLED
  - source evidence from any provider never auto-classifies an endpoint COMPLETE

lifecycle_and_recovery:
  required_worker_events: [LANE_INIT_START, LANE_INIT_END, LANE_SERVICE_START, LANE_SERVICE_END, LANE_CLOSE_END]
  heartbeat_required: true
  execution_journal_required: true
  dispatch_fingerprint_required: true
  pending_sync_same_fingerprint: RETRY_SYNC_ONLY_NO_WORKER_RESTART
  interrupted_running_without_live_workers: RECOVERY_REQUIRED_REJECT_PARTIAL_OUTPUT
  closed_evidence_awaiting_validation: VALIDATE_EXISTING_EVIDENCE_NO_WORKER_RESTART
  closed_synced_same_fingerprint: NOOP_ALREADY_COMMITTED
  transient_lane_logs_after_aggregate_must_equal_zero: true

metrics:
  configured_lanes: 10
  expected_concurrent_lanes_formula: min(configured_lanes, eligible_independent_tasks)
  peak_service_concurrent_lanes: maximum overlapping LANE_SERVICE_START to LANE_SERVICE_END intervals
  average_service_concurrent_lanes: aggregate service seconds / service batch wall-clock seconds
  peak_service_capacity_utilization_percentage: peak_service_concurrent_lanes / configured_lanes * 100
  warning: Distinct lane IDs or process creation are not concurrency metrics.

quality_gate:
  id: QG-LANE-001
  name: Real Lane Utilization Gate
  owner: ORCHESTRATOR
  category: PERFORMANCE_GOVERNANCE
  pass_condition: >-
    For the natural production workload, when two or more safe independent tasks are dispatched, measured
    peak SERVICE concurrency reaches expected safe concurrency. Fewer than two tasks require no artificial parallelism.
  underutilized_condition: >-
    Natural workload peak SERVICE concurrency is below expected safe concurrency. Preserve correct source evidence,
    record underutilization, and never manufacture delays solely to pass this performance gate.
  backend_capacity_evidence: >-
    A separate process-pool capacity probe may prove the backend can physically reach ten workers, but it does not
    substitute for measured natural production SERVICE concurrency.
  fail_closed_for_parallelism_claim: true
  does_not_invalidate_source_evidence: true

validation_2026_08_23:
  report: tests/self-reliant-e2e-validation-2026-08-23.md
  jpa_canary_execution: E2E-STAGED-20260823-151800
  canary_qg_source: SOURCE_CLOSURE_COMPLETE
  full_discovery_execution: E2E-STAGED-20260823-151810
  full_discovery_workers_started: 10
  full_discovery_worker_failures: 0
  full_discovery_peak_service_concurrent_lanes: 4
  full_discovery_average_service_concurrent_lanes: 0.26
  full_discovery_qg_lane: UNDERUTILIZED
  full_discovery_source_closure: PARTIAL_RESTAGE_REQUIRED
  backend_capacity_probe_peak: 10
  transient_lane_logs_remaining: 0
  trace_evidence_auto_accepted: false

artifact_contract:
  staged_snapshot_manifest: source-snapshot-manifest.json
  source_staging_requests: source-staging-requests.json
  execution_journal: execution-journal.json
  staged_execution_summary: summary.json
  durable_invocation_log: logs/runs/<execution-id>.md
  durable_aggregate: worker/evidence/<execution-id>/
  execution_status_file: backlog/runtime/BL-001/local-execution.yaml
