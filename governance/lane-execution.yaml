version: 5
name: Real Lane Dispatch And Utilization Governance
purpose: >-
  Convert orchestration lanes from logical labels into measurable independent OS worker executions while keeping GitHub as Version Control/persistence and the Automation Tool as source stager and execution engine.

architecture_roles:
  github:
    role: VERSION_CONTROL_AND_DURABLE_PERSISTENCE
    repositories: [vvekselva/CylinderManagement, vvekselva/CylindnderManagementDependcies]
    explicitly_not_required_for_execution: [GitHub Actions, GitHub-hosted runners, workflow run ID]
  automation_tool:
    role: ORCHESTRATOR_SOURCE_STAGER_AND_EXECUTION_ENGINE
    responsibilities:
      - validate SSOT and gates
      - select safe independent work
      - materialize exact source input through an approved source provider
      - create lane dispatch
      - execute local process pool
      - enforce lifecycle logging and aggregate cleanup
      - measure real SERVICE concurrency
      - validate endpoint evidence and synchronize accepted results
  local_execution_engine:
    implementation: LOCAL_PROCESS_POOL
    max_parallel_workers: 10

source_provider:
  governance: governance/source-provider.yaml
  gate: QG-SOURCE-001
  preferred: ORCHESTRATOR_STAGED_SNAPSHOT
  fallback: LOCAL_GIT_CHECKOUT
  preexisting_local_source_checkout_required: false
  workers_access_github_directly: false

worker_backend:
  type: LOCAL_PROCESS_POOL
  queue_ssot: backlog/runtime/<BL-ID>/lane-dispatch.yaml
  lane_state_ssot: backlog/runtime/<BL-ID>/lane-status.yaml
  execution_ssot: backlog/runtime/<BL-ID>/local-execution.yaml
  source_repository: vvekselva/CylinderManagement
  max_parallel_workers: 10
  staged_executor_script: automation/staged-lane-executor.py
  staged_worker_script: automation/staged-lane-worker.py
  local_git_executor_script: automation/local-lane-executor.py
  local_git_worker_script: automation/local-lane-worker.py
  local_git_windows_fire_script: automation/fire-local-lanes.ps1
  github_actions_dependency: NONE
  final_trace_decision_owner: PRIMARY_ORCHESTRATOR

source_integrity_rules:
  - every worker source input is pinned to the dispatch source_baseline
  - ORCHESTRATOR_STAGED_SNAPSHOT requires source-snapshot-manifest.json with repository baseline path and exact Git blob SHA for each materialized file
  - staged workers recompute the Git blob hash before reading each source component
  - a controller root hash mismatch or missing manifest entry blocks SERVICE
  - missing downstream components remain explicit as missing_component_references and trigger another Orchestrator staging iteration
  - LOCAL_GIT_CHECKOUT remains an optional fast path using a temporary detached worktree at the frozen commit
  - source evidence from either provider never auto-classifies an endpoint COMPLETE

safety_rules:
  - every dispatched task must be READY and safe_independent=true
  - workers are read-only against their verified source_root
  - workers must not modify application source or shared control files
  - one task is assigned to one lane for one execution
  - every worker writes INIT SERVICE CLOSE lifecycle evidence with exact task identity
  - no table view service or dependency may be accepted from naming alone
  - individual lane logs are transient and must be aggregated verified deleted and rescanned to zero

metrics:
  configured_lanes: 10
  expected_concurrent_lanes_formula: min(configured_lanes, eligible_independent_tasks)
  peak_service_concurrent_lanes: maximum overlapping LANE_SERVICE_START to LANE_SERVICE_END intervals
  average_service_concurrent_lanes: aggregate service seconds / service batch wall-clock seconds
  peak_service_capacity_utilization_percentage: peak_service_concurrent_lanes / configured_lanes * 100

quality_gate:
  id: QG-LANE-001
  name: Real Lane Utilization Gate
  owner: ORCHESTRATOR
  category: PERFORMANCE_GOVERNANCE
  pass_condition: >-
    When two or more safe independent tasks are dispatched, measured peak SERVICE concurrency reaches expected safe concurrency. Fewer than two independent tasks require no artificial parallelism.
  underutilized_condition: >-
    measured peak SERVICE concurrency is below expected safe concurrency. Preserve valid source evidence but do not claim full utilization.
  fail_closed_for_parallelism_claim: true
  does_not_invalidate_source_evidence: true

validated_real_source_run:
  execution_id: PROD-STAGED-BL001-20260823-145139
  source_provider: ORCHESTRATOR_STAGED_SNAPSHOT
  controller_roots_verified: 10
  materialized_files: 25
  workers_started: 10
  worker_results_received: 10
  worker_failures: 0
  peak_service_concurrent_lanes: 9
  average_service_concurrent_lanes: 4.65
  peak_capacity_utilization_percentage: 90
  qg_lane_001_state: UNDERUTILIZED
  individual_lane_logs_remaining: 0
  remaining_staged_component_references: [TripReturnWorkflowService, CustomerAddressLocationOfflineMapService]
  trace_evidence_auto_accepted: false

artifact_contract:
  staged_snapshot_manifest: source-snapshot-manifest.json
  staged_execution_summary: production-fire-summary.json
  durable_invocation_log: logs/runs/<execution-id>.md
  durable_aggregate: worker/evidence/<execution-id>/
  execution_status_file: backlog/runtime/BL-001/local-execution.yaml
  transient_individual_lane_logs_deleted_after_verified_aggregation: true
