version: 3
name: Real Lane Dispatch And Utilization Governance
purpose: >-
  Convert orchestration lanes from logical labels into measurable independent local OS worker executions without depending on GitHub Actions or another external worker service.

worker_backend:
  type: LOCAL_PROCESS_POOL
  control_repository: vvekselva/CylindnderManagementDependcies
  queue_ssot: backlog/runtime/<BL-ID>/lane-dispatch.yaml
  lane_state_ssot: backlog/runtime/<BL-ID>/lane-status.yaml
  execution_ssot: backlog/runtime/<BL-ID>/local-execution.yaml
  source_repository: vvekselva/CylinderManagement
  max_parallel_workers: 10
  executor_script: automation/local-lane-executor.py
  worker_script: automation/local-lane-worker.py
  windows_fire_script: automation/fire-local-lanes.ps1
  external_service_dependency: NONE
  final_trace_decision_owner: CONTROL_REPOSITORY_ORCHESTRATOR

source_baseline_rule: >-
  The executor never changes the user's active source checkout. It verifies that the frozen commit exists and creates a temporary detached Git worktree at the exact source baseline. All local lane workers read that worktree concurrently and the worktree is removed after closure.

safety_rules:
  - every dispatched task must be READY and safe_independent=true
  - local workers are read-only against the temporary frozen-baseline worktree
  - workers must not modify application source or shared control files
  - one task is assigned to one lane for one execution
  - every worker writes INIT SERVICE CLOSE lifecycle evidence with exact task identity
  - worker evidence does not automatically classify an endpoint COMPLETE
  - the primary Orchestrator validates endpoint-by-endpoint call paths and may preserve UNRESOLVED
  - no table/view/service dependency may be accepted from naming alone
  - individual lane logs are transient and must be aggregated, verified and deleted before invocation closure
  - local-execution.yaml and lane-status.yaml must be synchronized with OS process state and measured results

logging_and_boundary_rules:
  preflight: individual logs/runs/*-LANE-*.md count must be zero before fire
  during_execution: one transient lane log per local worker is allowed
  closure: aggregate all lane logs into the durable invocation log, verify representation, delete lane logs, rescan to zero
  gate: QG-LOG-001

metrics:
  configured_lanes: 10
  expected_concurrent_lanes_formula: min(configured_lanes, eligible_independent_tasks)
  distinct_lanes_used: number of different lane IDs that produced worker results
  peak_worker_processes_alive: maximum overlapping worker process intervals
  average_worker_processes_alive: aggregate worker process seconds / worker batch wall-clock seconds
  peak_service_concurrent_lanes: maximum overlapping LANE_SERVICE_START to LANE_SERVICE_END intervals
  average_service_concurrent_lanes: aggregate service seconds / service batch wall-clock seconds
  peak_service_capacity_utilization_percentage: peak_service_concurrent_lanes / configured_lanes * 100

quality_gate:
  id: QG-LANE-001
  name: Real Lane Utilization Gate
  owner: ORCHESTRATOR
  category: PERFORMANCE_GOVERNANCE
  pass_condition: >-
    When two or more safe independent tasks are dispatchable, measured peak SERVICE concurrency reaches expected safe concurrency. Fewer than two independent tasks require no artificial parallelism.
  ready_before_measurement_condition: >-
    The local executor and worker scripts exist, the dispatch queue is valid, the source repository path is available, the frozen commit exists locally, and zero transient lane logs remain. In this state QG-LANE-001 is READY_FOR_MEASUREMENT until a fire occurs.
  underutilized_condition: >-
    peak_service_concurrent_lanes is below expected safe concurrency and no dependency, CPU/process/resource limit or source-lock constraint explains the shortfall.
  fail_closed_for_parallelism_claim: true
  does_not_invalidate_source_evidence: true
  on_underutilized: >-
    Preserve valid worker evidence, mark LANE_UNDERUTILIZED, record the measured concurrency gap, and correct local process capacity or dispatch before claiming the utilization problem solved.

artifact_contract:
  durable_invocation_log: logs/runs/LOCAL-BL001-<timestamp>.md
  durable_aggregate: worker/evidence/LOCAL-BL001-<timestamp>/lane-dispatch-aggregate.yaml
  summary_file: worker/evidence/LOCAL-BL001-<timestamp>/lane-dispatch-summary.md
  execution_status_file: backlog/runtime/BL-001/local-execution.yaml
  transient_individual_lane_logs_deleted_after_verified_aggregation: true
