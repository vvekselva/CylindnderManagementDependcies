name: Lane Matrix Dispatch

on:
  workflow_dispatch:
  push:
    branches:
      - chore/rename-dependency-files
    paths:
      - backlog/runtime/BL-001/lane-dispatch.yaml

permissions:
  contents: read
  actions: write

env:
  DISPATCH_FILE: backlog/runtime/BL-001/lane-dispatch.yaml

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      task_count: ${{ steps.matrix.outputs.task_count }}
      source_baseline: ${{ steps.matrix.outputs.source_baseline }}
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml
      - name: Build safe lane matrix
        id: matrix
        shell: bash
        run: |
          python - <<'PY'
          import json, os, yaml
          from pathlib import Path
          d = yaml.safe_load(Path(os.environ['DISPATCH_FILE']).read_text())['lane_dispatch']
          tasks = [t for t in d.get('tasks', []) if t.get('status') == 'READY' and t.get('safe_independent') is True][:10]
          lanes = [t['lane'] for t in tasks]
          if len(lanes) != len(set(lanes)):
              raise SystemExit('Duplicate lane assignment in one matrix batch')
          include = [{'lane': t['lane'], 'task_id': t['task_id']} for t in tasks]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('matrix=' + json.dumps({'include': include}, separators=(',', ':')) + '\n')
              fh.write('task_count=' + str(len(include)) + '\n')
              fh.write('source_baseline=' + str(d['source_baseline']) + '\n')
          print(f'Eligible matrix tasks: {len(include)}')
          PY

  worker:
    needs: prepare
    if: needs.prepare.outputs.task_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml
      - name: Checkout frozen CylinderManagement source
        shell: bash
        env:
          SOURCE_BASELINE: ${{ needs.prepare.outputs.source_baseline }}
        run: |
          git clone --quiet --no-checkout https://github.com/vvekselva/CylinderManagement.git source
          git -C source fetch --quiet --depth=1 origin "$SOURCE_BASELINE"
          git -C source checkout --quiet --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_BASELINE"
      - name: Execute independent lane evidence worker
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          TASK_ID: ${{ matrix.task_id }}
        run: |
          OUT="out/${LANE}-${TASK_ID}"
          python automation/lane-worker.py \
            --dispatch "$DISPATCH_FILE" \
            --lane "$LANE" \
            --task-id "$TASK_ID" \
            --source-root source \
            --output-dir "$OUT"
      - name: Upload transient isolated lane result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-result-${{ matrix.lane }}-${{ matrix.task_id }}
          path: out/${{ matrix.lane }}-${{ matrix.task_id }}/
          if-no-files-found: error
          retention-days: 1

  summarize:
    needs: [prepare, worker]
    if: always() && needs.prepare.outputs.task_count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml
      - name: Download transient lane artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lane-result-*
          path: downloaded-lane-results
      - name: Verify expected lane results and calculate real concurrency
        env:
          TASK_COUNT: ${{ needs.prepare.outputs.task_count }}
        run: |
          FOUND=$(find downloaded-lane-results -name lane-result.yaml -type f | wc -l | tr -d ' ')
          test "$FOUND" = "$TASK_COUNT"
          python automation/lane-summary.py \
            --results-root downloaded-lane-results \
            --output-dir lane-summary \
            --configured-lanes 10 \
            --eligible-tasks "$TASK_COUNT"
          mkdir -p lane-summary/lanes
          cp -R downloaded-lane-results/. lane-summary/lanes/
      - name: Upload durable aggregated lane evidence
        uses: actions/upload-artifact@v4
        with:
          name: lane-dispatch-aggregate
          path: lane-summary/
          if-no-files-found: error
          retention-days: 14
      - name: Delete transient individual lane artifacts after verified aggregation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          IDS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | startswith("lane-result-")) | .id')
          for id in $IDS; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done
          REMAIN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --paginate \
            --jq '[.artifacts[] | select(.name | startswith("lane-result-"))] | length')
          test "$REMAIN" = "0"
          echo "Transient lane artifacts remaining: $REMAIN"
