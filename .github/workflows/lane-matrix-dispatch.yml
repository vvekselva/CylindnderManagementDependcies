name: Lane Matrix Dispatch

on:
  workflow_dispatch:
  push:
    branches:
      - chore/rename-dependency-files
    paths:
      - backlog/runtime/BL-001/lane-dispatch.yaml

permissions:
  contents: write
  actions: write

env:
  DISPATCH_FILE: backlog/runtime/BL-001/lane-dispatch.yaml
  MATRIX_STATUS_FILE: backlog/runtime/BL-001/matrix-execution.yaml
  CONTROL_BRANCH: chore/rename-dependency-files

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      task_count: ${{ steps.matrix.outputs.task_count }}
      source_baseline: ${{ steps.matrix.outputs.source_baseline }}
      dispatch_id: ${{ steps.matrix.outputs.dispatch_id }}
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml
      - name: Build safe lane matrix
        id: matrix
        shell: bash
        run: |
          python - <<'PY'
          import json, os, yaml
          from pathlib import Path
          d = yaml.safe_load(Path(os.environ['DISPATCH_FILE']).read_text())['lane_dispatch']
          tasks = [t for t in d.get('tasks', []) if t.get('status') == 'READY' and t.get('safe_independent') is True][:10]
          lanes = [t['lane'] for t in tasks]
          if len(lanes) != len(set(lanes)):
              raise SystemExit('Duplicate lane assignment in one matrix batch')
          include = [{'lane': t['lane'], 'task_id': t['task_id']} for t in tasks]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('matrix=' + json.dumps({'include': include}, separators=(',', ':')) + '\n')
              fh.write('task_count=' + str(len(include)) + '\n')
              fh.write('source_baseline=' + str(d['source_baseline']) + '\n')
              fh.write('dispatch_id=' + str(d.get('dispatch_id', 'UNSPECIFIED')) + '\n')
          print(f'Eligible matrix tasks: {len(include)}')
          PY

  record-start:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable control branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROL_BRANCH }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml
      - name: Persist external matrix run identity
        env:
          DISPATCH_ID: ${{ needs.prepare.outputs.dispatch_id }}
          TASK_COUNT: ${{ needs.prepare.outputs.task_count }}
        run: |
          python - <<'PY'
          import os, yaml
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path(os.environ['MATRIX_STATUS_FILE'])
          doc = {
            'matrix_execution': {
              'version': 1,
              'backlog_item': 'BL-001',
              'work_unit': 'WU-BL001-001',
              'dispatch_id': os.environ['DISPATCH_ID'],
              'workflow': 'Lane Matrix Dispatch',
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'workflow_run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'triggering_sha': os.environ['GITHUB_SHA'],
              'state': 'RUNNING',
              'started_at': datetime.now(timezone.utc).isoformat(),
              'expected_tasks': int(os.environ['TASK_COUNT']),
              'expected_concurrent_lanes': min(10, int(os.environ['TASK_COUNT'])),
              'aggregate_artifact': 'lane-dispatch-aggregate',
              'peak_concurrent_lanes': None,
              'average_concurrent_lanes': None,
              'peak_capacity_utilization_percentage': None,
              'qg_lane_001_state': 'PENDING_EXECUTION_EVIDENCE',
              'transient_lane_artifacts_remaining': None,
              'orchestrator_consumption_state': 'WAITING_FOR_AGGREGATE'
            }
          }
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(yaml.safe_dump(doc, sort_keys=False), encoding='utf-8')
          PY
          git config user.name "cylinder-matrix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$MATRIX_STATUS_FILE"
          git commit -m "Record matrix run ${GITHUB_RUN_ID} start" || true
          git pull --rebase origin "$CONTROL_BRANCH"
          git push origin "HEAD:$CONTROL_BRANCH"

  worker:
    needs: [prepare, record-start]
    if: needs.prepare.outputs.task_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout control repository at dispatch commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml
      - name: Checkout frozen CylinderManagement source
        shell: bash
        env:
          SOURCE_BASELINE: ${{ needs.prepare.outputs.source_baseline }}
        run: |
          git clone --quiet --no-checkout https://github.com/vvekselva/CylinderManagement.git source
          git -C source fetch --quiet --depth=1 origin "$SOURCE_BASELINE"
          git -C source checkout --quiet --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_BASELINE"
      - name: Execute independent lane evidence worker
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          TASK_ID: ${{ matrix.task_id }}
        run: |
          OUT="out/${LANE}-${TASK_ID}"
          python automation/lane-worker.py \
            --dispatch "$DISPATCH_FILE" \
            --lane "$LANE" \
            --task-id "$TASK_ID" \
            --source-root source \
            --output-dir "$OUT"
      - name: Upload transient isolated lane result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-result-${{ matrix.lane }}-${{ matrix.task_id }}
          path: out/${{ matrix.lane }}-${{ matrix.task_id }}/
          if-no-files-found: error
          retention-days: 1

  summarize:
    needs: [prepare, record-start, worker]
    if: always() && needs.prepare.outputs.task_count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable control branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROL_BRANCH }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml
      - name: Download transient lane artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lane-result-*
          path: downloaded-lane-results
      - name: Verify expected lane results and calculate real concurrency
        env:
          TASK_COUNT: ${{ needs.prepare.outputs.task_count }}
        run: |
          FOUND=$(find downloaded-lane-results -name lane-result.yaml -type f | wc -l | tr -d ' ')
          test "$FOUND" = "$TASK_COUNT"
          python automation/lane-summary.py \
            --results-root downloaded-lane-results \
            --output-dir lane-summary \
            --configured-lanes 10 \
            --eligible-tasks "$TASK_COUNT" || true
          mkdir -p lane-summary/lanes
          cp -R downloaded-lane-results/. lane-summary/lanes/
      - name: Upload durable aggregated lane evidence
        uses: actions/upload-artifact@v4
        with:
          name: lane-dispatch-aggregate
          path: lane-summary/
          if-no-files-found: error
          retention-days: 14
      - name: Delete transient individual lane artifacts after verified aggregation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          IDS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | startswith("lane-result-")) | .id')
          for id in $IDS; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done
          REMAIN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --paginate \
            --jq '[.artifacts[] | select(.name | startswith("lane-result-"))] | length')
          echo "$REMAIN" > transient_remaining.txt
          test "$REMAIN" = "0"
      - name: Persist completed matrix measurements
        env:
          DISPATCH_ID: ${{ needs.prepare.outputs.dispatch_id }}
        run: |
          python - <<'PY'
          import os, yaml
          from datetime import datetime, timezone
          from pathlib import Path
          status_path = Path(os.environ['MATRIX_STATUS_FILE'])
          summary = yaml.safe_load(Path('lane-summary/lane-dispatch-summary.yaml').read_text())['lane_dispatch_summary']
          existing = yaml.safe_load(status_path.read_text()) if status_path.exists() else {}
          root = existing.get('matrix_execution', {})
          root.update({
            'version': 2,
            'dispatch_id': os.environ['DISPATCH_ID'],
            'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
            'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
            'workflow_run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
            'state': 'COMPLETED' if int(summary.get('worker_failures', 0)) == 0 else 'COMPLETED_WITH_WORKER_FAILURES',
            'completed_at': datetime.now(timezone.utc).isoformat(),
            'expected_tasks': int(summary['eligible_independent_tasks']),
            'worker_results_received': int(summary['worker_results_received']),
            'distinct_lanes_used': int(summary['distinct_lanes_used']),
            'expected_concurrent_lanes': int(summary['expected_concurrent_lanes']),
            'peak_concurrent_lanes': int(summary['peak_concurrent_lanes']),
            'average_concurrent_lanes': float(summary['average_concurrent_lanes']),
            'peak_capacity_utilization_percentage': float(summary['peak_capacity_utilization_percentage']),
            'worker_failures': int(summary['worker_failures']),
            'qg_lane_001_state': summary['qg_lane_001_state'],
            'qg_lane_001_reason': summary['qg_lane_001_reason'],
            'aggregate_artifact': 'lane-dispatch-aggregate',
            'transient_lane_artifacts_remaining': int(Path('transient_remaining.txt').read_text().strip()),
            'orchestrator_consumption_state': 'READY_FOR_ORCHESTRATOR_VALIDATION'
          })
          status_path.write_text(yaml.safe_dump({'matrix_execution': root}, sort_keys=False), encoding='utf-8')
          PY
          git config user.name "cylinder-matrix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$MATRIX_STATUS_FILE"
          git commit -m "Record matrix run ${GITHUB_RUN_ID} completion" || true
          git pull --rebase origin "$CONTROL_BRANCH"
          git push origin "HEAD:$CONTROL_BRANCH"
      - name: Fail run if evidence workers failed
        run: |
          FAILURES=$(python - <<'PY'
          import yaml
          s=yaml.safe_load(open('lane-summary/lane-dispatch-summary.yaml'))['lane_dispatch_summary']
          print(s['worker_failures'])
          PY
          )
          test "$FAILURES" = "0"
