name: Three-Level SSOT Gate

on:
  push:
    branches:
      - main
      - chore/rename-dependency-files
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-ssot:
    name: Validate Level 1 2 3 SSOT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install YAML parser
        run: python3 -m pip install --quiet pyyaml
      - name: Validate three-level SSOT planning prerequisites
        run: python3 automation/validate-ssot.py
