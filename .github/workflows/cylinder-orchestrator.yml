name: Cylinder Orchestrator Runner

on:
  workflow_dispatch:
  push:
    branches:
      - chore/rename-dependency-files
    paths:
      - 'backlog/runtime/orchestrator-requests/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: cylinder-primary-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    name: Governed Cylinder Production Fire
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4
        with:
          ref: chore/rename-dependency-files
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "Cylinder Orchestrator"
          git config user.email "cylinder-orchestrator@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prove hosted process runtime
        shell: bash
        run: |
          set -euo pipefail
          python --version
          java -version
          mvn -version
          node --version
          git --version

      - name: Install orchestrator Python dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Detect private-source credential
        id: source-auth
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.CYLINDER_SOURCE_TOKEN }}
        run: |
          if [ -n "$SOURCE_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout frozen CylinderManagement source
        if: steps.source-auth.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: vvekselva/CylinderManagement
          ref: 3ae6e61442132d94a307275b08dd65fcef228d89
          token: ${{ secrets.CYLINDER_SOURCE_TOKEN }}
          path: .orchestrator-source/CylinderManagement
          fetch-depth: 1

      - name: Verify frozen source identity
        if: steps.source-auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git -C .orchestrator-source/CylinderManagement rev-parse HEAD)"
          test "$ACTUAL_SHA" = "3ae6e61442132d94a307275b08dd65fcef228d89"

      - name: Execute governed orchestrator cycle
        env:
          CYLINDER_SOURCE_AVAILABLE: ${{ steps.source-auth.outputs.available }}
          CYLINDER_SOURCE_ROOT: ${{ github.workspace }}/.orchestrator-source/CylinderManagement
          NEON_JDBC_URL: ${{ secrets.NEON_JDBC_URL }}
          NEON_DB_USER: ${{ secrets.NEON_DB_USER }}
          NEON_DB_PASSWORD: ${{ secrets.NEON_DB_PASSWORD }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: python automation/github-runner-orchestrator.py --repo-root "$GITHUB_WORKSPACE"

      - name: Persist durable execution result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .orchestrator-source
          git add -A
          if git diff --cached --quiet; then
            echo "No durable repository changes to persist."
            exit 0
          fi
          git commit -m "orchestrator: persist hosted runner execution $GITHUB_RUN_ID"
          git pull --rebase origin chore/rename-dependency-files
          git push origin HEAD:chore/rename-dependency-files
